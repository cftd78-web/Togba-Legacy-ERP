<script>
/* ================================================================
   STATE  — global variables
   ================================================================ */
var token               = "";
var currentUser         = { name:"", role:"", email:"" };
var selectedChannelID   = "";
var userChannels        = [];
var channelDirectory    = [];
var messagingRecipients = [];
var selectedProjectID   = "";
var projectsCache       = [];
var projectPermissions  = { canCreateProject:false, canEditTask:false };
var projectsLoaded      = false;
var financeLoaded       = false;
var voteDataLoaded      = false;
var votePermissions     = { canCreateVote:false, canCastBallot:false };
var timelineLoaded      = false;
var adminLoaded         = false;
var sosLoaded           = false;
var familyLoaded        = false;
var currentPage         = "home";
var sidebarExpanded     = true;
var financeChartInstance     = null;
var allocationChartInstance  = null;
var founderLockChartInstance = null;
var voteChartInstance        = null;

/* ================================================================
   THEME SYSTEM
   ================================================================ */
(function(){
  var ICONS  = { auto:"brightness_auto", light:"light_mode", dark:"dark_mode" };
  var LABELS = { auto:"Auto", light:"Light", dark:"Dark" };

  function applyTheme(mode){
    var h = document.getElementById("html-root");
    if(!h) return;
    h.classList.remove("dark","light","theme-auto");
    h.classList.add(mode==="dark"?"dark":mode==="light"?"light":"theme-auto");
    try{ localStorage.setItem("togba-theme", mode); }catch(e){}
    _updateThemeUI(mode);
  }

  function _updateThemeUI(mode){
    var icon  = ICONS[mode]  || "brightness_auto";
    var label = LABELS[mode] || "Auto";
    ["topbar-theme-icon","sidebar-theme-icon"].forEach(function(id){
      var el=document.getElementById(id); if(el) el.innerText=icon;
    });
    ["topbar-theme-label","sidebar-theme-label"].forEach(function(id){
      var el=document.getElementById(id); if(el) el.innerText=label;
    });
  }

  window.cycleTheme = function(){
    var cur = "";
    try{ cur=localStorage.getItem("togba-theme")||"auto"; }catch(e){ cur="auto"; }
    var next = cur==="auto"?"light":cur==="light"?"dark":"auto";
    applyTheme(next);
  };

  // Init immediately
  var saved="auto";
  try{ saved=localStorage.getItem("togba-theme")||"auto"; }catch(e){}
  applyTheme(saved);
})();

/* ================================================================
   SIDEBAR TOGGLE
   ================================================================ */
window.toggleSidebar = function(){
  sidebarExpanded = !sidebarExpanded;
  var s = document.getElementById("sidebar");
  var c = document.getElementById("main-content");
  var i = document.getElementById("sidebar-toggle-icon");
  if(s) s.classList.toggle("sidebar-collapsed", !sidebarExpanded);
  if(c) c.classList.toggle("sidebar-collapsed-content", !sidebarExpanded);
  if(i) i.innerText = sidebarExpanded ? "chevron_left" : "chevron_right";
  try{ localStorage.setItem("togba-sidebar", sidebarExpanded?"1":"0"); }catch(e){}
};

// Restore sidebar state on load
(function(){
  var saved="1";
  try{ saved=localStorage.getItem("togba-sidebar"); }catch(e){}
  if(saved==="0"){
    sidebarExpanded=false;
    document.addEventListener("DOMContentLoaded",function(){
      var s=document.getElementById("sidebar");
      var c=document.getElementById("main-content");
      var i=document.getElementById("sidebar-toggle-icon");
      if(s) s.classList.add("sidebar-collapsed");
      if(c) c.classList.add("sidebar-collapsed-content");
      if(i) i.innerText="chevron_right";
    });
  }
})();

/* ================================================================
   UTILITIES
   ================================================================ */
function escapeHtml(str){
  return String(str||"")
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

function formatDate(val){
  if(!val) return "—";
  try{
    var d=new Date(val);
    if(isNaN(d.getTime())) return String(val);
    return d.toLocaleDateString("en-US",{year:"numeric",month:"short",day:"numeric"});
  }catch(e){ return String(val); }
}

function formatCurrency(val){
  var n=Number(val)||0;
  return "$"+n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
}

function formatPercent(val){
  return (Number(val)||0).toFixed(1)+"%";
}

function isSessionExpiredError(err){
  var m=(err&&err.message)?err.message.toLowerCase():"";
  return m.indexOf("session")!==-1||m.indexOf("expired")!==-1||
         m.indexOf("invalid token")!==-1||m.indexOf("unauthorized")!==-1;
}

function onServerFailure(err){
  if(isSessionExpiredError(err)){ resetToLogin("Session expired. Please log in again."); return; }
  console.error(err);
}

function _setText(id,v){ var e=document.getElementById(id); if(e) e.innerText=v; }
function _setHtml(id,v){ var e=document.getElementById(id); if(e) e.innerHTML=v; }

function _isDark(){
  var h=document.getElementById("html-root");
  if(!h) return false;
  if(h.classList.contains("dark")) return true;
  if(h.classList.contains("theme-auto") && window.matchMedia("(prefers-color-scheme:dark)").matches) return true;
  return false;
}

/* ================================================================
   ERROR / STATUS HELPERS
   ================================================================ */
function _msg(id,m){
  var e=document.getElementById(id);
  if(!e) return;
  if(!m){ e.classList.add("hidden"); e.innerText=""; return; }
  e.classList.remove("hidden"); e.innerText=m;
}
function setHomeError(m)    { _msg("home-error",m); }
function setHomeStatus(m)   { _msg("home-status",m); }
function setFinanceError(m) { _msg("finance-error",m); }
function setProjectError(m) { _msg("project-error",m); }
function setProjectStatus(m){ _msg("project-status",m); }
function setMessageError(m) { _msg("message-error",m); }
function setVoteError(m)    { _msg("vote-error",m); }
function setTimelineError(m){ _msg("timeline-error",m); }
function setAdminError(m)   { _msg("admin-error",m); }
function setAdminStatus(m)  { _msg("admin-status",m); }
function setSosError(m)     { _msg("sos-error",m); }
function setSosStatus(m)    { _msg("sos-status",m); }
function setFamilyError(m)  { _msg("family-error",m); }

function showLoginMessage(msg){
  var e=document.getElementById("login-state-message");
  if(!e) return;
  if(!msg){ e.classList.add("hidden"); return; }
  e.classList.remove("hidden"); e.innerText=msg;
}

/* ================================================================
   AUTH
   ================================================================ */
window.initializeAuthView = function(){
  var vl=document.getElementById("view-login");
  var va=document.getElementById("view-app");
  if(vl) vl.classList.remove("hidden");
  if(va) va.classList.add("hidden");
  var s1=document.getElementById("step-1");
  var s2=document.getElementById("step-2");
  if(s1) s1.classList.remove("hidden");
  if(s2) s2.classList.add("hidden");
  // Check for dev bypass
  try{
    google.script.run
      .withSuccessHandler(function(cfg){
        if(cfg&&cfg.developerBypassEnabled){
          var b=document.getElementById("dev-bypass-banner");
          if(b){
            b.classList.remove("hidden");
            b.innerText="⚡ Developer bypass mode active.";
            b.style.cssText="border-color:#f59e0b;background:#fffbeb;color:#78350f;";
          }
        }
      })
      .withFailureHandler(function(){})
      .getAuthModeConfig();
  }catch(e){}
};

window.handleOTP = function(){
  var email=((document.getElementById("email")||{}).value||"").trim();
  if(!email){ showLoginMessage("Please enter your email."); return; }
  var btn=document.getElementById("btn-get-code");
  if(btn){ btn.disabled=true; btn.innerText="Sending…"; }
  showLoginMessage("Sending one-time code…");
  google.script.run
    .withSuccessHandler(function(res){
      if(btn){ btn.disabled=false; btn.innerText="Send One-Time Code"; }
      if(res&&res.success){
        var s1=document.getElementById("step-1"); if(s1) s1.classList.add("hidden");
        var s2=document.getElementById("step-2"); if(s2) s2.classList.remove("hidden");
        showLoginMessage("Code sent to "+escapeHtml(email)+". Check your inbox.");
      } else {
        showLoginMessage((res&&res.message)||"Failed to send code. Try again.");
      }
    })
    .withFailureHandler(function(err){
      if(btn){ btn.disabled=false; btn.innerText="Send One-Time Code"; }
      showLoginMessage((err&&err.message)||"Request failed.");
    })
    .loginStepOne(email);
};

window.handleVerify = function(){
  var email=((document.getElementById("email")||{}).value||"").trim();
  var otp=((document.getElementById("otp")||{}).value||"").trim();
  if(!otp){ showLoginMessage("Please enter the code."); return; }
  var btn=document.getElementById("btn-verify");
  if(btn){ btn.disabled=true; btn.innerText="Verifying…"; }
  showLoginMessage("Verifying…");
  google.script.run
    .withSuccessHandler(function(res){
      if(btn){ btn.disabled=false; btn.innerText="Verify"; }
      var t=res&&(res.token||res.sessionToken||res.authToken);
      if(t){
        token=t; window.token=t;
        currentUser={ name:res.name||res.fullName||"Member", role:res.role||"", email:res.email||email };
        var vl=document.getElementById("view-login"); if(vl) vl.classList.add("hidden");
        initApp();
      } else {
        showLoginMessage((res&&res.message)||"Verification failed. Check your code.");
      }
    })
    .withFailureHandler(function(err){
      if(btn){ btn.disabled=false; btn.innerText="Verify"; }
      showLoginMessage((err&&err.message)||"Verification failed.");
    })
    .verifyStepTwo(email, otp);
};

window.resetToStepOne = function(){
  var s1=document.getElementById("step-1"); if(s1) s1.classList.remove("hidden");
  var s2=document.getElementById("step-2"); if(s2) s2.classList.add("hidden");
  var oi=document.getElementById("otp"); if(oi) oi.value="";
  showLoginMessage("");
};

window.resetToLogin = function(msg){
  token=""; window.token="";
  currentUser={name:"",role:"",email:""};
  window.homeLoaded=false;
  financeLoaded=false; projectsLoaded=false; voteDataLoaded=false;
  timelineLoaded=false; adminLoaded=false; sosLoaded=false; familyLoaded=false;
  var vl=document.getElementById("view-login"); if(vl) vl.classList.remove("hidden");
  var va=document.getElementById("view-app");   if(va) va.classList.add("hidden");
  var s1=document.getElementById("step-1"); if(s1) s1.classList.remove("hidden");
  var s2=document.getElementById("step-2"); if(s2) s2.classList.add("hidden");
  var oi=document.getElementById("otp");   if(oi) oi.value="";
  var ei=document.getElementById("email"); if(ei) ei.value="";
  if(msg) showLoginMessage(msg);
};

window.initApp = function(){
  var va=document.getElementById("view-app"); if(va) va.classList.remove("hidden");
  _setText("welcome-name", currentUser.name||"Welcome");
  var isAdmin = currentUser.role==="Admin";
  var bna=document.getElementById("btn-nav-admin"); if(bna) bna.classList.toggle("hidden",!isAdmin);
  var sna=document.getElementById("sidebar-nav-admin"); if(sna) sna.classList.toggle("hidden",!isAdmin);
  showPage("home");
  loadHomeEssentials(false);
};

/* ================================================================
   NAVIGATION
   ================================================================ */
window.showPage = function(pageId){
  document.querySelectorAll(".page").forEach(function(p){ p.classList.remove("active"); });
  var tgt=document.getElementById("page-"+pageId);
  if(tgt) tgt.classList.add("active");
  currentPage=pageId;
  _updateBottomNav(pageId);
  _updateSidebarNav(pageId);
  window.scrollTo(0,0);
  var mc=document.getElementById("main-content"); if(mc) mc.scrollTop=0;
  // Auto-load
  if(pageId==="finance"  && !financeLoaded)   loadFinanceDashboard();
  if(pageId==="projects" && !projectsLoaded)  loadProjects();
  if(pageId==="messages")                     loadUserChannels();
  if(pageId==="voting"   && !voteDataLoaded)  loadVotes();
  if(pageId==="timeline" && !timelineLoaded)  loadTimelineData();
  if(pageId==="sos")                          loadSOSAlerts();
  if(pageId==="family"   && !familyLoaded)    loadFamilyData();
  if(pageId==="admin"    && !adminLoaded)     loadAdmin();
};

function _updateBottomNav(pageId){
  var nav=document.getElementById("bottom-nav"); if(!nav) return;
  nav.querySelectorAll("button").forEach(function(btn){
    var oc=btn.getAttribute("onclick")||"";
    btn.classList.toggle("active", oc.indexOf("'"+pageId+"'")!==-1);
  });
}

function _updateSidebarNav(pageId){
  var s=document.getElementById("sidebar"); if(!s) return;
  s.querySelectorAll("[data-page]").forEach(function(el){
    el.classList.toggle("sidebar-active", el.getAttribute("data-page")===pageId);
  });
}

/* ================================================================
   HOME RENDERERS
   ================================================================ */
window.renderHomeFinanceSummary = function(data){
  var el=document.getElementById("home-finance-snapshot"); if(!el) return;
  el.innerHTML="<strong>"+escapeHtml(formatCurrency(data.totalContributions||0))+"</strong> raised &middot; <strong>"+escapeHtml(formatCurrency(data.totalLocked||0))+"</strong> locked";
  _renderHomeFinanceChart(data);
};

window.renderHomeProjectSnapshot = function(data){
  var el=document.getElementById("home-project-snapshot"); if(!el) return;
  el.innerHTML="<strong>"+Number(data.projectCount||0)+"</strong> projects &middot; avg <strong>"+escapeHtml(formatPercent(data.averageProgress||0))+"</strong> progress";
};

window.renderHomeVoteSnapshot = function(data){
  var el=document.getElementById("home-vote-snapshot"); if(!el) return;
  el.innerHTML="<strong>"+Number(data.open||0)+"</strong> open &middot; <strong>"+Number(data.totalVotes||0)+"</strong> total proposals";
};

window.renderHomeTimelineSnapshot = function(data){
  var snap=document.getElementById("home-timeline-snapshot");
  if(snap) snap.innerHTML="<strong>"+Number(data.historicalCount||0)+"</strong> historical &middot; <strong>"+Number(data.upcomingCount||0)+"</strong> upcoming";
  var el=document.getElementById("home-activity-list"); if(!el) return;
  var items=Array.isArray(data.recent)?data.recent:[];
  if(!items.length){ el.innerHTML="<div style='color:var(--muted);font-size:.875rem'>No recent events.</div>"; return; }
  el.innerHTML=items.slice(0,5).map(function(it){
    return "<div class='ptv-shell p-3 mb-2'><div style='font-size:.7rem;color:var(--muted)'>"+escapeHtml(formatDate(it.date||it.EventDate))+"</div><div style='font-weight:600;font-size:.875rem;color:var(--ink)'>"+escapeHtml(it.title||it.Title||"Event")+"</div></div>";
  }).join("");
};

function _renderHomeFinanceChart(data){
  var canvas=document.getElementById("financeChart"); if(!canvas) return;
  var alloc=Array.isArray(data.allocation)?data.allocation:[];
  var empty=document.getElementById("home-chart-empty");
  if(!alloc.length){ if(empty) empty.classList.remove("hidden"); return; }
  if(empty) empty.classList.add("hidden");
  if(financeChartInstance){ financeChartInstance.destroy(); financeChartInstance=null; }
  var isDark=_isDark();
  financeChartInstance=new Chart(canvas.getContext("2d"),{
    type:"doughnut",
    data:{
      labels:alloc.map(function(a){ return a.label||a.type||"Other"; }),
      datasets:[{ data:alloc.map(function(a){ return Number(a.amount||a.value||0); }),
        backgroundColor:["#0058bc","#4edea3","#ffb95f","#adc6ff","#c2c6d6","#424754"],
        borderWidth:0 }]
    },
    options:{ responsive:true, maintainAspectRatio:false, cutout:"70%",
      plugins:{ legend:{ position:"bottom", labels:{ color:isDark?"#dae2fd":"#1a1c1f", font:{size:11} } } }
    }
  });
}

/* ================================================================
   FINANCE RENDERERS
   ================================================================ */
window.renderFinanceDashboard = function(payload){
  _setText("finance-total-contributions", formatCurrency(payload.totalContributions||0));
  _setText("finance-total-locked",        formatCurrency(payload.totalLocked||0));
  _setText("finance-total-projected",     formatCurrency(payload.projectedDistribution||payload.totalProjected||0));
  _renderAllocationChart(payload.allocation||[]);
  _renderAllocationBreakdown(payload.allocation||[]);
  _renderCategorySummary(payload.categories||[]);
  _renderFounderLockChart(payload.founderLocks||[]);
  _renderFounderLockSummary(payload.founderLocks||[]);
  _renderFounderLockList(payload.founderLocks||[]);
};

function _renderAllocationChart(alloc){
  var canvas=document.getElementById("finance-allocation-chart"); if(!canvas) return;
  if(!alloc.length) return;
  if(allocationChartInstance){ allocationChartInstance.destroy(); allocationChartInstance=null; }
  var isDark=_isDark();
  allocationChartInstance=new Chart(canvas.getContext("2d"),{
    type:"doughnut",
    data:{
      labels:alloc.map(function(a){ return a.label||a.type||"Other"; }),
      datasets:[{ data:alloc.map(function(a){ return Number(a.percent||a.amount||0); }),
        backgroundColor:["#0058bc","#4edea3","#ffb95f","#adc6ff","#c2c6d6","#424754"],
        borderWidth:0 }]
    },
    options:{ responsive:true, maintainAspectRatio:false, cutout:"68%",
      plugins:{ legend:{ position:"bottom", labels:{ color:isDark?"#dae2fd":"#1a1c1f", font:{size:10} } } }
    }
  });
  var total=alloc.reduce(function(s,a){ return s+Number(a.percent||0); },0);
  _setText("finance-allocation-validation", total?"Total: "+total.toFixed(1)+"%":"");
}

function _renderAllocationBreakdown(alloc){
  var el=document.getElementById("finance-allocation-breakdown"); if(!el) return;
  if(!alloc.length){ el.innerHTML=""; return; }
  el.innerHTML=alloc.map(function(a){
    return "<div class='ptv-metric text-left'><div style='font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)'>"+escapeHtml(a.label||a.type||"")+"</div><div style='font-weight:700;color:var(--ink)'>"+escapeHtml(formatPercent(a.percent||0))+"</div><div style='font-size:.75rem;color:var(--muted)'>"+escapeHtml(formatCurrency(a.amount||0))+"</div></div>";
  }).join("");
}

function _renderCategorySummary(cats){
  var el=document.getElementById("finance-category-summary"); if(!el) return;
  if(!cats.length){ el.innerHTML="<div style='color:var(--muted);font-size:.875rem'>No category data.</div>"; return; }
  el.innerHTML=cats.map(function(c){
    return "<div class='module-stat'><span>"+escapeHtml(c.type||c.label||"Other")+"</span><strong>"+escapeHtml(formatCurrency(c.total||c.amount||0))+"</strong></div>";
  }).join("");
}

function _renderFounderLockChart(locks){
  var canvas=document.getElementById("finance-founder-lock-chart"); if(!canvas) return;
  if(founderLockChartInstance){ founderLockChartInstance.destroy(); founderLockChartInstance=null; }
  var locked=0, released=0;
  locks.forEach(function(l){ var v=Number(l.AmountUSD||0); if(l.Released) released+=v; else locked+=v; });
  var isDark=_isDark();
  founderLockChartInstance=new Chart(canvas.getContext("2d"),{
    type:"doughnut",
    data:{ labels:["Locked","Released"], datasets:[{ data:[locked,released], backgroundColor:["#0058bc","#4edea3"], borderWidth:0 }] },
    options:{ responsive:true, maintainAspectRatio:false, cutout:"68%",
      plugins:{ legend:{ position:"bottom", labels:{ color:isDark?"#dae2fd":"#1a1c1f", font:{size:10} } } }
    }
  });
}

function _renderFounderLockSummary(locks){
  var el=document.getElementById("finance-founder-lock-summary"); if(!el) return;
  var total=locks.reduce(function(s,l){ return s+Number(l.AmountUSD||0); },0);
  var active=locks.filter(function(l){ return !l.Released; }).length;
  el.innerHTML="<div class='module-stat'><span>Total Locks</span><strong>"+locks.length+"</strong></div>"+
    "<div class='module-stat' style='margin-top:.25rem'><span>Active</span><strong>"+active+"</strong></div>"+
    "<div class='module-stat' style='margin-top:.25rem'><span>Total Amount</span><strong>"+escapeHtml(formatCurrency(total))+"</strong></div>";
}

function _renderFounderLockList(locks){
  var el=document.getElementById("finance-founder-lock-list"); if(!el) return;
  if(!locks.length){ el.innerHTML="<div style='color:var(--muted);font-size:.875rem'>No founder lock records.</div>"; return; }
  el.innerHTML=locks.map(function(l){
    var rls=!!l.Released;
    var cls=rls?"bg-emerald-50 text-emerald-700 border border-emerald-200":"bg-blue-50 text-blue-700 border border-blue-200";
    return "<div class='ptv-shell p-4' style='margin-bottom:.5rem'><div style='display:flex;align-items:center;justify-content:space-between;gap:.5rem;flex-wrap:wrap'>"+
      "<div><div style='font-weight:700;color:var(--ink)'>"+escapeHtml(formatCurrency(l.AmountUSD||0))+"</div>"+
      "<div style='font-size:.72rem;color:var(--muted)'>"+escapeHtml(l.Email||"—")+" &middot; "+escapeHtml(String(l.LockYears||"?"))+"yr &middot; expires "+escapeHtml(formatDate(l.ExpiryDate))+"</div></div>"+
      "<div class='ptv-pill "+cls+"'>"+(rls?"Released":"Locked")+"</div></div></div>";
  }).join("");
}

/* ================================================================
   SOS
   ================================================================ */
window.loadSOSAlerts = function(){
  setSosError(""); setSosStatus("Loading…");
  google.script.run
    .withSuccessHandler(function(res){
      setSosStatus("");
      sosLoaded=true;
      var alerts=Array.isArray(res&&res.alerts)?res.alerts:[];
      _renderSosAlerts(alerts);
      _renderSosWhatsapp(res&&res.whatsappEnabled, res&&res.whatsappNumber);
    })
    .withFailureHandler(function(err){
      setSosStatus("");
      if(isSessionExpiredError(err)){ onServerFailure(err); return; }
      setSosError((err&&err.message)||"Unable to load SOS data.");
    })
    .getSOSAlerts(token);
};

function _renderSosAlerts(alerts){
  var el=document.getElementById("sos-alert-history"); if(!el) return;
  if(!alerts.length){ el.innerHTML="<div style='color:var(--muted);font-size:.875rem'>No alerts recorded.</div>"; return; }
  el.innerHTML=alerts.map(function(a){
    var isResolved=a.Status==="Resolved";
    var pillCls=isResolved?"bg-emerald-50 text-emerald-700 border border-emerald-200":"bg-rose-50 text-rose-700 border border-rose-200";
    return "<div class='ptv-shell p-4' style='margin-bottom:.5rem'>"+
      "<div style='display:flex;align-items:center;justify-content:space-between;gap:.5rem'>"+
      "<div><div style='font-size:.7rem;color:var(--muted)'>"+escapeHtml(formatDate(a.Timestamp||a.CreatedAt))+"</div>"+
      "<div style='font-weight:600;color:var(--ink)'>"+escapeHtml(a.ReporterEmail||"Unknown")+"</div>"+
      "<div style='font-size:.72rem;color:var(--muted)'>Lat: "+escapeHtml(String(a.Lat||"—"))+" · Lng: "+escapeHtml(String(a.Lng||"—"))+"</div></div>"+
      "<div class='ptv-pill "+pillCls+"'>"+escapeHtml(a.Status||"Active")+"</div></div>"+
      (a.WhatsAppLink?"<a href='"+escapeHtml(a.WhatsAppLink)+"' target='_blank' style='font-size:.75rem;color:var(--accent);display:block;margin-top:.4rem'>Open WhatsApp</a>":"")+
      "<button onclick=\"loadSOSMedia('"+escapeHtml(a.SOSID||a.AlertID||"")+"')\" style='font-size:.72rem;margin-top:.4rem;padding:.2rem .6rem;border-radius:.4rem;background:var(--panel-alt);color:var(--muted);border:1px solid var(--line)'>View Media</button>"+
      "</div>";
  }).join("");
}

function _renderSosWhatsapp(enabled, number){
  var el=document.getElementById("sos-whatsapp-action"); if(!el) return;
  if(enabled&&number){
    el.innerHTML="<a href='https://wa.me/"+escapeHtml(String(number).replace(/\D/g,""))+"' target='_blank' style='display:block;width:100%;text-align:center;background:#25D366;color:#fff;padding:.75rem;border-radius:.75rem;font-weight:700;font-size:.875rem;margin-top:.5rem'>Open WhatsApp</a>";
  }
}

window.triggerSOS = function(){
  setSosStatus(""); setSosError("");
  var btn=document.getElementById("btn-trigger-sos");
  if(btn){ btn.disabled=true; btn.innerText="Locating…"; }
  function _doTrigger(lat,lng){
    setSosStatus("Sending SOS alert…");
    google.script.run
      .withSuccessHandler(function(res){
        if(btn){ btn.disabled=false; btn.innerText="Send SOS Alert"; }
        if(res&&res.success){ setSosStatus("SOS alert sent. Help is on the way."); loadSOSAlerts(); }
        else setSosError((res&&res.message)||"SOS failed. Try again.");
      })
      .withFailureHandler(function(err){
        if(btn){ btn.disabled=false; btn.innerText="Send SOS Alert"; }
        setSosError((err&&err.message)||"SOS failed.");
      })
      .triggerSOS(token, lat, lng);
  }
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      function(p){ _doTrigger(p.coords.latitude, p.coords.longitude); },
      function(){  _doTrigger(null, null); }
    );
  } else { _doTrigger(null, null); }
};

      const canCast = votePermissions.canCastBallot && isOpen && !v.hasUserVoted;
      const total = Number(v.totalBallots||0) || 1;
      const yesPct = Math.round((Number(v.yesCount||0) / total) * 100);
      const noPct = Math.round((Number(v.noCount||0) / total) * 100);
      const abstainPct = Math.max(0, 100 - yesPct - noPct);
      return `<div class="ptv-shell p-4">
        <div class="flex items-start justify-between gap-3">
          <div>
            <div class="text-xs text-slate-500 uppercase">${escapeHtml(v.VoteID || "")}</div>
            <div class="font-semibold text-slate-900">${escapeHtml(v.Title || "Untitled vote")}</div>
            ${v.Description ? `<div class="text-sm text-slate-700 mt-2 whitespace-pre-wrap">${escapeHtml(v.Description)}</div>` : ""}
          </div>
          <div class="ptv-pill ${v.thresholdPassed ? "bg-emerald-50 text-emerald-700 border border-emerald-200" : "bg-amber-50 text-amber-700 border border-amber-200"}">${v.thresholdPassed ? "Passed" : "Pending"}</div>
        </div>
        ${v.ImageURL ? `<img src="${escapeHtml(v.ImageURL)}" class="mt-3 h-32 w-full object-cover rounded-xl border border-slate-200"/>` : ""}
        <div class="mt-3">
          <div class="h-2 rounded-full overflow-hidden bg-slate-100 flex">
            <div class="bg-emerald-500" style="width:${yesPct}%"></div>
            <div class="bg-rose-500" style="width:${noPct}%"></div>
            <div class="bg-slate-400" style="width:${abstainPct}%"></div>
          </div>
          <div class="grid grid-cols-2 md:grid-cols-5 gap-2 text-xs mt-2">
            <div class="ptv-metric"><div class="text-slate-500">Ballots</div><div class="font-bold">${Number(v.totalBallots||0)}</div></div>
            <div class="ptv-metric"><div class="text-slate-500">Yes</div><div class="font-bold">${Number(v.yesCount||0)}</div></div>
            <div class="ptv-metric"><div class="text-slate-500">No</div><div class="font-bold">${Number(v.noCount||0)}</div></div>
            <div class="ptv-metric"><div class="text-slate-500">Abstain</div><div class="font-bold">${Number(v.abstainCount||0)}</div></div>
            <div class="ptv-metric"><div class="text-slate-500">Your ballot</div><div class="font-bold">${v.hasUserVoted ? "Submitted" : "Pending"}</div></div>
          </div>
        </div>
        <div class="mt-3 flex flex-wrap gap-2 items-center">
          <select id="choice-${escapeHtml(v.VoteID)}" class="p-2 rounded-lg border border-slate-200 text-sm bg-white" ${canCast ? "" : "disabled"}>
            <option value="Yes">Yes</option><option value="No">No</option><option value="Abstain">Abstain</option>
          </select>
          <button onclick="castBallot('${escapeHtml(v.VoteID)}')" class="px-3 py-2 rounded-lg text-sm font-semibold ${canCast ? "bg-blue-600 text-white" : "bg-slate-200 text-slate-500 cursor-not-allowed"}" ${canCast ? "" : "disabled"}>Cast Ballot</button>
        </div>
      </div>`;
    }).join("");
  };

  window.renderTimelineList = function(items){
    const container = document.getElementById("timeline-list");
    if(!container){ return; }
    if(!items || !items.length){
      container.innerHTML = "<div class='ptv-shell p-4 text-sm text-slate-500'>No timeline items.</div>";
      return;
    }
    container.innerHTML = items.map(function(item){
      const isUpcoming = String(item.category||"").toLowerCase()==="upcoming";
      return `<div class="ptv-shell p-4 ptv-timeline-rail">
        <span class="ptv-timeline-dot"></span>
        <div class="flex items-center justify-between gap-2 mb-1">
          <div class="text-xs text-slate-500">${escapeHtml(formatDate(item.date))}</div>
          <div class="ptv-pill ${isUpcoming ? "bg-indigo-50 text-indigo-700 border border-indigo-200" : "bg-slate-100 text-slate-700 border border-slate-200"}">${escapeHtml(item.category || "entry")}</div>
        </div>
        <div class="font-semibold text-slate-900">${escapeHtml(item.title || "Untitled")}</div>
        <div class="text-xs text-slate-600 mt-1">${escapeHtml(item.eventType || "")}${item.recurrence ? " • " + escapeHtml(item.recurrence) : ""}</div>
        ${item.description ? `<div class="text-sm text-slate-700 mt-2 whitespace-pre-wrap">${escapeHtml(item.description)}</div>` : ""}
      </div>`;
    }).join("");
  };

  window.renderHistoryList = function(items){
    const container = document.getElementById("timeline-history");
    if(!container){ return; }
    if(!items || !items.length){
      container.innerHTML = "<div class='ptv-shell p-4 text-sm text-slate-500'>No historical records found.</div>";
      return;
    }
    container.innerHTML = items.map(function(item){
      return `<div class="ptv-shell p-4">
        <div class="text-xs text-slate-500">${escapeHtml(formatDate(item.EventDate))}</div>
        <div class="font-semibold text-slate-900">${escapeHtml(item.Title || "Untitled")}</div>
        <div class="text-xs text-slate-600 mt-1">${escapeHtml(item.EventType || "")}</div>
        ${item.Description ? `<div class="text-sm text-slate-700 mt-2 whitespace-pre-wrap">${escapeHtml(item.Description)}</div>` : ""}
      </div>`;
    }).join("");
  };

  window.renderUpcomingList = function(items){
    const container = document.getElementById("timeline-upcoming");
    if(!container){ return; }
    if(!items || !items.length){
      container.innerHTML = "<div class='ptv-shell p-4 text-sm text-slate-500'>No upcoming events.</div>";
      return;
    }
    container.innerHTML = items.map(function(item){
      return `<div class="ptv-shell p-4">
        <div class="text-xs text-blue-700 font-semibold">Next: ${escapeHtml(formatDate(item.NextOccurrence))}</div>
        <div class="font-semibold text-slate-900">${escapeHtml(item.Title || "Untitled")}</div>
        <div class="text-xs text-slate-600 mt-1">${escapeHtml(item.Recurrence || "One-time")}</div>
        <div class="text-xs text-slate-500 mt-1">Original date: ${escapeHtml(formatDate(item.EventDate))}</div>
      </div>`;
    }).join("");
  };

  const originalLoadProjects = window.loadProjects;
  window.loadProjects = function(){
    return originalLoadProjects && originalLoadProjects();
  };
})();
</script>
