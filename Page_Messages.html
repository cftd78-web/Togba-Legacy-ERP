<div id="page-messages" class="page">

<div class="page-header">
<h2 class="page-heading">Messaging</h2>
<button onclick="refreshMessages()" class="btn-refresh">Refresh</button>
</div>

<div class="messages-shell">

<div class="mail-panel p-4" style="background:var(--panel);border:1px solid rgba(66,71,84,.12);border-radius:.9rem;">
<h3 style="font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:.75rem;">Channels</h3>
<div class="grid gap-2 mb-3">
<input id="channel-create-name" class="p-2 rounded-lg border" placeholder="New channel name" />
<select id="channel-create-type" class="p-2 rounded-lg border"><option value="private">private</option><option value="family broadcast">family broadcast</option><option value="project">project</option></select>
<button onclick="createChannelUI()" class="btn-primary text-sm">Create Channel</button>
<input id="channel-join-id" class="p-2 rounded-lg border" placeholder="ChannelID to join" />
<button onclick="joinChannelUI()" class="btn-secondary text-sm">Join Channel</button>
</div>
<div class="mail-section-title mb-2">Inbox</div>
<div id="channel-list" class="space-y-2 max-h-[28vh] overflow-y-auto"></div>
<div class="mt-3 border-t pt-3">
<div class="mail-section-title mb-2">Sent / Outbox Directory</div>
<div id="channel-directory" class="space-y-2 max-h-[18vh] overflow-y-auto"></div>
</div>
</div>

<div class="mail-panel flex flex-col min-h-[64vh]" style="background:var(--panel);border:1px solid rgba(66,71,84,.12);border-radius:.9rem;">
<div class="mail-panel-head">
<h3 id="message-channel-title" class="mail-section-title">Select a channel</h3>
<button onclick="refreshMessages()" class="btn-refresh">Refresh</button>
</div>
<div class="p-4">
<div id="message-error" class="hidden err-box mb-2"></div>
<div class="mb-3">
<input id="message-recipient-input" type="text" placeholder="To: search family member by name" class="w-full p-3 rounded-xl border" oninput="handleRecipientSearchInput()" autocomplete="off" />
<div id="message-recipient-results" class="mt-2 space-y-1"></div>
</div>
<div class="grid gap-3 lg:grid-cols-5">
<div class="lg:col-span-3">
<div class="mail-section-title mb-2">Conversation</div>
<div id="message-history" class="chat-pane"></div>
</div>
<div class="lg:col-span-2">
<div class="mail-section-title mb-2">Sent / Outbox</div>
<div id="message-sent-list" class="mail-pane space-y-2"></div>
</div>
</div>
<div class="mt-3">
<div class="mail-section-title mb-2">Compose Message</div>
<div class="flex flex-col gap-2">
<textarea id="message-input" placeholder="Write your message..." class="w-full p-3 rounded-xl border mail-compose-box min-h-[80px]"></textarea>
<div class="flex justify-end">
<button id="btn-send-message" onclick="sendCurrentMessage()" class="btn-primary">Send</button>
</div>
</div>
</div>
</div>
</div>

</div>

</div>
