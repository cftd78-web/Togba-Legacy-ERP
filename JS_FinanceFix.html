<script>
/* ================================================================
   JS_FINANCE_FIX — Overrides renderFinanceDashboard in JS_Core.html
   with correct nested field paths matching the backend structure.
   Safe: loaded after JS_Core so replaces only the named functions.
   ================================================================ */
(function(){

  window.renderFinanceDashboard = function(payload){
    var totals   = payload.totals       || {};
    var fl       = payload.founderLocks || {};
    var alloc    = payload.allocation   || {};
    var proj     = payload.projection   || {};
    var breakdown = alloc.breakdown     || [];
    var locks    = fl.locks             || [];

    /* Stat cards */
    var tc = document.getElementById("finance-total-contributions");
    var tl = document.getElementById("finance-total-locked");
    var tp = document.getElementById("finance-total-projected");
    if(tc) tc.innerText = _fc(totals.totalContributions||0);
    if(tl) tl.innerText = _fc(fl.totalLocked||0);
    if(tp) tp.innerText = _fc(proj.totalProjected||0);

    /* Charts and breakdowns */
    _renderAllocChart(breakdown);
    _renderAllocBreakdown(breakdown, alloc);
    _renderCats(totals.contributionCategories||{});
    _renderFlChart(locks);
    _renderFlSummary(fl);
    _renderFlList(locks);
  };

  /* Format currency — mirrors JS_Core formatCurrency */
  function _fc(val){
    var n=Number(val)||0;
    return "$"+n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
  }
  function _fp(val){ return (Number(val)||0).toFixed(1)+"%"; }
  function _esc(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function _isDark(){
    var h=document.documentElement;
    if(h.classList.contains("dark")) return true;
    if(h.classList.contains("light")) return false;
    return !!(window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)").matches);
  }

  /* Allocation doughnut chart */
  function _renderAllocChart(breakdown){
    var canvas=document.getElementById("finance-allocation-chart");
    if(!canvas||!breakdown.length) return;
    if(window._allocChartInst){ window._allocChartInst.destroy(); window._allocChartInst=null; }
    var isDark=_isDark();
    window._allocChartInst=new Chart(canvas.getContext("2d"),{
      type:"doughnut",
      data:{
        labels:breakdown.map(function(a){ return a.label||""; }),
        datasets:[{
          data:breakdown.map(function(a){ return Number(a.percent)||0; }),
          backgroundColor:["#2563eb","#4edea3","#f59e0b","#7aa2ff"],
          borderWidth:0
        }]
      },
      options:{
        responsive:true, maintainAspectRatio:false, cutout:"68%",
        plugins:{ legend:{ position:"bottom",
          labels:{ color:isDark?"#e2e8f0":"#0f172a", font:{size:10} } } }
      }
    });
  }

  /* Allocation breakdown grid */
  function _renderAllocBreakdown(breakdown, alloc){
    var el=document.getElementById("finance-allocation-breakdown");
    if(!el) return;
    if(!breakdown.length){ el.innerHTML=""; return; }
    el.innerHTML=breakdown.map(function(a){
      return "<div class='ptv-metric' style='text-align:left'>"
        +"<div style='font-size:.62rem;font-weight:700;text-transform:uppercase;"
        +"letter-spacing:.06em;color:var(--muted)'>"+_esc(a.label||"")+"</div>"
        +"<div style='font-weight:700;color:var(--ink)'>"+_fp(a.percent||0)+"</div>"
        +"<div style='font-size:.75rem;color:var(--muted)'>"+_fc(a.projectedAmount||0)+"</div>"
        +"</div>";
    }).join("");
    var val=document.getElementById("finance-allocation-validation");
    if(val&&alloc) val.innerText=alloc.isValid
      ?"Total: "+Number(alloc.totalPercent||0).toFixed(1)+"%"
      :(alloc.message||"");
  }

  /* Contribution categories */
  function _renderCats(catObj){
    var el=document.getElementById("finance-category-summary");
    if(!el) return;
    var keys=Object.keys(catObj||{});
    if(!keys.length){
      el.innerHTML="<div style='color:var(--muted);font-size:.875rem'>No category data.</div>";
      return;
    }
    el.innerHTML=keys.map(function(k){
      return "<div class='module-stat'><span>"+_esc(k)+"</span>"
        +"<strong>"+_fc(catObj[k])+"</strong></div>";
    }).join("");
  }

  /* Founder lock doughnut chart */
  function _renderFlChart(locks){
    var canvas=document.getElementById("finance-founder-lock-chart");
    if(!canvas) return;
    if(window._flChartInst){ window._flChartInst.destroy(); window._flChartInst=null; }
    var locked=0, released=0;
    locks.forEach(function(l){
      var v=Number(l.AmountUSD)||0;
      if(l.Released) released+=v; else locked+=v;
    });
    var isDark=_isDark();
    window._flChartInst=new Chart(canvas.getContext("2d"),{
      type:"doughnut",
      data:{
        labels:["Locked","Released"],
        datasets:[{ data:[locked,released],
          backgroundColor:["#2563eb","#4edea3"], borderWidth:0 }]
      },
      options:{
        responsive:true, maintainAspectRatio:false, cutout:"68%",
        plugins:{ legend:{ position:"bottom",
          labels:{ color:isDark?"#e2e8f0":"#0f172a", font:{size:10} } } }
      }
    });
  }

  /* Founder lock summary stats */
  function _renderFlSummary(fl){
    var el=document.getElementById("finance-founder-lock-summary");
    if(!el) return;
    el.innerHTML="<div class='module-stat'><span>Total Records</span>"
      +"<strong>"+(fl.totalRecords||0)+"</strong></div>"
      +"<div class='module-stat'><span>Active Locked</span>"
      +"<strong>"+_fc(fl.activeLocked||0)+"</strong></div>"
      +"<div class='module-stat'><span>Total Locked</span>"
      +"<strong>"+_fc(fl.totalLocked||0)+"</strong></div>";
  }

  /* Founder lock records list */
  function _renderFlList(locks){
    var el=document.getElementById("finance-founder-lock-list");
    if(!el) return;
    if(!locks.length){
      el.innerHTML="<div style='color:var(--muted);font-size:.875rem'>No founder lock records.</div>";
      return;
    }
    el.innerHTML=locks.map(function(l){
      var rls=!!l.Released;
      var pillBg=rls?"rgba(0,110,40,.1)":"rgba(0,88,188,.1)";
      var pillCol=rls?"var(--green)":"var(--accent)";
      var expiry=l.ExpiryDate?new Date(l.ExpiryDate).toLocaleDateString("en-US",
        {year:"numeric",month:"short",day:"numeric"}):"—";
      return "<div class='ptv-shell p-4' style='margin-bottom:.5rem'>"
        +"<div style='display:flex;align-items:center;justify-content:space-between;"
        +"gap:.5rem;flex-wrap:wrap'>"
        +"<div><div style='font-weight:700;color:var(--ink)'>"+_fc(l.AmountUSD||0)+"</div>"
        +"<div style='font-size:.72rem;color:var(--muted)'>"
        +_esc(String(l.LockYears||"?"))+"yr lock · expires "+_esc(expiry)
        +(l.progressPercent?" · "+Math.round(Number(l.progressPercent||0))+"% elapsed":"")
        +"</div></div>"
        +"<div style='display:inline-block;padding:.15rem .55rem;border-radius:9999px;"
        +"font-size:.62rem;font-weight:700;background:"+pillBg+";color:"+pillCol+"'>"
        +(rls?"Released":"Locked")+"</div></div></div>";
    }).join("");
  }

})();
</script>
