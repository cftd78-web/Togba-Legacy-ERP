<script>
/* Overrides renderFinanceDashboard from JS_Core.html.
   Fixes nested field paths to match what the backend actually returns.
   No DOMContentLoaded. No initApp. Safe. */
(function(){

  window.renderFinanceDashboard = function(payload){
    var totals    = payload.totals       || {};
    var fl        = payload.founderLocks || {};
    var alloc     = payload.allocation   || {};
    var proj      = payload.projection   || {};
    var breakdown = alloc.breakdown      || [];
    var locks     = fl.locks             || [];

    /* Stat cards */
    _fset("finance-total-contributions", _fc(totals.totalContributions || 0));
    _fset("finance-total-locked",        _fc(fl.totalLocked || 0));
    _fset("finance-total-projected",     _fc(proj.totalProjected || 0));

    /* Allocation chart */
    _fAllocChart(breakdown);

    /* Allocation breakdown grid */
    var bd = document.getElementById("finance-allocation-breakdown");
    if(bd){
      bd.innerHTML = breakdown.length ? breakdown.map(function(a){
        return "<div class='ptv-metric' style='text-align:left'>"
          +"<div style='font-size:.62rem;font-weight:700;text-transform:uppercase;"
          +"letter-spacing:.06em;color:var(--muted)'>" + _fesc(a.label||"") + "</div>"
          +"<div style='font-weight:700;color:var(--ink)'>" + _fp(a.percent||0) + "</div>"
          +"<div style='font-size:.75rem;color:var(--muted)'>" + _fc(a.projectedAmount||0) + "</div>"
          +"</div>";
      }).join("") : "";
      var val = document.getElementById("finance-allocation-validation");
      if(val) val.innerText = alloc.isValid
        ? "Total: " + Number(alloc.totalPercent||0).toFixed(1) + "%"
        : (alloc.message || "");
    }

    /* Categories — backend sends object not array */
    var catObj = totals.contributionCategories || {};
    var catEl  = document.getElementById("finance-category-summary");
    if(catEl){
      var keys = Object.keys(catObj);
      catEl.innerHTML = keys.length ? keys.map(function(k){
        return "<div class='module-stat'><span>" + _fesc(k) + "</span>"
          +"<strong>" + _fc(catObj[k]) + "</strong></div>";
      }).join("") : "<div style='color:var(--muted);font-size:.875rem'>No category data.</div>";
    }

    /* Founder lock chart */
    _fFlChart(locks);

    /* Founder lock summary — receives the fl object not an array */
    var flEl = document.getElementById("finance-founder-lock-summary");
    if(flEl){
      flEl.innerHTML = "<div class='module-stat'><span>Total Records</span>"
        +"<strong>" + (fl.totalRecords||0) + "</strong></div>"
        +"<div class='module-stat'><span>Active Locked</span>"
        +"<strong>" + _fc(fl.activeLocked||0) + "</strong></div>"
        +"<div class='module-stat'><span>Total Locked</span>"
        +"<strong>" + _fc(fl.totalLocked||0) + "</strong></div>";
    }

    /* Founder lock records list */
    var llEl = document.getElementById("finance-founder-lock-list");
    if(llEl){
      llEl.innerHTML = locks.length ? locks.map(function(l){
        var rls = !!l.Released;
        var bg  = rls ? "rgba(0,110,40,.1)"  : "rgba(0,88,188,.1)";
        var col = rls ? "var(--green)"        : "var(--accent)";
        var exp = l.ExpiryDate
          ? new Date(l.ExpiryDate).toLocaleDateString("en-US",{year:"numeric",month:"short",day:"numeric"})
          : "—";
        return "<div class='ptv-shell p-4' style='margin-bottom:.5rem'>"
          +"<div style='display:flex;align-items:center;justify-content:space-between;"
          +"gap:.5rem;flex-wrap:wrap'>"
          +"<div><div style='font-weight:700;color:var(--ink)'>" + _fc(l.AmountUSD||0) + "</div>"
          +"<div style='font-size:.72rem;color:var(--muted)'>"
          + _fesc(String(l.LockYears||"?")) + "yr · expires " + _fesc(exp)
          +(l.progressPercent ? " · " + Math.round(Number(l.progressPercent))+"%%" : "")
          +"</div></div>"
          +"<div style='padding:.15rem .55rem;border-radius:9999px;font-size:.62rem;"
          +"font-weight:700;background:" + bg + ";color:" + col + "'>"
          +(rls?"Released":"Locked")+"</div></div></div>";
      }).join("") : "<div style='color:var(--muted);font-size:.875rem'>No founder lock records.</div>";
    }
  };

  /* Allocation doughnut chart */
  function _fAllocChart(breakdown){
    var canvas = document.getElementById("finance-allocation-chart");
    if(!canvas || !breakdown.length) return;
    if(window._fAllocInst){ window._fAllocInst.destroy(); window._fAllocInst=null; }
    var dk = _fdk();
    window._fAllocInst = new Chart(canvas.getContext("2d"),{
      type:"doughnut",
      data:{
        labels: breakdown.map(function(a){ return a.label||""; }),
        datasets:[{ data: breakdown.map(function(a){ return Number(a.percent)||0; }),
          backgroundColor:["#2563eb","#4edea3","#f59e0b","#7aa2ff"], borderWidth:0 }]
      },
      options:{ responsive:true, maintainAspectRatio:false, cutout:"68%",
        plugins:{ legend:{ position:"bottom",
          labels:{ color: dk?"#e2e8f0":"#0f172a", font:{size:10} } } } }
    });
  }

  /* Founder lock doughnut chart */
  function _fFlChart(locks){
    var canvas = document.getElementById("finance-founder-lock-chart");
    if(!canvas) return;
    if(window._fFlInst){ window._fFlInst.destroy(); window._fFlInst=null; }
    var locked=0, released=0;
    locks.forEach(function(l){
      var v=Number(l.AmountUSD)||0;
      if(l.Released) released+=v; else locked+=v;
    });
    var dk = _fdk();
    window._fFlInst = new Chart(canvas.getContext("2d"),{
      type:"doughnut",
      data:{ labels:["Locked","Released"],
        datasets:[{ data:[locked,released],
          backgroundColor:["#2563eb","#4edea3"], borderWidth:0 }] },
      options:{ responsive:true, maintainAspectRatio:false, cutout:"68%",
        plugins:{ legend:{ position:"bottom",
          labels:{ color: dk?"#e2e8f0":"#0f172a", font:{size:10} } } } }
    });
  }

  /* Helpers */
  function _fset(id,v){ var e=document.getElementById(id); if(e) e.innerText=v; }
  function _fc(val){ var n=Number(val)||0;
    return "$"+n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}); }
  function _fp(val){ return (Number(val)||0).toFixed(1)+"%"; }
  function _fesc(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function _fdk(){
    var h=document.documentElement;
    if(h.classList.contains("dark")) return true;
    if(h.classList.contains("light")) return false;
    return !!(window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)").matches);
  }

})();
</script>
