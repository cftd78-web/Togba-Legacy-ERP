<div id="page-voting" class="page">

<div class="flex items-center justify-between mb-4">
<h2 class="text-2xl font-bold">Governance Voting</h2>
<button onclick="loadVotes()" class="text-xs px-3 py-2 rounded-lg bg-slate-100">Refresh</button>
</div>

<div id="vote-error" class="hidden text-sm text-red-600 mb-3"></div>

<div id="vote-create-panel" class="hidden mb-4" style="background:var(--panel);border:1px solid rgba(66,71,84,.12);border-radius:.75rem;padding:1.25rem;">
<h3 style="font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:.75rem;">Create Proposal</h3>
<div class="grid gap-3 md:grid-cols-4">
<input id="vote-title" type="text" placeholder="Proposal title" class="md:col-span-2 p-3 rounded-xl border border-slate-200" />
<select id="vote-threshold" class="p-3 rounded-xl border border-slate-200">
<option value="Majority">Majority</option>
<option value="TwoThirds">TwoThirds</option>
<option value="SeventyFive">SeventyFive</option>
</select>
<textarea id="vote-description" placeholder="Proposal description (optional)" class="md:col-span-4 p-3 rounded-xl border border-slate-200 min-h-[96px]"></textarea>
<input id="vote-image" type="url" placeholder="Proposal image URL (optional)" class="md:col-span-2 p-3 rounded-xl border border-slate-200" />
<div class="md:col-span-2 flex flex-col gap-2">
<input id="vote-image-file" type="file" accept="image/*" class="p-2 rounded-xl border border-slate-200 bg-white text-sm" onchange="handleVoteImageSelected(event)" />
<div class="text-xs text-slate-500">Optional: select an image file to auto-fill the image URL field (base64 data URL).</div>
</div>
<select id="vote-status" class="p-3 rounded-xl border border-slate-200">
<option value="Open">Open</option>
<option value="Closed">Closed</option>
</select>
</div>
<button id="btn-create-vote" onclick="createVote()" class="mt-3 bg-blue-600 text-white px-4 py-3 rounded-xl font-bold">Create Vote</button>
</div>

<div class="mb-4" style="background:var(--panel);border:1px solid rgba(66,71,84,.12);border-radius:.75rem;padding:1.25rem;"><h3 style="font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:.75rem;">Results Chart</h3><div class="chart-shell chart-shell-sm vote-chart-shell"><canvas id="vote-results-chart"></canvas></div></div>
<div id="vote-list" class="space-y-3"></div>

</div>
