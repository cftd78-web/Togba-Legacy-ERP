<!-- LOGIN VIEW -->

<style>
  #view-login.login-shell-polish{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--app-bg);
    color:var(--ink);
    padding:1.5rem 1rem;
  }
  .login-stage{
    width:100%;
    max-width:440px;
    text-align:center;
  }
  .login-lock-badge{
    width:72px;
    height:72px;
    margin:0 auto 1rem;
    border-radius:9999px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--panel-alt);
    border:1px solid var(--line);
  }
  .login-lock-badge .material-icons-round{
    font-size:2rem;
    color:var(--accent);
  }
  .login-brand-title{
    margin:0;
    font-size:1.75rem;
    font-weight:800;
    color:var(--ink);
    letter-spacing:-.02em;
  }
  .login-brand-sub{
    margin:.25rem 0 1.25rem;
    font-size:.7rem;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.16em;
    color:var(--muted);
  }
  .login-card{
    text-align:left;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:1rem;
    padding:1rem;
    box-shadow:0 10px 28px color-mix(in srgb,var(--ink) 12%,transparent);
  }
  .login-label{
    display:block;
    margin:0 0 .4rem;
    font-size:.72rem;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--muted);
  }
  .login-note{
    margin:0 0 .75rem;
    border:1px solid var(--line);
    background:var(--panel-alt);
    border-radius:.7rem;
    padding:.6rem .7rem;
    font-size:.8rem;
    color:var(--muted);
  }
  .login-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;}
  .login-theme-toggle-wrap{text-align:center;margin-top:.8rem;}
  .login-theme-toggle{
    border:none;
    background:none;
    color:var(--muted);
    font-size:.82rem;
    font-weight:600;
    cursor:pointer;
    text-decoration:underline;
    text-underline-offset:2px;
  }
  .login-theme-toggle:hover{color:var(--ink);}
</style>

<div id="view-login" class="login-shell-polish">
  <div class="login-stage">
    <div class="login-lock-badge">
      <span class="material-icons-round">lock</span>
    </div>

    <h1 class="login-brand-title">Togba Legacy</h1>
    <p class="login-brand-sub">The Sovereign Vault</p>

    <div class="login-card">
      <div id="dev-bypass-banner" class="hidden state-box" style="margin-bottom:.65rem;"></div>
      <div id="login-state-message" class="hidden state-box" style="margin-bottom:.65rem;"></div>

      <div id="step-1">
        <label class="login-label" for="email">Registry Email</label>
        <input id="email" type="email" placeholder="name@family-office.com" autocomplete="email" style="width:100%;margin-bottom:.75rem;background:var(--panel-alt);color:var(--ink);border:1px solid var(--line);border-radius:.75rem;padding:.8rem .9rem;">
        <button id="btn-get-code" onclick="handleOTP()" class="btn-primary" style="width:100%;padding:.8rem .9rem;">Send One-Time Code</button>
      </div>

      <div id="step-2" class="hidden">
        <div class="login-note">Enter the one-time code sent to your email.</div>
        <label class="login-label" for="otp">One-Time Passcode</label>
        <input id="otp" type="text" placeholder="Enter your code" autocomplete="one-time-code" style="width:100%;margin-bottom:.75rem;background:var(--panel-alt);color:var(--ink);border:1px solid var(--line);border-radius:.75rem;padding:.8rem .9rem;">
        <div class="login-grid-2">
          <button id="btn-verify" onclick="handleVerify()" class="btn-primary" style="padding:.8rem .9rem;">Verify</button>
          <button onclick="resetToStepOne()" class="btn-secondary" style="padding:.8rem .9rem;">Back</button>
        </div>
      </div>
    </div>

    <div class="login-theme-toggle-wrap">
      <button class="login-theme-toggle" onclick="cycleTheme()">
        <span data-theme-icon>☼</span>
        <span data-theme-label>Theme</span>
      </button>
    </div>
  </div>
</div>
