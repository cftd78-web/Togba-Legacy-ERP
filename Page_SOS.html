<div id="page-sos" class="page">

<div class="page-header">
<h2 class="page-heading">Emergency SOS</h2>
<button onclick="loadSOSAlerts()" class="btn-refresh">Refresh</button>
</div>

<div id="sos-error" class="hidden err-box mb-3"></div>
<div id="sos-status" class="hidden state-box mb-3"></div>

<div class="grid gap-4 lg:grid-cols-3">
<div class="lg:col-span-1" style="background:var(--panel);border:1px solid rgba(66,71,84,.12);border-radius:.9rem;padding:1rem;">
<button id="btn-trigger-sos" onclick="triggerSOS()" class="p-4 rounded-xl w-full" style="background:#93000a;color:#ffdad6;font-weight:700;">Send SOS Alert</button>
<p class="text-xs mt-3" style="color:var(--muted);">This captures your current location and creates an emergency record.</p>
<div class="card mt-3" style="padding:0;overflow:hidden;min-height:220px">
<div id="sos-map" style="width:100%;height:100%;min-height:220px;border-radius:.85rem;background:var(--panel-alt);display:flex;align-items:center;justify-content:center">
<span style="font-size:.8rem;color:var(--muted)">Map loads when an alert is triggered or selected.</span>
</div>
</div>
<div id="sos-whatsapp-action" class="mt-3"></div>
</div>

<div class="lg:col-span-2" style="background:var(--panel);border:1px solid rgba(66,71,84,.12);border-radius:.9rem;padding:1rem;">
<h3 style="font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:.75rem;">Alert History</h3>
<div id="sos-alert-history" class="space-y-2"></div>
</div>

<div class="lg:col-span-3" style="background:var(--panel);border:1px solid rgba(66,71,84,.12);border-radius:.9rem;padding:1rem;">
<div class="flex items-center justify-between mb-3">
<h3 style="font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);">SOS Media References</h3>
<span id="sos-media-title" style="color:var(--muted);font-size:.75rem;">Select an alert to view media</span>
</div>
<div class="grid gap-3 md:grid-cols-4 mb-4">
<select id="sos-media-type" class="p-3 rounded-xl border">
<option value="photo">photo</option>
<option value="video">video</option>
<option value="audio">audio</option>
</select>
<input id="sos-media-url" type="url" placeholder="https://example.com/media" class="md:col-span-2 p-3 rounded-xl border" />
<button id="btn-save-sos-media" onclick="saveSOSMediaRef()" class="btn-primary">Save Media Link</button>
</div>
<div id="sos-media-list" class="space-y-2"></div>
</div>
</div>

</div>
