<div id="page-sos" class="page">

<div class="flex items-center justify-between mb-4">
<h2 class="text-2xl font-bold">Emergency SOS</h2>
<button onclick="loadSOSAlerts()" class="text-xs px-3 py-2 rounded-lg bg-slate-100">Refresh</button>
</div>

<div id="sos-error" class="hidden text-sm text-red-600 mb-3"></div>
<div id="sos-status" class="hidden text-sm text-blue-700 mb-3"></div>

<div class="grid gap-4 lg:grid-cols-3">
<div class="lg:col-span-1" style="background:var(--panel);border:1px solid rgba(66,71,84,.12);border-radius:.9rem;padding:1rem;">
<button id="btn-trigger-sos" onclick="triggerSOS()" class="p-4 rounded-xl w-full" style="background:#93000a;color:#ffdad6;font-weight:700;">Send SOS Alert</button>
<p class="text-xs text-slate-500 mt-3">This captures your current location and creates an emergency record.</p>
<div id="sos-whatsapp-action" class="mt-3"></div>
</div>

<div class="lg:col-span-2" style="background:var(--panel);border:1px solid rgba(66,71,84,.12);border-radius:.9rem;padding:1rem;">
<h3 style="font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:.75rem;">Alert History</h3>
<div id="sos-alert-history" class="space-y-2"></div>
<div id="sos-map" class="mt-3"></div>
</div>

<div class="lg:col-span-3" style="background:var(--panel);border:1px solid rgba(66,71,84,.12);border-radius:.9rem;padding:1rem;">
<div class="flex items-center justify-between mb-3">
<h3 style="font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);">SOS Media References</h3>
<span id="sos-media-title" class="text-xs text-slate-500">Select an alert to view media</span>
</div>
<div class="grid gap-3 md:grid-cols-4 mb-4">
<select id="sos-media-type" class="p-3 rounded-xl border border-slate-200">
<option value="photo">photo</option>
<option value="video">video</option>
<option value="audio">audio</option>
</select>
<input id="sos-media-url" type="url" placeholder="https://example.com/media" class="md:col-span-2 p-3 rounded-xl border border-slate-200" />
<button id="btn-save-sos-media" onclick="saveSOSMediaRef()" class="bg-blue-600 text-white p-3 rounded-xl font-bold">Save Media Link</button>
</div>
<div id="sos-media-list" class="space-y-2"></div>
</div>
</div>

</div>
