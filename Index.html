<script>
/* Messaging hotfix: clickable channels + robust message loading + auto-select */
(function(){
  window.renderChannelList = function(){
    var el = document.getElementById("channel-list"); if(!el) return;
    if(!userChannels.length){
      el.innerHTML = "<div style='color:var(--muted);font-size:.8rem'>No channels.</div>";
      return;
    }
    el.innerHTML = userChannels.map(function(c){
      var active = c.ChannelID === selectedChannelID;
      var baseStyle = "cursor:pointer;padding:.6rem .75rem;border-radius:.6rem;border:1px solid var(--line);background:var(--panel-alt);margin-bottom:3px";
      var activeStyle = "background:var(--accent-soft);border-color:var(--accent);color:var(--accent)";
      var style = "display:block;width:100%;text-align:left;" + baseStyle + ";" + (active ? activeStyle : "");
      var over = "if(this.dataset.active!=='1'){this.style.background='var(--accent-soft)';this.style.borderColor='var(--accent)';this.style.color='var(--accent)';}";
      var out  = "if(this.dataset.active!=='1'){this.style.background='var(--panel-alt)';this.style.borderColor='var(--line)';this.style.color='var(--ink)';}";
      return "<button onclick=\"selectChannel('"+escapeHtml(c.ChannelID)+"')\" data-active=\""+(active?"1":"0")+"\" onmouseover=\""+over+"\" onmouseout=\""+out+"\" style=\""+style+"\">"+
        "<div style='font-weight:600;font-size:.8rem'>"+escapeHtml(c.Name||c.ChannelID)+"</div>"+
        "<div style='font-size:.68rem;color:var(--muted)'>"+escapeHtml(c.Type||"")+"</div></button>";
    }).join("");

    /* Auto-select first channel if none selected */
    if(!selectedChannelID && userChannels.length){
      selectChannel(userChannels[0].ChannelID);
    }
  };

  window.refreshMessages = function(){
    if(!selectedChannelID) return;
    setMessageError("");
    google.script.run
      .withSuccessHandler(function(res){
        var msgs = Array.isArray(res) ? res
          : Array.isArray(res&&res.messages) ? res.messages
          : [];
        var sent = Array.isArray(res&&res.sent) ? res.sent : [];
        renderMessageHistory(msgs);
        _renderSentMessages(sent);
      })
      .withFailureHandler(function(err){
        if(isSessionExpiredError(err)){ onServerFailure(err); return; }
        setMessageError((err&&err.message)||"Failed to load messages.");
      })
      .getMessages(token, selectedChannelID);
  };
})();
</script>
<script>
/* ================================================================
   MISSING RENDERERS + LIVE TICKER
   All functions called by JS_Blocks but not defined in the monolith.
   Added here so they run after JS_Blocks loads them.
   ================================================================ */

/* ── HOME DASHBOARD SNAPSHOTS ── */

window.renderHomeFinanceSummary = function(data){
  var el=document.getElementById("home-finance-snapshot"); if(!el) return;
  var totals=data.totals||{};
  var fl=data.founderLocks||{};
  var proj=data.projection||{};
  var tc=Number(totals.totalContributions||0);
  var tl=Number(fl.totalLocked||0);
  var tp=Number(proj.totalProjected||0);
  function fc(n){ return "$"+n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}); }
  el.innerText=fc(tc)+" raised · "+fc(tl)+" locked · "+fc(tp)+" projected";
};

window.renderHomeProjectSnapshot = function(data){
  var el=document.getElementById("home-project-snapshot"); if(!el) return;
  var projects=Array.isArray(data.projects)?data.projects:[];
  var active=projects.filter(function(p){return /in.progress|active/i.test(p.Status||"");}).length;
  var done=projects.filter(function(p){return /completed|done/i.test(p.Status||"");}).length;
  var tasks=projects.reduce(function(s,p){return s+(p.tasks?p.tasks.length:(p.TaskCount||0));},0);
  el.innerText=active+" active · "+done+" completed · "+tasks+" tasks";
};

window.renderHomeVoteSnapshot = function(data){
  var el=document.getElementById("home-vote-snapshot"); if(!el) return;
  var votes=Array.isArray(data.votes)?data.votes:[];
  var open=votes.filter(function(v){return /open/i.test(v.Status||"");}).length;
  el.innerText=open+" open proposal"+(open!==1?"s":"")+" · "+votes.length+" total";
};

window.renderHomeTimelineSnapshot = function(data){
  var snap=document.getElementById("home-timeline-snapshot");
  if(snap){
    var upcoming=Array.isArray(data.upcoming)?data.upcoming:[];
    var next30=upcoming.filter(function(e){
      if(!e.NextOccurrence) return false;
      var days=Math.floor((new Date(e.NextOccurrence)-new Date())/86400000);
      return days>=0&&days<=30;
    }).length;
    var nextDate=upcoming.length&&upcoming[0].NextOccurrence
      ?new Date(upcoming[0].NextOccurrence).toLocaleDateString("en-US",{month:"short",day:"numeric"})
      :"—";
    snap.innerText=next30+" event"+(next30!==1?"s":"")+" in 30 days · Next: "+nextDate;
  }
  var act=document.getElementById("home-activity-list");
  if(act){
    var hist=Array.isArray(data.historical)?data.historical:[];
    if(!hist.length){ act.innerHTML="<div style='color:var(--muted);font-size:.8rem'>No recent events.</div>"; return; }
    act.innerHTML=hist.slice(0,5).map(function(e){
      var d=e.EventDate?new Date(e.EventDate).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}):"";
      return "<div style='padding:.4rem 0;border-bottom:1px solid var(--line);font-size:.8rem'>"
        +"<div style='color:var(--ink);font-weight:600'>"+String(e.Title||"").replace(/&/g,"&amp;").replace(/</g,"&lt;")+"</div>"
        +"<div style='color:var(--muted);font-size:.72rem'>"+d+(e.EventType?" · "+e.EventType:"")+"</div>"
        +"</div>";
    }).join("");
  }
};

/* ── ADMIN PAGE RENDERERS ── */

window.renderSettingsSummary = function(settings){
  var el=document.getElementById("admin-settings-summary"); if(!el) return;
  var entries=Array.isArray(settings&&settings.entries)?settings.entries:[];
  if(!entries.length){
    el.innerHTML="<div style='color:var(--muted);font-size:.875rem'>No settings entries.</div>";
    return;
  }
  el.innerHTML=entries.map(function(e){
    var k=String(e.key||e.Key||"").replace(/&/g,"&amp;").replace(/</g,"&lt;");
    var v=String(e.value||e.Value||"—").replace(/&/g,"&amp;").replace(/</g,"&lt;");
    return "<div class='module-stat'><span>"+k+"</span>"
      +"<span style='color:var(--ink);font-size:.75rem'>"+v+"</span></div>";
  }).join("");
};

window.renderInstitutionSettingsSummary = function(settings){
  var el=document.getElementById("admin-inst-settings-summary"); if(!el) return;
  var entries=Array.isArray(settings&&settings.entries)?settings.entries:[];
  if(!entries.length){
    el.innerHTML="<div style='color:var(--muted);font-size:.875rem'>No institution settings.</div>";
    return;
  }
  /* Pick up integration keys */
  entries.forEach(function(e){
    var k=String(e.key||e.Key||"").toLowerCase().replace(/[_\- ]/g,"");
    var v=String(e.value||e.Value||"").trim();
    if(k==="googlecalendarid"||k==="gcalendarid"||k==="calendarid"){
      window._gcalId=v;
      if(typeof window._renderCalendarEmbed==="function") window._renderCalendarEmbed(v);
    }
    if(k==="finnhubapikey"||k==="marketapikey"||k==="tickerapikey"){
      if(typeof window._tickerStart==="function") window._tickerStart(v);
    }
  });
  var sensitive=["apikey","password","secret","token"];
  el.innerHTML=entries.map(function(e){
    var k=String(e.key||e.Key||"").replace(/&/g,"&amp;");
    var v=String(e.value||e.Value||"—");
    var mask=sensitive.some(function(s){ return k.toLowerCase().indexOf(s)!==-1; });
    return "<div class='module-stat'><span>"+k+"</span>"
      +"<span style='color:var(--ink);font-size:.75rem'>"+(mask?"••••••••":v.replace(/&/g,"&amp;").replace(/</g,"&lt;"))+"</span></div>";
  }).join("");
};

window.renderSystemHealth = function(health){
  var el=document.getElementById("admin-health-summary"); if(!el) return;
  var issues=Array.isArray(health&&health.issues)?health.issues:[];
  var ok=!!(health&&health.healthy);
  el.innerHTML="<div class='module-stat'><span>Status</span>"
    +"<span style='font-weight:700;color:"+(ok?"var(--green)":"var(--red)")+"'>"
    +(ok?"✓ Healthy":"⚠ "+issues.length+" issue"+(issues.length!==1?"s":""))
    +"</span></div>"
    +issues.slice(0,5).map(function(i){
      return "<div style='font-size:.72rem;color:var(--red);margin-top:.2rem;padding:.25rem .4rem;"
        +"background:rgba(186,26,26,.08);border-radius:.4rem'>"
        +String(i).replace(/&/g,"&amp;").replace(/</g,"&lt;")+"</div>";
    }).join("");
};

/* ── LIVE TICKER ── */
/* Reads finnhub_api_key from InstitutionSettings via renderInstitutionSettingsSummary */
(function(){
  var SYMS=[
    {label:"S&P 500",  sym:"SPY",            pfx:"",  dp:2},
    {label:"NASDAQ",   sym:"QQQ",            pfx:"",  dp:2},
    {label:"GOLD",     sym:"OANDA:XAU_USD",  pfx:"$", dp:2},
    {label:"BTC/USD",  sym:"BINANCE:BTCUSDT",pfx:"$", dp:0},
    {label:"EUR/USD",  sym:"OANDA:EUR_USD",  pfx:"",  dp:4},
    {label:"WTI",      sym:"OANDA:USOIL_USD",pfx:"$", dp:2}
  ];
  var _key="", _timer=null;

  function _fmt(n,pfx,dp){
    if(!n) return "—";
    return pfx+(dp===0?Math.round(n).toLocaleString():Number(n).toLocaleString(undefined,{minimumFractionDigits:dp,maximumFractionDigits:dp}));
  }
  function _pct(dp){
    var n=Number(dp)||0;
    return (n>0?"+":"")+n.toFixed(2)+"%";
  }
  function _arrow(dir){
    return dir>0?"<span style='color:var(--green)'>▲ </span>"
          :dir<0?"<span style='color:var(--red)'>▼ </span>"
          :"<span style='color:var(--muted)'>— </span>";
  }
  function _render(items){
    var track=document.getElementById("ticker-track"); if(!track) return;
    var html=items.map(function(t){
      var col=t.dir>0?"var(--green)":t.dir<0?"var(--red)":"var(--muted)";
      return "<div class='asset-ticker'>"
        +"<span class='asset-ticker-label'>"+t.label+"</span>"
        +"<span class='asset-ticker-val'>"+t.price+"</span>"
        +"<span class='asset-ticker-chg' style='color:"+col+"'>"+_arrow(t.dir)+t.chg+"</span>"
        +"</div>";
    }).join("");
    track.innerHTML="<div class='asset-ribbon-items'>"+html+"</div>"
                   +"<div class='asset-ribbon-items' aria-hidden='true'>"+html+"</div>";
  }
  function _fetchOne(sym,i,live,render){
    return fetch("https://finnhub.io/api/v1/quote?symbol="+encodeURIComponent(sym.sym)+"&token="+encodeURIComponent(_key))
      .then(function(r){return r.ok?r.json():null;})
      .then(function(d){
        if(d&&d.c){
          var dir=d.dp>0?1:d.dp<0?-1:0;
          live[i]={label:sym.label,price:_fmt(d.c,sym.pfx,sym.dp),chg:_pct(d.dp),dir:dir};
        }
        render(live);
      })
      .catch(function(){render(live);});
  }
  function _fetchAll(){
    if(!_key) return;
    var live=SYMS.map(function(s){return{label:s.label,price:"…",chg:"",dir:0};});
    var chain=Promise.resolve();
    SYMS.forEach(function(sym,i){
      chain=chain
        .then(function(){return new Promise(function(res){setTimeout(res,i*250);});})
        .then(function(){return _fetchOne(sym,i,live,_render);});
    });
    clearTimeout(_timer);
    _timer=setTimeout(_fetchAll,90000);
  }

  window._tickerStart=function(key){
    _key=String(key||"").trim();
    if(_key) _fetchAll();
  };

  /* Show dashes until key arrives */
  _render(SYMS.map(function(s){return{label:s.label,price:"—",chg:"",dir:0};}));
})();

</script>
