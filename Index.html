<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

<title>Togba Legacy ERP</title>

<style>

.page{display:none;}
.page.active{display:block;}

nav button{
display:flex;
flex-direction:column;
align-items:center;
font-size:12px;
}

</style>

</head>

<body class="bg-slate-50 font-sans">

<!-- LOGIN VIEW -->

<div id="view-login" class="min-h-screen flex items-center justify-center p-6">

<div class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-sm">

<h1 class="text-2xl font-bold mb-6 text-center">
Togba Legacy
</h1>

<div id="step-1">

<input id="email"
type="email"
placeholder="Email"
class="w-full p-4 bg-slate-100 rounded-xl mb-4">

<button onclick="handleOTP()"
class="w-full bg-black text-white p-4 rounded-xl font-bold">

Get Code

</button>

</div>

<div id="step-2" class="hidden">

<input id="otp"
type="text"
placeholder="000000"
class="w-full p-4 bg-slate-100 rounded-xl mb-4 text-center text-2xl tracking-widest">

<button onclick="handleVerify()"
class="w-full bg-blue-600 text-white p-4 rounded-xl font-bold">

Verify

</button>

</div>

</div>

</div>

<!-- APP VIEW -->

<div id="view-app" class="hidden pb-24">

<!-- HOME PAGE -->

<div id="page-home" class="page active p-6">

<h2 id="welcome-name" class="text-2xl font-bold mb-4"></h2>

<div class="bg-white p-6 rounded-3xl shadow border border-slate-100">

<h3 class="text-xs font-bold text-slate-400 uppercase mb-4">
Financial Distribution
</h3>

<canvas id="financeChart"></canvas>

</div>

</div>

<!-- FINANCE PAGE -->

<div id="page-finance" class="page p-6">

<h2 class="text-2xl font-bold mb-4">Finance</h2>

<div id="finance-data" class="bg-white p-6 rounded-3xl shadow"></div>

</div>

<!-- PROJECTS PAGE -->

<div id="page-projects" class="page p-6">

<h2 class="text-2xl font-bold mb-4">Projects</h2>

<div id="project-list"></div>

</div>

<!-- MESSAGES PAGE -->

<div id="page-messages" class="page p-6">

<h2 class="text-2xl font-bold mb-4">Messages</h2>

<div id="message-list"></div>

</div>

<!-- SOS PAGE -->

<div id="page-sos" class="page p-6">

<h2 class="text-2xl font-bold mb-4">Emergency SOS</h2>

<button onclick="triggerSOS()"
class="bg-red-600 text-white p-4 rounded-xl font-bold w-full">

Send SOS Alert

</button>

</div>

<!-- VOTING PAGE -->

<div id="page-voting" class="page p-6">

<h2 class="text-2xl font-bold mb-4">Governance Voting</h2>

<div id="vote-list"></div>

</div>

<!-- TIMELINE PAGE -->

<div id="page-timeline" class="page p-6">

<h2 class="text-2xl font-bold mb-4">Family Timeline</h2>

<div id="timeline"></div>

</div>

<!-- ADMIN PAGE -->

<div id="page-admin" class="page p-6">

<h2 class="text-2xl font-bold mb-4">Registry Management</h2>

<div id="user-list" class="space-y-2"></div>

</div>

</div>

<!-- NAVIGATION -->

<nav class="fixed bottom-0 left-0 right-0 bg-white border-t p-3 flex justify-around">

<button onclick="showPage('home')">
<span class="material-icons-round text-blue-600">home</span>
Home
</button>

<button onclick="showPage('finance')">
<span class="material-icons-round">account_balance</span>
Finance
</button>

<button onclick="showPage('projects')">
<span class="material-icons-round">construction</span>
Projects
</button>

<button onclick="showPage('messages')">
<span class="material-icons-round">chat</span>
Messages
</button>

<button onclick="showPage('sos')">
<span class="material-icons-round text-red-600">warning</span>
SOS
</button>

<button onclick="showPage('voting')">
<span class="material-icons-round">how_to_vote</span>
Voting
</button>

<button onclick="showPage('timeline')">
<span class="material-icons-round">history</span>
Timeline
</button>

<button id="btn-nav-admin"
onclick="showPage('admin')"
class="hidden">

<span class="material-icons-round">security</span>
Admin

</button>

</nav>

<script>

let token = ""
let financeChartInstance = null

function isSessionExpiredError(err){
const msg = String((err && err.message) || err || "")
return msg.toLowerCase().indexOf("session expired") !== -1
}

function resetToLogin(message){
token = ""
document.getElementById("step-1").classList.remove("hidden")
document.getElementById("step-2").classList.add("hidden")
document.getElementById("view-app").classList.add("hidden")
document.getElementById("view-login").classList.remove("hidden")
if(message) alert(message)
}

function onServerFailure(err){
if(isSessionExpiredError(err)){
resetToLogin("Your session expired. Please login again.")
return
}
alert((err && err.message) || "Request failed.")
}

function handleOTP(){
google.script.run
.withSuccessHandler(()=>{
document.getElementById("step-1").classList.add("hidden")
document.getElementById("step-2").classList.remove("hidden")
})
.withFailureHandler(onServerFailure)
.loginStepOne(document.getElementById("email").value)
}

function handleVerify(){
google.script.run
.withSuccessHandler(res=>{
token = res.token
initApp()
})
.withFailureHandler(onServerFailure)
.verifyStepTwo(
document.getElementById("email").value,
document.getElementById("otp").value
)
}

function initApp(){
document.getElementById("view-login").classList.add("hidden")
document.getElementById("view-app").classList.remove("hidden")

google.script.run
.withSuccessHandler(data=>{
document.getElementById("welcome-name").innerText = "Hello " + data.profile.name

if(data.profile.role === "Admin")
document.getElementById("btn-nav-admin").classList.remove("hidden")

loadCharts()
})
.withFailureHandler(onServerFailure)
.getDashboardData(token)
}

function loadCharts(){
google.script.run
.withSuccessHandler(data=>{
if(financeChartInstance){
financeChartInstance.destroy()
}

financeChartInstance = new Chart(
document.getElementById("financeChart"),
{
type:"doughnut",
data:{
labels:data.labels,
datasets:[{
data:data.values,
backgroundColor:[
"#2563eb",
"#9333ea",
"#06b6d4",
"#f59e0b"
]
}]
},
options:{
plugins:{
legend:{position:"bottom"}
}
}
}
)
})
.withFailureHandler(onServerFailure)
.getFinanceData(token)
}

function showPage(page){
document.querySelectorAll(".page")
.forEach(p=>p.classList.remove("active"))

document.getElementById("page-"+page)
.classList.add("active")

if(page==="admin") loadAdmin()
}

function loadAdmin(){
google.script.run
.withSuccessHandler(users=>{
let container=document.getElementById("user-list")

container.innerHTML=users.map(u=>`
<div class="bg-white p-4 rounded-2xl border flex justify-between">
<div>
<div class="font-bold">${u.FullName || ""}</div>
<div class="text-xs text-slate-400">${u.EmailOptional || ""}</div>
</div>
<div class="text-xs font-bold bg-slate-100 p-2 rounded-lg">
${u.OneTimeCode || "---"}
</div>
</div>
`).join("")
})
.withFailureHandler(onServerFailure)
.adminGetAllUsers(token)
}

function triggerSOS(){
if(!navigator.geolocation){
alert("GPS not available")
return
}

navigator.geolocation.getCurrentPosition(pos=>{
google.script.run
.withSuccessHandler(()=>alert("SOS sent"))
.withFailureHandler(onServerFailure)
.triggerSOS(token,pos.coords.latitude,pos.coords.longitude)
}, err=>{
alert("Unable to get location: " + ((err && err.message) || "Unknown error"))
}, {timeout:10000, enableHighAccuracy:true})
}

</script>

</body>
</html>
