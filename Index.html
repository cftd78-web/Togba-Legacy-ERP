<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

<title>Togba Legacy ERP</title>

<style>

.page{display:none;}
.page.active{display:block;}

nav button{
display:flex;
flex-direction:column;
align-items:center;
font-size:12px;
}

</style>

</head>

<body class="bg-slate-50 font-sans">

<!-- LOGIN VIEW -->

<div id="view-login" class="min-h-screen flex items-center justify-center p-6">

<div class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-sm">

<h1 class="text-2xl font-bold mb-6 text-center">
Togba Legacy
</h1>

<div id="step-1">

<input id="email"
type="email"
placeholder="Email"
class="w-full p-4 bg-slate-100 rounded-xl mb-4">

<button onclick="handleOTP()"
class="w-full bg-black text-white p-4 rounded-xl font-bold">

Get Code

</button>

</div>

<div id="step-2" class="hidden">

<input id="otp"
type="text"
placeholder="000000"
class="w-full p-4 bg-slate-100 rounded-xl mb-4 text-center text-2xl tracking-widest">

<button onclick="handleVerify()"
class="w-full bg-blue-600 text-white p-4 rounded-xl font-bold">

Verify

</button>

</div>

</div>

</div>

<!-- APP VIEW -->

<div id="view-app" class="hidden pb-24">

<!-- HOME PAGE -->

<div id="page-home" class="page active p-6">

<h2 id="welcome-name" class="text-2xl font-bold mb-4"></h2>

<div class="bg-white p-6 rounded-3xl shadow border border-slate-100">

<h3 class="text-xs font-bold text-slate-400 uppercase mb-4">
Financial Distribution
</h3>

<canvas id="financeChart"></canvas>

</div>

</div>

<!-- FINANCE PAGE -->

<div id="page-finance" class="page p-6">

<h2 class="text-2xl font-bold mb-4">Finance</h2>

<div id="finance-data" class="bg-white p-6 rounded-3xl shadow"></div>

</div>

<!-- PROJECTS PAGE -->

<div id="page-projects" class="page p-6">

<h2 class="text-2xl font-bold mb-4">Projects</h2>

<div id="project-list"></div>

</div>

<!-- MESSAGES PAGE -->

<div id="page-messages" class="page p-6">

<h2 class="text-2xl font-bold mb-4">Messaging</h2>

<div class="grid gap-4 lg:grid-cols-3">

<div class="bg-white p-4 rounded-2xl shadow border border-slate-100">
<h3 class="text-sm font-bold text-slate-500 uppercase mb-3">Channels</h3>
<div id="channel-list" class="space-y-2 max-h-[52vh] overflow-y-auto"></div>
</div>

<div class="bg-white p-4 rounded-2xl shadow border border-slate-100 lg:col-span-2 flex flex-col min-h-[52vh]">
<div class="flex items-center justify-between mb-3">
<h3 id="message-channel-title" class="text-sm font-bold text-slate-500 uppercase">Select a channel</h3>
<button onclick="refreshMessages()" class="text-xs px-3 py-2 rounded-lg bg-slate-100">Refresh</button>
</div>
<div id="message-error" class="hidden text-sm text-red-600 mb-2"></div>
<div id="message-history" class="flex-1 overflow-y-auto space-y-2 bg-slate-50 rounded-xl p-3"></div>
<div class="mt-3 flex gap-2">
<input id="message-input" type="text" placeholder="Type a message..." class="flex-1 p-3 rounded-xl border border-slate-200" />
<button id="btn-send-message" onclick="sendCurrentMessage()" class="bg-blue-600 text-white px-4 py-3 rounded-xl font-bold">Send</button>
</div>
</div>

</div>

</div>

<!-- SOS PAGE -->

<div id="page-sos" class="page p-6">

<h2 class="text-2xl font-bold mb-4">Emergency SOS</h2>

<button onclick="triggerSOS()"
class="bg-red-600 text-white p-4 rounded-xl font-bold w-full">

Send SOS Alert

</button>

</div>

<!-- VOTING PAGE -->

<div id="page-voting" class="page p-6">

<h2 class="text-2xl font-bold mb-4">Governance Voting</h2>

<div id="vote-list"></div>

</div>

<!-- TIMELINE PAGE -->

<div id="page-timeline" class="page p-6">

<div class="flex items-center justify-between mb-4">
<h2 class="text-2xl font-bold">Family Timeline</h2>
<button onclick="loadTimelineData()" class="text-xs px-3 py-2 rounded-lg bg-slate-100">Refresh</button>
</div>

<div id="timeline-error" class="hidden text-sm text-red-600 mb-3"></div>

<div class="grid gap-4 lg:grid-cols-3">
<div class="bg-white p-4 rounded-2xl shadow border border-slate-100 lg:col-span-3">
<h3 class="text-sm font-bold text-slate-500 uppercase mb-3">Unified Timeline</h3>
<div id="timeline-list" class="space-y-3"></div>
</div>
<div class="bg-white p-4 rounded-2xl shadow border border-slate-100">
<h3 class="text-sm font-bold text-slate-500 uppercase mb-3">Historical</h3>
<div id="timeline-history" class="space-y-3"></div>
</div>
<div class="bg-white p-4 rounded-2xl shadow border border-slate-100 lg:col-span-2">
<h3 class="text-sm font-bold text-slate-500 uppercase mb-3">Upcoming Events</h3>
<div id="timeline-upcoming" class="space-y-3"></div>
</div>
</div>

</div>

<!-- ADMIN PAGE -->

<div id="page-admin" class="page p-6">

<h2 class="text-2xl font-bold mb-4">Registry Management</h2>

<div id="user-list" class="space-y-2"></div>

</div>

</div>

<!-- NAVIGATION -->

<nav class="fixed bottom-0 left-0 right-0 bg-white border-t p-3 flex justify-around">

<button onclick="showPage('home')">
<span class="material-icons-round text-blue-600">home</span>
Home
</button>

<button onclick="showPage('finance')">
<span class="material-icons-round">account_balance</span>
Finance
</button>

<button onclick="showPage('projects')">
<span class="material-icons-round">construction</span>
Projects
</button>

<button onclick="showPage('messages')">
<span class="material-icons-round">chat</span>
Messages
</button>

<button onclick="showPage('sos')">
<span class="material-icons-round text-red-600">warning</span>
SOS
</button>

<button onclick="showPage('voting')">
<span class="material-icons-round">how_to_vote</span>
Voting
</button>

<button onclick="showPage('timeline')">
<span class="material-icons-round">history</span>
Timeline
</button>

<button id="btn-nav-admin"
onclick="showPage('admin')"
class="hidden">

<span class="material-icons-round">security</span>
Admin

</button>

</nav>

<script>

let token = ""
let financeChartInstance = null
let userChannels = []
let selectedChannelID = ""
let timelineLoaded = false

function isSessionExpiredError(err){
const msg = String((err && err.message) || err || "")
return msg.toLowerCase().indexOf("session expired") !== -1
}

function resetToLogin(message){
token = ""
userChannels = []
selectedChannelID = ""
timelineLoaded = false
document.getElementById("step-1").classList.remove("hidden")
document.getElementById("step-2").classList.add("hidden")
document.getElementById("view-app").classList.add("hidden")
document.getElementById("view-login").classList.remove("hidden")
if(message) alert(message)
}

function onServerFailure(err){
if(isSessionExpiredError(err)){
resetToLogin("Your session expired. Please login again.")
return
}
alert((err && err.message) || "Request failed.")
}

function escapeHtml(value){
return String(value || "")
.replaceAll("&", "&amp;")
.replaceAll("<", "&lt;")
.replaceAll(">", "&gt;")
.replaceAll('"', "&quot;")
.replaceAll("'", "&#39;")
}

function setMessageError(message){
const el = document.getElementById("message-error")
if(!message){
el.classList.add("hidden")
el.innerText = ""
return
}
el.classList.remove("hidden")
el.innerText = message
}

function setTimelineError(message){
const el = document.getElementById("timeline-error")
if(!message){
el.classList.add("hidden")
el.innerText = ""
return
}
el.classList.remove("hidden")
el.innerText = message
}

function formatDate(value){
if(!value) return "Unknown date"
const d = new Date(value)
if(Number.isNaN(d.getTime())) return "Unknown date"
return d.toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"})
}

function handleOTP(){
google.script.run
.withSuccessHandler(()=>{
document.getElementById("step-1").classList.add("hidden")
document.getElementById("step-2").classList.remove("hidden")
})
.withFailureHandler(onServerFailure)
.loginStepOne(document.getElementById("email").value)
}

function handleVerify(){
google.script.run
.withSuccessHandler(res=>{
token = res.token
initApp()
})
.withFailureHandler(onServerFailure)
.verifyStepTwo(
document.getElementById("email").value,
document.getElementById("otp").value
)
}

function initApp(){
document.getElementById("view-login").classList.add("hidden")
document.getElementById("view-app").classList.remove("hidden")

google.script.run
.withSuccessHandler(data=>{
document.getElementById("welcome-name").innerText = "Hello " + data.profile.name

if(data.profile.role === "Admin")
document.getElementById("btn-nav-admin").classList.remove("hidden")

loadCharts()
loadUserChannels()
})
.withFailureHandler(onServerFailure)
.getDashboardData(token)
}

function loadCharts(){
google.script.run
.withSuccessHandler(data=>{
if(financeChartInstance){
financeChartInstance.destroy()
}

financeChartInstance = new Chart(
document.getElementById("financeChart"),
{
type:"doughnut",
data:{
labels:data.labels,
datasets:[{
data:data.values,
backgroundColor:[
"#2563eb",
"#9333ea",
"#06b6d4",
"#f59e0b"
]
}]
},
options:{
plugins:{
legend:{position:"bottom"}
}
}
}
)
})
.withFailureHandler(onServerFailure)
.getFinanceData(token)
}

function showPage(page){
document.querySelectorAll(".page")
.forEach(p=>p.classList.remove("active"))

document.getElementById("page-"+page)
.classList.add("active")

if(page==="admin") loadAdmin()
if(page==="messages") loadUserChannels()
if(page==="timeline") loadTimelineData()
}

function loadAdmin(){
google.script.run
.withSuccessHandler(users=>{
let container=document.getElementById("user-list")

container.innerHTML=users.map(u=>`
<div class="bg-white p-4 rounded-2xl border flex justify-between">
<div>
<div class="font-bold">${escapeHtml(u.FullName || "")}</div>
<div class="text-xs text-slate-400">${escapeHtml(u.EmailOptional || "")}</div>
</div>
<div class="text-xs font-bold bg-slate-100 p-2 rounded-lg">
${escapeHtml(u.OneTimeCode || "---")}
</div>
</div>
`).join("")
})
.withFailureHandler(onServerFailure)
.adminGetAllUsers(token)
}

function loadUserChannels(){
setMessageError("")
google.script.run
.withSuccessHandler(channels=>{
userChannels = Array.isArray(channels) ? channels : []
renderChannelList()
if(!userChannels.length){
selectedChannelID = ""
renderMessageHistory([])
document.getElementById("message-channel-title").innerText = "No channels available"
setMessageError("You are not a member of any active channel.")
return
}
if(!selectedChannelID || !userChannels.some(c=>c.ChannelID===selectedChannelID)){
selectedChannelID = userChannels[0].ChannelID
}
renderChannelList()
refreshMessages()
})
.withFailureHandler(err=>{
if(isSessionExpiredError(err)){
onServerFailure(err)
return
}
setMessageError((err && err.message) || "Unable to load channels.")
})
.getUserChannels(token)
}

function renderChannelList(){
const container = document.getElementById("channel-list")
if(!userChannels.length){
container.innerHTML = "<div class='text-sm text-slate-500'>No channels.</div>"
return
}
container.innerHTML = userChannels.map(ch=>`
<button onclick="selectChannel('${escapeHtml(ch.ChannelID)}')"
class="w-full text-left p-3 rounded-xl border ${ch.ChannelID===selectedChannelID ? 'bg-blue-50 border-blue-200' : 'bg-white border-slate-200'}">
<div class="font-semibold">${escapeHtml(ch.Name || ch.ChannelID)}</div>
<div class="text-xs text-slate-500">${escapeHtml(ch.Type || 'channel')}</div>
</button>
`).join("")
}

function selectChannel(channelID){
selectedChannelID = channelID
renderChannelList()
refreshMessages()
}

function renderMessageHistory(messages){
const container = document.getElementById("message-history")
if(!messages || !messages.length){
container.innerHTML = "<div class='text-sm text-slate-500'>No messages yet.</div>"
return
}
container.innerHTML = messages.map(msg=>`
<div class="bg-white border border-slate-100 rounded-xl p-3">
<div class="text-xs text-slate-500 mb-1">${escapeHtml(msg.SenderEmail)} • ${escapeHtml(new Date(msg.SentAt).toLocaleString())}</div>
<div class="text-sm text-slate-800 whitespace-pre-wrap">${escapeHtml(msg.Body)}</div>
</div>
`).join("")
container.scrollTop = container.scrollHeight
}

function refreshMessages(){
if(!selectedChannelID){
renderMessageHistory([])
return
}
const selected = userChannels.find(c=>c.ChannelID===selectedChannelID)
document.getElementById("message-channel-title").innerText = selected ? (selected.Name || selected.ChannelID) : selectedChannelID
setMessageError("")
google.script.run
.withSuccessHandler(messages=>{
renderMessageHistory(messages)
})
.withFailureHandler(err=>{
if(isSessionExpiredError(err)){
onServerFailure(err)
return
}
setMessageError((err && err.message) || "Unable to load messages.")
})
.getMessages(token, selectedChannelID)
}

function sendCurrentMessage(){
const btn = document.getElementById("btn-send-message")
const input = document.getElementById("message-input")
const text = String(input.value || "").trim()
if(!selectedChannelID){
setMessageError("Please select a channel.")
return
}
if(!text){
setMessageError("Message cannot be empty.")
return
}
btn.disabled = true
btn.classList.add("opacity-60")
setMessageError("")
google.script.run
.withSuccessHandler(()=>{
input.value = ""
btn.disabled = false
btn.classList.remove("opacity-60")
refreshMessages()
})
.withFailureHandler(err=>{
btn.disabled = false
btn.classList.remove("opacity-60")
if(isSessionExpiredError(err)){
onServerFailure(err)
return
}
setMessageError((err && err.message) || "Unable to send message.")
})
.sendMessage(token, selectedChannelID, text)
}

function renderTimelineList(items){
const container = document.getElementById("timeline-list")
if(!items || !items.length){
container.innerHTML = "<div class='text-sm text-slate-500'>No timeline items.</div>"
return
}
container.innerHTML = items.map(item=>`
<div class="border border-slate-200 rounded-xl p-3 bg-slate-50">
<div class="text-xs text-slate-500 mb-1">${escapeHtml(formatDate(item.date))} • ${escapeHtml(item.category)}</div>
<div class="font-semibold text-slate-800">${escapeHtml(item.title || "Untitled")}</div>
<div class="text-xs text-slate-600 mt-1">${escapeHtml(item.eventType || "")}${item.recurrence ? ' • ' + escapeHtml(item.recurrence) : ''}</div>
${item.description ? `<div class="text-sm text-slate-700 mt-2 whitespace-pre-wrap">${escapeHtml(item.description)}</div>` : ''}
</div>
`).join("")
}

function renderHistoryList(items){
const container = document.getElementById("timeline-history")
if(!items || !items.length){
container.innerHTML = "<div class='text-sm text-slate-500'>No historical records found.</div>"
return
}
container.innerHTML = items.map(item=>`
<div class="border border-slate-200 rounded-xl p-3">
<div class="text-xs text-slate-500">${escapeHtml(formatDate(item.EventDate))}</div>
<div class="font-semibold text-slate-800">${escapeHtml(item.Title || "Untitled")}</div>
<div class="text-xs text-slate-600 mt-1">${escapeHtml(item.EventType || "")}</div>
${item.Description ? `<div class="text-sm text-slate-700 mt-2 whitespace-pre-wrap">${escapeHtml(item.Description)}</div>` : ''}
</div>
`).join("")
}

function renderUpcomingList(items){
const container = document.getElementById("timeline-upcoming")
if(!items || !items.length){
container.innerHTML = "<div class='text-sm text-slate-500'>No upcoming events.</div>"
return
}
container.innerHTML = items.map(item=>`
<div class="border border-slate-200 rounded-xl p-3">
<div class="text-xs text-slate-500">Next: ${escapeHtml(formatDate(item.NextOccurrence))}</div>
<div class="font-semibold text-slate-800">${escapeHtml(item.Title || "Untitled")}</div>
<div class="text-xs text-slate-600 mt-1">${escapeHtml(item.Recurrence || "One-time")}</div>
<div class="text-xs text-slate-400 mt-1">Original date: ${escapeHtml(formatDate(item.EventDate))}</div>
</div>
`).join("")
}

function loadTimelineData(){
setTimelineError("")
if(!timelineLoaded){
document.getElementById("timeline-list").innerHTML = "<div class='text-sm text-slate-500'>Loading timeline...</div>"
document.getElementById("timeline-history").innerHTML = "<div class='text-sm text-slate-500'>Loading history...</div>"
document.getElementById("timeline-upcoming").innerHTML = "<div class='text-sm text-slate-500'>Loading upcoming events...</div>"
}
google.script.run
.withSuccessHandler(data=>{
timelineLoaded = true
renderTimelineList((data && data.timeline) || [])
renderHistoryList((data && data.historical) || [])
renderUpcomingList((data && data.upcoming) || [])
})
.withFailureHandler(err=>{
if(isSessionExpiredError(err)){
onServerFailure(err)
return
}
setTimelineError((err && err.message) || "Unable to load timeline data.")
if(!timelineLoaded){
renderTimelineList([])
renderHistoryList([])
renderUpcomingList([])
}
})
.getTimelineData(token)
}

function triggerSOS(){
if(!navigator.geolocation){
alert("GPS not available")
return
}

navigator.geolocation.getCurrentPosition(pos=>{
google.script.run
.withSuccessHandler(()=>alert("SOS sent"))
.withFailureHandler(onServerFailure)
.triggerSOS(token,pos.coords.latitude,pos.coords.longitude)
}, err=>{
alert("Unable to get location: " + ((err && err.message) || "Unknown error"))
}, {timeout:10000, enableHighAccuracy:true})
}

</script>

</body>
</html>
