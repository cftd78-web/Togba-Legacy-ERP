<!-- TOPBAR -->
<header class="topbar">
  <div class="topbar-row">
    <div class="brand-mark">

      <!-- Hamburger: mobile only — toggleSidebar() is wired in index.html HOTFIX BLOCK 5 -->
      <button onclick="toggleSidebar()" id="mobile-menu-btn"
        style="display:flex;align-items:center;justify-content:center;
               width:34px;height:34px;border-radius:.5rem;
               border:1px solid var(--line);background:var(--panel-alt);
               color:var(--muted);cursor:pointer;flex-shrink:0;margin-right:.4rem;">
        <span class="material-icons-round" style="font-size:18px;">menu</span>
      </button>

      <div class="brand-dot"></div>
      <div style="overflow:hidden;">
        <div style="font-size:.6rem;text-transform:uppercase;letter-spacing:.15em;
                    color:var(--muted);font-weight:600;white-space:nowrap;">Togba Legacy</div>
        <div style="font-size:.7rem;font-weight:600;color:var(--muted);
                    white-space:nowrap;" id="topbar-role-label"></div>
      </div>
    </div>

    <div style="display:flex;align-items:center;gap:.5rem;">
      <span id="welcome-name"
        style="font-size:.8rem;font-weight:600;color:var(--ink);white-space:nowrap;">Welcome</span>

      <!-- SOS -->
      <button onclick="showPage('sos')"
        style="display:flex;align-items:center;gap:.3rem;padding:.35rem .7rem;
               border-radius:.5rem;font-size:.7rem;font-weight:700;letter-spacing:.05em;
               background:rgba(186,26,26,.12);color:var(--red);border:none;cursor:pointer;">
        <span class="material-icons-round" style="font-size:14px;">warning</span>SOS
      </button>

      <!-- Theme toggle -->
      <button class="theme-btn" onclick="cycleTheme()" title="Toggle theme"
        style="width:32px;height:32px;">
        <span class="material-icons-round" data-theme-icon style="font-size:16px;">
          brightness_auto
        </span>
      </button>

      <!-- Logout -->
      <button onclick="resetToLogin('Logged out.')"
        style="font-size:.72rem;padding:.35rem .7rem;border-radius:.5rem;
               border:1px solid var(--line);background:var(--panel-alt);
               color:var(--muted);cursor:pointer;">Logout</button>
    </div>
  </div>
</header>

<style>
/* Hamburger visible on mobile only */
@media (min-width:768px){
  #mobile-menu-btn { display:none !important; }
}
@media (max-width:767px){
  #mobile-menu-btn { display:flex !important; }
  #welcome-name    { display:none !important; }
}
</style>
