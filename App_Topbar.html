<header class="topbar">
  <div class="topbar-row">
    <div class="brand-mark">
      <button onclick="toggleSidebar()" class="md-hidden"
        style="display:flex;align-items:center;justify-content:center;width:34px;height:34px;
        border-radius:.5rem;border:1px solid var(--line);background:var(--panel-alt);
        color:var(--muted);cursor:pointer;flex-shrink:0">
        <span class="material-icons-round" style="font-size:18px">menu</span>
      </button>
      <div class="brand-dot" style="flex-shrink:0"></div>
      <div>
        <div style="font-size:.58rem;text-transform:uppercase;letter-spacing:.15em;
          color:var(--muted);font-weight:600">Togba Legacy</div>
        <h2 id="welcome-name" style="font-size:.95rem;font-weight:700;color:var(--ink);
          margin:0;line-height:1.2">Welcome</h2>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:.4rem">
      <button class="theme-btn" onclick="cycleTheme()" title="Toggle theme">
        <span data-theme-icon class="material-icons-round" style="font-size:16px">brightness_auto</span>
      </button>
      <button onclick="resetToLogin('Logged out.')"
        style="font-size:.72rem;padding:.35rem .65rem;border-radius:.5rem;
        border:1px solid var(--line);background:var(--panel-alt);color:var(--muted);cursor:pointer">
        Logout
      </button>
    </div>
  </div>
</header>
<style>@media(min-width:768px){.md-hidden{display:none!important}}</style>
