function setBypassBanner(message, type){
const el = document.getElementById("dev-bypass-banner")
if(!el) return
if(!message){
el.classList.add("hidden")
el.innerText = ""
el.className = "hidden mb-3 text-xs rounded-xl border px-3 py-2"
return
}
el.classList.remove("hidden")
el.innerText = message
el.className = `mb-3 text-xs rounded-xl border px-3 py-2 ${type==="error" ? "border-red-200 bg-red-50 text-red-700" : "border-amber-200 bg-amber-50 text-amber-800"}`
}

function setLoginMessage(message, type){
const el = document.getElementById("login-state-message")
if(!el) return
if(!message){
el.classList.add("hidden")
el.innerText = ""
el.className = "hidden mb-3 text-xs rounded-xl border border-blue-100 bg-blue-50 px-3 py-2 text-blue-700"
return
}
el.classList.remove("hidden")
el.innerText = message
el.className = `mb-3 text-xs rounded-xl border px-3 py-2 ${type==="error" ? "border-red-200 bg-red-50 text-red-700" : "border-blue-100 bg-blue-50 text-blue-700"}`
}

function setButtonBusy(id, isBusy, busyLabel, idleLabel){
const button = document.getElementById(id)
if(!button) return
button.disabled = !!isBusy
button.classList.toggle("opacity-70", !!isBusy)
button.classList.toggle("cursor-not-allowed", !!isBusy)
button.innerText = isBusy ? busyLabel : idleLabel
}

function resetToStepOne(){
document.getElementById("step-1").classList.remove("hidden")
document.getElementById("step-2").classList.add("hidden")
document.getElementById("otp").value = ""
setLoginMessage("")
}

function isSessionExpiredError(err){
const msg = String((err && err.message) || err || "")
return msg.toLowerCase().indexOf("session expired") !== -1
}

function resetToLogin(message){
token = ""
userChannels = []
selectedChannelID = ""
channelDirectory = []
timelineLoaded = false
projectsLoaded = false
projectsCache = []

document.getElementById("email").value = ""
setButtonBusy("btn-get-code", false, "Sending...", "Send One-Time Code")
setButtonBusy("btn-verify", false, "Verifying...", "Verify")
if(message) alert(message)
if(developerBypassActive){
initializeAuthView()
}
}

function onServerFailure(err){
if(isSessionExpiredError(err)){
resetToLogin("Your session expired. Please login again.")
return
}
alert((err && err.message) || "Request failed.")
}

function initializeAuthView(){
setBypassBanner("")
setLoginMessage("")
google.script.run
.withSuccessHandler(config=>{
const bypassEnabled = !!(config && config.developerBypassEnabled)
if(!bypassEnabled){
developerBypassActive = false
return
}

developerBypassActive = true
setBypassBanner("Developer bypass is ACTIVE (temporary). OTP login is skipped for UI debugging.")
setLoginMessage("Developer bypass active. Starting debug session...")
setButtonBusy("btn-get-code", true, "Bypassed", "Send One-Time Code")
setButtonBusy("btn-verify", true, "Bypassed", "Verify")

google.script.run
.withSuccessHandler(res=>{
token = (res && res.token) || ""
if(!token){
setBypassBanner("Developer bypass failed: empty session token.", "error")
setLoginMessage("Unable to initialize developer bypass session.", "error")
setButtonBusy("btn-get-code", false, "Bypassed", "Send One-Time Code")
setButtonBusy("btn-verify", false, "Bypassed", "Verify")
return
}
initApp()
})
.withFailureHandler(err=>{
setBypassBanner("Developer bypass failed. Check Code.gs toggle and logs.", "error")
setLoginMessage((err && err.message) || "Failed to start bypass session.", "error")
setButtonBusy("btn-get-code", false, "Bypassed", "Send One-Time Code")
setButtonBusy("btn-verify", false, "Bypassed", "Verify")
})
.startDeveloperBypassSession()
})
.withFailureHandler(err=>{
setBypassBanner("Unable to load auth mode config.", "error")
setLoginMessage((err && err.message) || "Unable to initialize login screen.", "error")
})
.getAuthModeConfig()
}

function escapeHtml(value){
return String(value || "")
.replaceAll("&", "&amp;")
.replaceAll("<", "&lt;")
.replaceAll(">", "&gt;")
.replaceAll('"', "&quot;")
.replaceAll("'", "&#39;")
}

function formatDate(value){
if(!value) return "Unknown date"
const d = new Date(value)
if(Number.isNaN(d.getTime())) return "Unknown date"
return d.toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"})
}

function formatCurrency(value){
const amount = Number(value) || 0
return amount.toLocaleString(undefined,{style:"currency",currency:"USD",minimumFractionDigits:2,maximumFractionDigits:2})
}

function formatPercent(value){
return `${Number(value || 0).toFixed(2)}%`
}

function handleOTP(){
if(developerBypassActive){
setLoginMessage("Developer bypass mode is active. OTP flow is disabled in this debug session.", "error")
return
}
setLoginMessage("")
setButtonBusy("btn-get-code", true, "Sending...", "Send One-Time Code")
google.script.run
.withSuccessHandler(res=>{
setButtonBusy("btn-get-code", false, "Sending...", "Send One-Time Code")
document.getElementById("step-1").classList.add("hidden")
document.getElementById("step-2").classList.remove("hidden")
setLoginMessage("One-time code sent. Enter your 6-digit code to continue.")
if(res && res.deliveredByEmail===false){
alert("OTP generated. Email delivery failed in this environment; you can still use the generated OTP from Access sheet as fallback.")
}
})
.withFailureHandler(err=>{
setButtonBusy("btn-get-code", false, "Sending...", "Send One-Time Code")
setLoginMessage((err && err.message) || "Unable to send code right now.", "error")
onServerFailure(err)
})
.loginStepOne(document.getElementById("email").value)
}

function handleVerify(){
if(developerBypassActive){
setLoginMessage("Developer bypass mode is active. OTP verification is disabled in this debug session.", "error")
return
}
setLoginMessage("")
setButtonBusy("btn-verify", true, "Verifying...", "Verify")
google.script.run
.withSuccessHandler(res=>{
setButtonBusy("btn-verify", false, "Verifying...", "Verify")
token = res.token
initApp()
})
.withFailureHandler(err=>{
setButtonBusy("btn-verify", false, "Verifying...", "Verify")
setLoginMessage((err && err.message) || "Verification failed.", "error")
onServerFailure(err)
})
.verifyStepTwo(
document.getElementById("email").value,
document.getElementById("otp").value
)
}

function initApp(){
document.getElementById("view-login").classList.add("hidden")
document.getElementById("view-app").classList.remove("hidden")

setHomeStatus("Loading dashboard summary...")
document.getElementById("btn-nav-admin").classList.add("hidden")

google.script.run
.withSuccessHandler(data=>{
const profile = (data && data.profile) || {}
document.getElementById("welcome-name").innerText = "Hello " + (profile.name || "")
currentUserEmail = String(profile.email || "").toLowerCase()
currentUserRole = String(profile.role || "")

if(currentUserRole === "Admin"){
document.getElementById("btn-nav-admin").classList.remove("hidden")
}

showPage("home")
loadHomeEssentials(true)
})
.withFailureHandler(onServerFailure)
.getStartupBootstrap(token)
}

function loadHomeEssentials(forceReload){
if(homeLoaded && !forceReload) return
homeLoaded = true
setHomeError("")
setHomeStatus("Loading finance, projects, governance, and timeline...")
document.getElementById("home-system-status").innerText = "Syncing dashboard modules..."
document.getElementById("home-chart-empty").classList.add("hidden")
document.getElementById("home-activity-list").innerHTML = "<div class='text-sm text-slate-500'>Loading timeline highlights...</div>"

google.script.run
.withSuccessHandler(financeData=>{
renderHomeFinanceSummary(financeData || {})

google.script.run
.withSuccessHandler(projectData=>{
renderHomeProjectSnapshot(projectData || {})

google.script.run
.withSuccessHandler(voteData=>{
renderHomeVoteSnapshot(voteData || {})

google.script.run
.withSuccessHandler(timelineData=>{
renderHomeTimelineSnapshot(timelineData || {})
document.getElementById("home-system-status").innerText = "Connected and current as of this session."
setHomeStatus("Dashboard loaded.")
})
.withFailureHandler(err=>{
renderHomeTimelineSnapshot({})
if(isSessionExpiredError(err)){
onServerFailure(err)
return
}
setHomeError((err && err.message) || "Timeline snapshot unavailable.")
setHomeStatus("Dashboard partially loaded. Timeline snapshot unavailable.")
})
.getTimelineData(token)
})
.withFailureHandler(err=>{
renderHomeVoteSnapshot({})
if(isSessionExpiredError(err)){
onServerFailure(err)
return
}
setHomeError((err && err.message) || "Governance snapshot unavailable.")
setHomeStatus("Dashboard partially loaded. Governance snapshot unavailable.")
})
.getVotingDashboard(token)
})
.withFailureHandler(err=>{
renderHomeProjectSnapshot({})
if(isSessionExpiredError(err)){
onServerFailure(err)
return
}
setHomeError((err && err.message) || "Projects snapshot unavailable.")
setHomeStatus("Dashboard partially loaded. Projects snapshot unavailable.")
})
.getProjectBoard(token)
})
.withFailureHandler(err=>{
if(isSessionExpiredError(err)){
onServerFailure(err)
return
}
homeLoaded = false
setHomeError((err && err.message) || "Unable to load home dashboard.")
setHomeStatus("Unable to sync dashboard summary. You can retry by revisiting Home.")
document.getElementById("home-system-status").innerText = "Summary unavailable."
})
.getFinanceDashboardData(token)
}

function renderHomeFinanceSummary(data){
const totals = (data && data.totals) || {}
const allocation = (data && data.allocation) || {}
const contributionCategories = totals.contributionCategories || {}
const categoryLabels = Object.keys(contributionCategories)
const categoryValues = Object.values(contributionCategories)
if(financeChartInstance){
financeChartInstance.destroy()
}
financeChartInstance = new Chart(document.getElementById("financeChart"), {
type:"doughnut",
data:{labels:categoryLabels,datasets:[{data:categoryValues,backgroundColor:["#2563eb","#9333ea","#06b6d4","#f59e0b","#0f766e"]}]},
options:{maintainAspectRatio:false,responsive:true,plugins:{legend:{position:"bottom"}}}
})
const points = categoryValues.filter(v=>Number(v)>0)
if(!points.length){
document.getElementById("home-chart-empty").classList.remove("hidden")
}
const totalContributions = Number(totals.totalContributions || 0)
const projected = (allocation.breakdown || []).reduce((sum,item)=>sum + (Number(item.projectedAmount)||0), 0)
document.getElementById("home-finance-snapshot").innerText = `${formatCurrency(totalContributions)} total • ${formatCurrency(projected)} projected`
}

function renderHomeProjectSnapshot(res){
const projects = (res && Array.isArray(res.projects)) ? res.projects : []
if(!projects.length){
document.getElementById("home-project-snapshot").innerText = "No active projects found yet."
return
}
const active = projects.filter(p=>String(p.Status||"").toLowerCase()!=="completed")
const avgProgress = active.length ? (active.reduce((sum,p)=>sum + (Number(p.ProgressPercent)||0),0)/active.length) : 0
document.getElementById("home-project-snapshot").innerText = `${active.length} active projects • ${formatPercent(avgProgress)} avg progress`
}

function renderHomeVoteSnapshot(res){
const votes = (res && Array.isArray(res.votes)) ? res.votes : []
if(!votes.length){
document.getElementById("home-vote-snapshot").innerText = "No governance proposals yet."
return
}
const open = votes.filter(v=>String(v.Status||"").toLowerCase()==="open").length
const ballots = votes.reduce((sum,v)=>sum + (Number(v.totalBallots)||0),0)
document.getElementById("home-vote-snapshot").innerText = `${open} open vote(s) • ${ballots} ballots recorded`
}

function renderHomeTimelineSnapshot(res){
const upcoming = (res && Array.isArray(res.upcoming)) ? res.upcoming : []
const historical = (res && Array.isArray(res.historical)) ? res.historical : []
document.getElementById("home-timeline-snapshot").innerText = `${upcoming.length} upcoming • ${historical.length} historical records`
const host = document.getElementById("home-activity-list")
const activities = upcoming.slice(0,2).map(item=>({
kind:"Upcoming",
title:item.Title || "Event",
date:item.NextOccurrence || item.EventDate
})).concat(historical.slice(0,3).map(item=>({
kind:"History",
title:item.Title || "Record",
date:item.EventDate
})))
if(!activities.length){
host.innerHTML = "<div class='text-sm text-slate-500'>No timeline records available yet.</div>"
return
}
host.innerHTML = activities.map(item=>`<div class='border border-slate-200 rounded-xl p-3 bg-slate-50'><div class='text-[11px] uppercase font-bold tracking-wide text-slate-500'>${escapeHtml(item.kind)}</div><div class='text-sm font-semibold text-slate-800 mt-1'>${escapeHtml(item.title)}</div><div class='text-xs text-slate-500 mt-1'>${escapeHtml(formatDate(item.date))}</div></div>`).join("")
}

function showPage(page){
document.querySelectorAll(".page")
.forEach(p=>p.classList.remove("active"))

document.getElementById("page-"+page)
.classList.add("active")
document.querySelectorAll("#bottom-nav button").forEach(btn=>btn.classList.remove("active"))
const activeBtn = document.querySelector(`#bottom-nav button[onclick="showPage('${page}')"]`)
if(activeBtn) activeBtn.classList.add("active")

if(page==="home") loadHomeEssentials()
if(page==="admin"){
if(!adminLoaded){
loadAdmin()
}
return
}
if(page==="messages"){
loadUserChannels()
return
}
if(page==="timeline"){
loadTimelineData()
return
}
if(page==="finance"){
if(!financeLoaded){
loadFinanceDashboard()
}
return
}
if(page==="projects"){
loadProjects()
return
}
if(page==="voting"){
loadVotes()
return
}
if(page==="sos"){
loadSOSAlerts()
return
}
if(page==="family"){
if(!familyLoaded){
loadFamilyData()
}
}
}

function loadProjects(){
setProjectError("")
setProjectStatus("")
const list = document.getElementById("project-list")
if(!projectsLoaded){
list.innerHTML = "<div class='text-sm text-slate-500'>Loading projects...</div>"
}
google.script.run
.withSuccessHandler(res=>{
projectsLoaded = true
projectPermissions = {
canCreateProject: !!(res && res.permissions && res.permissions.canCreateProject),
canEditTask: !!(res && res.permissions && res.permissions.canEditTask)
}
projectsCache = (res && Array.isArray(res.projects)) ? res.projects : []
if(!selectedProjectID || !projectsCache.some(p=>p.ProjectID===selectedProjectID)){
selectedProjectID = projectsCache.length ? projectsCache[0].ProjectID : ""
}
renderProjects()
if(selectedProjectID){
loadProjectTasks(selectedProjectID)
loadProjectUpdates(selectedProjectID)
}else{
renderProjectDetail(null)
renderProjectTasks([])
renderProjectUpdates([])
}
})
.withFailureHandler(err=>{
if(isSessionExpiredError(err)){
onServerFailure(err)
return
}
setProjectError((err && err.message) || "Unable to load projects.")
renderProjects()
})
.getProjectBoard(token)
}

function renderProjects(){
const list = document.getElementById("project-list")
const createPanel = document.getElementById("project-create-panel")
if(projectPermissions.canCreateProject){
createPanel.classList.remove("hidden")
}else{
createPanel.classList.add("hidden")
}
if(!projectsCache.length){
list.innerHTML = "<div class='text-sm text-slate-500'>No projects found.</div>"
renderProjectDetail(null)
return
}
list.innerHTML = projectsCache.map(project=>`
<button onclick="selectProject('${escapeHtml(project.ProjectID)}')" class="w-full text-left border rounded-2xl p-3 transition hover:shadow-sm ${project.ProjectID===selectedProjectID ? 'border-blue-300 bg-blue-50/70 ring-1 ring-blue-200' : 'border-slate-200 bg-white'}">
<div class="flex items-start gap-3">
<div class="h-16 w-16 shrink-0 rounded-xl border border-slate-200 bg-slate-100 overflow-hidden">
${project.ImageURL ? `<img src="${escapeHtml(project.ImageURL)}" alt="Project thumbnail" class="h-full w-full object-cover"/>` : `<div class="h-full w-full flex items-center justify-center text-[10px] text-slate-500 px-1 text-center">No Image</div>`}
</div>
<div class="min-w-0 flex-1">
<div class="flex items-center justify-between gap-2">
<div class="text-xs text-slate-500">${escapeHtml(project.ProjectID || "")}</div>
<div class="text-[11px] px-2 py-1 rounded-full bg-slate-100 text-slate-600">${escapeHtml(project.Status || "Planning")}</div>
</div>
<div class="font-semibold text-slate-800 mt-1 truncate">${escapeHtml(project.Title || "Untitled project")}</div>
<div class="text-xs text-slate-600 mt-1 line-clamp-2">${escapeHtml(project.Description || "No description provided.")}</div>
</div>
</div>
<div class="mt-3">
<div class="flex justify-between text-xs text-slate-500 mb-1"><span>Progress</span><span>${formatPercent(project.ProgressPercent || 0)}</span></div>
<div class="w-full bg-slate-100 rounded-full h-2 overflow-hidden"><div class="h-full bg-blue-600" style="width:${Math.max(0, Math.min(100, Number(project.ProgressPercent || 0)))}%"></div></div>
</div>
<div class="mt-3 rounded-lg border border-slate-200 bg-slate-50 px-2 py-2">
<div class="text-[11px] font-semibold text-slate-500 uppercase mb-1">Task Assignments</div>
<div class="text-xs text-slate-600">${Number(project.AssignedTaskCount || 0)} assigned • ${Number(project.TaskCount || 0)} total tasks</div>
</div>
</button>
`).join("")
const selected = projectsCache.find(p=>p.ProjectID===selectedProjectID)
renderProjectDetail(selected || null)
}

</div>`).join("")}</div>` : `<div class="text-sm text-slate-500">No assigned tasks yet.</div>`}

function renderTimelineCalendar(calendar){
const el=document.getElementById("timeline-calendar"); if(!el) return
const now=new Date();
const y=now.getFullYear();
const m=now.getMonth();
const first=new Date(y,m,1);
const startDay=first.getDay();
const daysInMonth=new Date(y,m+1,0).getDate();
const monthLabel=first.toLocaleString(undefined,{month:'long',year:'numeric'});
const dayNames=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const eventMap={};
Object.keys(calendar||{}).forEach(key=>{
const d=new Date(key);
if(!Number.isNaN(d.getTime()) && d.getFullYear()===y && d.getMonth()===m){
eventMap[d.getDate()]=(calendar[key]||[]);
}
});
let cells='';
for(let i=0;i<startDay;i++){cells+=`<div class="calendar-cell faded"></div>`}
for(let day=1;day<=daysInMonth;day++){
const today=(now.getDate()===day);
const events=eventMap[day]||[];
cells+=`<div class="calendar-cell ${today?'today':''}"><div class="text-xs font-semibold mb-1">${day}</div><div class="space-y-1">${events.slice(0,2).map(e=>`<div class='text-[11px] leading-tight px-1.5 py-1 rounded bg-blue-50 text-blue-700'>${escapeHtml(e.Title||'Event')}</div>`).join('')}${events.length>2?`<div class='text-[11px] text-slate-500'>+${events.length-2} more</div>`:''}</div></div>`
}
if(!Object.keys(eventMap).length){
cells+=`<div class="calendar-cell faded col-span-7"><div class="text-sm text-slate-500">No events mapped this month. Timeline and upcoming sections remain available below.</div></div>`
}
el.innerHTML=`<div class="calendar-shell"><div class="px-4 py-3 bg-slate-50 border-b border-slate-200"><div class="font-semibold text-slate-700">${escapeHtml(monthLabel)}</div></div><div class="calendar-grid bg-slate-50">${dayNames.map(d=>`<div class='px-2 py-2 text-xs font-bold uppercase text-slate-500 text-center'>${d}</div>`).join('')}</div><div class="calendar-grid">${cells}</div></div>`
}

const withGen=members.map(m=>Object.assign({},m,{_gen:Number(m.GenerationTier||99)})).sort((a,b)=>a._gen-b._gen)
const root=withGen.find(m=>String(m.RelationshipToPatriarch||'').toLowerCase().includes('patriarch'))||withGen.find(m=>!String(m.FatherID||'').trim()&&!String(m.MotherID||'').trim())||withGen[0]
const rootCard=root?`<div class="family-root-card rounded-xl p-4 mb-4"><div class="text-xs uppercase text-blue-700 font-bold tracking-wide">Patriarch / Root</div><div class="family-member-head mt-2"><img src="${escapeHtml(root.PhotoFileURL||'https://via.placeholder.com/96?text=Photo')}" class="family-avatar" alt="root photo" onerror="this.src='https://via.placeholder.com/96?text=Photo'" /><div><div class="font-semibold text-slate-800">${escapeHtml(root.FullName||root.PersonID)}</div><div class="text-xs text-slate-600 mt-1">${escapeHtml(root.PersonID||'')} • Gen ${escapeHtml(root.GenerationTier||'-')}</div><div class="text-xs text-slate-500 mt-1">${escapeHtml(root.RelationshipToPatriarch||'Patriarch')}</div></div></div></div>`:''
const byGen={}
withGen.forEach(m=>{const g=String(m.GenerationTier||'Unknown'); if(!byGen[g]) byGen[g]=[]; byGen[g].push(m)})
const generationBlocks=Object.keys(byGen).sort((a,b)=>Number(a)-Number(b)).map(g=>`<div class="family-generation-block mb-4"><div class="text-xs uppercase font-bold text-slate-500 mb-2 text-center">Generation ${escapeHtml(g)}</div><div class="family-tree-grid">${byGen[g].map(m=>renderFamilyMemberCard(m, memberMap, childMap)).join('')}</div></div>`).join('')
el.innerHTML=`<div class="family-tree-shell">${rootCard}${generationBlocks}</div>`
})
.withFailureHandler(err=>{
if(isSessionExpiredError(err)){
onServerFailure(err)
return
}
familyLoaded = false
setFamilyError((err&&err.message)||'Unable to load family data.')
})
.getFamilyData(token)
}

function renderFamilyMemberCard(member, memberMap, childMap){
const father=String(member.FatherID||'').trim()
const mother=String(member.MotherID||'').trim()
const children=(childMap[String(member.PersonID||'').trim()]||[])
const parentLinks=[father,mother].filter(Boolean).map(pid=>formatRelativeChip('Ancestor', pid, memberMap[pid]))
const childLinks=children.map(pid=>formatRelativeChip('Descendant', pid, memberMap[pid]))
const avatarSource=escapeHtml(member.PhotoFileURL||'https://via.placeholder.com/96?text=Photo')
const avatar=`<img src="${avatarSource}" class="family-avatar" alt="member photo" onerror="this.onerror=null;this.outerHTML='<div class=&quot;family-avatar family-avatar-placeholder&quot;>No Photo</div>'" />`
const ancestorDisplay=parentLinks.length?parentLinks.join(''):'<span class="family-placeholder-chip">No ancestors linked</span><span class="family-placeholder-chip">Lineage pending</span>'
const descendantDisplay=childLinks.length?childLinks.join(''):'<span class="family-placeholder-chip">No descendants linked</span><span class="family-placeholder-chip">Future branch</span>'
return `<div class="family-member-card"><div class="family-member-head">${avatar}<div class="min-w-0"><div class="font-semibold truncate">${escapeHtml(member.FullName||member.PersonID)}</div><div class="text-xs text-slate-500">${escapeHtml(member.PersonID||'')} • ${escapeHtml(member.RelationshipToPatriarch||'Member')}</div><div class="text-xs text-slate-500 mt-1">Spouse: ${escapeHtml(member.SpouseFullNameOptional||'-')}</div></div></div><div class="family-branch-row text-xs"><div class="family-branch-box"><div class="family-branch-title">Ancestors</div><div>${ancestorDisplay}</div></div><div class="family-branch-box"><div class="family-branch-title">Descendants</div><div>${descendantDisplay}</div></div></div></div>`
}

function formatRelativeChip(label,pid,member){
const name=member?(member.FullName||member.PersonID):pid

<div class="font-semibold text-slate-800">${escapeHtml(item.title || "Untitled")}</div>
<div class="text-xs text-slate-600 mt-1">${escapeHtml(item.eventType || "")}${item.recurrence ? ' • ' + escapeHtml(item.recurrence) : ''}</div>
${item.description ? `<div class="text-sm text-slate-700 mt-2 whitespace-pre-wrap">${escapeHtml(item.description)}</div>` : ''}
</div>
`).join("")
}

function renderHistoryList(items){
const container = document.getElementById("timeline-history")
if(!items || !items.length){
container.innerHTML = "<div class='text-sm text-slate-500'>No historical records found.</div>"
return
}
container.innerHTML = items.map(item=>`
<div class="border border-slate-200 rounded-xl p-3">
<div class="text-xs text-slate-500">${escapeHtml(formatDate(item.EventDate))}</div>
<div class="font-semibold text-slate-800">${escapeHtml(item.Title || "Untitled")}</div>
<div class="text-xs text-slate-600 mt-1">${escapeHtml(item.EventType || "")}</div>
${item.Description ? `<div class="text-sm text-slate-700 mt-2 whitespace-pre-wrap">${escapeHtml(item.Description)}</div>` : ''}
</div>
`).join("")
}

function renderUpcomingList(items){
const container = document.getElementById("timeline-upcoming")
if(!items || !items.length){
container.innerHTML = "<div class='text-sm text-slate-500'>No upcoming events.</div>"
return
}
container.innerHTML = items.map(item=>`
<div class="border border-slate-200 rounded-xl p-3">
<div class="text-xs text-slate-500">Next: ${escapeHtml(formatDate(item.NextOccurrence))}</div>
<div class="font-semibold text-slate-800">${escapeHtml(item.Title || "Untitled")}</div>
<div class="text-xs text-slate-600 mt-1">${escapeHtml(item.Recurrence || "One-time")}</div>
<div class="text-xs text-slate-400 mt-1">Original date: ${escapeHtml(formatDate(item.EventDate))}</div>
</div>
`).join("")
}

function loadTimelineData(){
setTimelineError("")
if(!timelineLoaded){
document.getElementById("timeline-list").innerHTML = "<div class='text-sm text-slate-500'>Loading timeline...</div>"
document.getElementById("timeline-history").innerHTML = "<div class='text-sm text-slate-500'>Loading history...</div>"
document.getElementById("timeline-upcoming").innerHTML = "<div class='text-sm text-slate-500'>Loading upcoming events...</div>"
}
google.script.run
.withSuccessHandler(data=>{
timelineLoaded = true
renderTimelineList((data && data.timeline) || [])
renderHistoryList((data && data.historical) || [])
renderUpcomingList((data && data.upcoming) || [])
renderTimelineCalendar((data && data.calendar) || {})
})
.withFailureHandler(err=>{
if(isSessionExpiredError(err)){
onServerFailure(err)
return
}
setTimelineError((err && err.message) || "Unable to load timeline data.")
if(!timelineLoaded){
renderTimelineList([])
renderHistoryList([])
renderUpcomingList([])
}
})
.getTimelineCalendarData(token)
}

function loadSOSAlerts(){
setSOSError("")
setSOSStatus("")
const history = document.getElementById("sos-alert-history")
if(history && !history.innerHTML.trim()){
history.innerHTML = "<div class='text-sm text-slate-500'>Loading SOS alerts...</div>"
}
google.script.run
.withSuccessHandler(res=>{
const data = res || {}
sosAlerts = Array.isArray(data.alerts) ? data.alerts : []
if(!selectedSOSID || !sosAlerts.some(a=>a.SOSID===selectedSOSID)){
selectedSOSID = sosAlerts.length ? sosAlerts[0].SOSID : ""
}
renderSOSAlerts()
const selected = sosAlerts.find(a=>a.SOSID===selectedSOSID)
renderSOSMap(selected)
if(selectedSOSID){
loadSOSMedia(selectedSOSID)
renderSOSMap(selected)
}else{
renderSOSMedia([])
renderSOSWhatsAppAction("")
}
})
.withFailureHandler(err=>{
if(isSessionExpiredError(err)){
onServerFailure(err)
return
}
setSOSError((err && err.message) || "Unable to load SOS alerts.")
renderSOSAlerts()
renderSOSMedia([])
})
.getSOSAlerts(token)
}

function renderSOSAlerts(){
const history = document.getElementById("sos-alert-history")
if(!history) return
if(!sosAlerts.length){
history.innerHTML = "<div class='text-sm text-slate-500'>No SOS alerts available.</div>"
return
}
history.innerHTML = sosAlerts.map(alert=>`
<button onclick="selectSOSAlert('${escapeHtml(alert.SOSID)}')" class="w-full text-left border rounded-xl p-3 ${alert.SOSID===selectedSOSID ? 'border-red-300 bg-red-50' : 'border-slate-200 bg-white'}">
<div class="flex items-center justify-between gap-2">
<div>
<div class="text-xs text-slate-500">${escapeHtml(alert.SOSID || '')}</div>
<div class="font-semibold text-slate-800">${escapeHtml(alert.ReporterName || alert.ReporterEmail || 'Unknown reporter')}</div>
<div class="text-xs text-slate-600 mt-1">Lat: ${Number(alert.Lat||0).toFixed(5)} • Lng: ${Number(alert.Lng||0).toFixed(5)}</div>
</div>
<div class="text-xs px-2 py-1 rounded-full bg-slate-100 text-slate-700">${escapeHtml(alert.Status || 'Open')}</div>
</div>
</button>
`).join("")
}

function selectSOSAlert(sosID){
selectedSOSID = sosID
renderSOSAlerts()
const selected = sosAlerts.find(a=>a.SOSID===selectedSOSID)
renderSOSWhatsAppAction((selected && selected.WhatsAppLink) || "")
loadSOSMedia(selectedSOSID)
renderSOSMap(selected)
}

function renderSOSWhatsAppAction(link){
const container = document.getElementById("sos-whatsapp-action")
if(!container) return
if(!link){
container.innerHTML = "<div class='text-xs text-slate-500'>WhatsApp emergency action is not configured.</div>"
return
}
container.innerHTML = `<button onclick="openSOSWhatsApp('${escapeHtml(link)}')" class="w-full bg-emerald-600 text-white p-3 rounded-xl font-semibold">Open WhatsApp Emergency Action</button>`
}

function openSOSWhatsApp(link){
const href = String(link || "").trim()
if(!href){
setSOSError("WhatsApp link is not configured for this alert.")
return
}
window.open(href, "_blank")
}

function loadSOSMedia(sosID){
if(!sosID){
renderSOSMedia([])
return
}
const selected = sosAlerts.find(a=>a.SOSID===sosID)
document.getElementById("sos-media-title").innerText = `Alert: ${sosID}`
renderSOSWhatsAppAction((selected && selected.WhatsAppLink) || "")
google.script.run
.withSuccessHandler(res=>{
const media = (res && Array.isArray(res.media)) ? res.media : []
renderSOSMedia(media)
})
.withFailureHandler(err=>{
if(isSessionExpiredError(err)){
onServerFailure(err)
return
}
setSOSError((err && err.message) || "Unable to load SOS media.")
renderSOSMedia([])
})
.getSOSMedia(token, sosID)
}

function renderSOSMedia(items){
const list = document.getElementById("sos-media-list")
if(!list) return
if(!items || !items.length){
list.innerHTML = "<div class='text-sm text-slate-500'>No media references found for this alert.</div>"
return
}
list.innerHTML = items.map(item=>`
<div class="border border-slate-200 rounded-xl p-3 bg-slate-50">
<div class="text-xs uppercase text-slate-500">${escapeHtml(item.MediaType || 'media')}</div>
<a href="${escapeHtml(item.FileURL || '#')}" target="_blank" class="text-sm text-blue-700 break-all underline">${escapeHtml(item.FileURL || '')}</a>
</div>
`).join("")
}

function saveSOSMediaRef(){
if(!selectedSOSID){
setSOSError("Select an SOS alert before saving media.")
return
}
const btn = document.getElementById("btn-save-sos-media")
const mediaType = document.getElementById("sos-media-type").value
const fileURL = String(document.getElementById("sos-media-url").value || "").trim()
if(!fileURL){
setSOSError("A media URL is required.")
return
}
btn.disabled = true
btn.classList.add("opacity-60")
setSOSError("")
setSOSStatus("")
google.script.run
.withSuccessHandler(()=>{
btn.disabled = false
btn.classList.remove("opacity-60")
document.getElementById("sos-media-url").value = ""
setSOSStatus("Media reference saved.")
loadSOSMedia(selectedSOSID)
renderSOSMap(selected)
})
.withFailureHandler(err=>{
btn.disabled = false
btn.classList.remove("opacity-60")
if(isSessionExpiredError(err)){
onServerFailure(err)
return
}
setSOSError((err && err.message) || "Unable to save SOS media.")
})
.saveSOSMedia(token, selectedSOSID, mediaType, fileURL)
}

function triggerSOS(){
const btn = document.getElementById("btn-trigger-sos")
if(!navigator.geolocation){
setSOSError("GPS is not available on this device.")
return
}
btn.disabled = true
btn.classList.add("opacity-60")
setSOSError("")
setSOSStatus("Capturing location...")
navigator.geolocation.getCurrentPosition(pos=>{
setSOSStatus("Submitting SOS alert...")
google.script.run
.withSuccessHandler(()=>{
btn.disabled = false
btn.classList.remove("opacity-60")
setSOSStatus("SOS alert sent successfully.")
loadSOSAlerts()
})
.withFailureHandler(err=>{
btn.disabled = false
btn.classList.remove("opacity-60")
if(isSessionExpiredError(err)){
onServerFailure(err)
return
}
setSOSError((err && err.message) || "Unable to trigger SOS alert.")
setSOSStatus("")
})
.triggerSOS(token,pos.coords.latitude,pos.coords.longitude)
}, err=>{
btn.disabled = false
btn.classList.remove("opacity-60")
setSOSStatus("")
setSOSError("Unable to get location: " + ((err && err.message) || "Unknown error"))
}, {timeout:10000, enableHighAccuracy:true})
}

</script>
