/* ── TIMELINE ── */
window._renderCalendarEmbed=function(calendarId){
  var wrap=document.getElementById("gcal-wrap");
  var setup=document.getElementById("gcal-setup");
  var iframe=document.getElementById("gcal-iframe");
  var openLink=document.getElementById("gcal-open-link");
  if(!wrap||!iframe) return;
  if(!calendarId){
    if(wrap) wrap.style.display="none";
    if(setup) setup.style.display="block";
    return;
  }
  var encId=encodeURIComponent(calendarId);
  var tz=(Intl&&Intl.DateTimeFormat&&Intl.DateTimeFormat().resolvedOptions().timeZone)||"UTC";
  var src="https://calendar.google.com/calendar/embed?src="+encId
    +"&ctz="+encodeURIComponent(tz)
    +"&showTitle=0&showNav=1&showDate=1&showPrint=0&showTabs=0&showCalendars=0&mode=MONTH";
  iframe.src=src;
  if(openLink) openLink.href="https://calendar.google.com/calendar/embed?src="+encId;
  if(wrap) wrap.style.display="block";
  if(setup) setup.style.display="none";
  /* Apply current theme filter after iframe loads */
  setTimeout(function(){
    var mode="auto";
    try{ mode=localStorage.getItem("togba-theme")||"auto"; }catch(e){}
    if(typeof window._applyCalendarFilter==="function")
      window._applyCalendarFilter(mode);
  }, 800);
};

window.renderTimelineCalendar = function(calendar){
  var el=document.getElementById("timeline-calendar"); if(!el) return;
  var months=calendar&&calendar.months?calendar.months:[];
  if(!months.length){ el.innerHTML="<div style='color:var(--muted);font-size:.875rem'>No calendar data.</div>"; return; }
  el.innerHTML=months.map(function(m){
    return "<div style='margin-bottom:.75rem'>"+
      "<div style='font-size:.68rem;font-weight:700;text-transform:uppercase;color:var(--muted);margin-bottom:.3rem'>"+escapeHtml(m.label||"")+"</div>"+
      "<div style='display:flex;flex-wrap:wrap;gap:4px'>"+
      (Array.isArray(m.days)?m.days.map(function(d){
        return "<div title='"+escapeHtml(d.title||"")+"' style='width:26px;height:26px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:600;background:"+(d.hasEvent?"var(--accent-soft)":"var(--panel-alt)")+";color:"+(d.hasEvent?"var(--accent)":"var(--muted)")+"'>"+escapeHtml(String(d.day||""))+"</div>";
      }).join(""):"")+
      "</div></div>";
  }).join("");
};

<script>
/* ================================================================
   JS_CORE — State, Utilities, Auth, Navigation, All Renderers
   Togba Legacy ERP — iteration 60 file split
   ================================================================ */

/* ── STATE VARIABLES ── */
var token               = "";
var currentUser         = { name:"", role:"", email:"" };
var selectedChannelID   = "";
var userChannels        = [];
var channelDirectory    = [];
var messagingRecipients = [];
var selectedProjectID   = "";
var projectsCache       = [];
var projectPermissions  = { canCreateProject:false, canEditTask:false };
var projectsLoaded      = false;
var financeLoaded       = false;
var voteDataLoaded      = false;
var votePermissions     = { canCreateVote:false, canCastBallot:false };
var timelineLoaded      = false;
var adminLoaded         = false;
var sosLoaded           = false;
var familyLoaded        = false;
var currentPage         = "home";
var financeChartInstance     = null;
var allocationChartInstance  = null;
var founderLockChartInstance = null;
var voteChartInstance        = null;

/* ── UTILITIES ── */
function escapeHtml(str){
  return String(str||"")
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}
function formatDate(val){
  if(!val) return "—";
  try{ var d=new Date(val); if(isNaN(d.getTime())) return String(val);
    return d.toLocaleDateString("en-US",{year:"numeric",month:"short",day:"numeric"}); }
  catch(e){ return String(val); }
}
function formatCurrency(val){
  var n=Number(val)||0;
  return "$"+n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
}
function formatPercent(val){ return (Number(val)||0).toFixed(1)+"%"; }
function isSessionExpiredError(err){
  var m=(err&&err.message)?err.message.toLowerCase():"";
  return m.indexOf("session")!==-1||m.indexOf("expired")!==-1||
         m.indexOf("invalid token")!==-1||m.indexOf("unauthorized")!==-1;
}
function onServerFailure(err){
  if(isSessionExpiredError(err)){ resetToLogin("Session expired. Please log in again."); return; }
  console.error(err);
}
function _setText(id,v){ var e=document.getElementById(id); if(e) e.innerText=v; }
function _setHtml(id,v){ var e=document.getElementById(id); if(e) e.innerHTML=v; }
function _isDark(){
  return window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)").matches;
}

/* ── ERROR / STATUS HELPERS ── */
function _msg(id,m){
  var e=document.getElementById(id); if(!e) return;
  if(!m){ e.classList.add("hidden"); e.innerText=""; return; }
  e.classList.remove("hidden"); e.innerText=m;
}
function setHomeError(m)    { _msg("home-error",m); }
function setHomeStatus(m){
  _msg("home-status",m);
  if(m){ var el=document.getElementById("home-status"); if(el){
    clearTimeout(el._hideTimer);
    el._hideTimer=setTimeout(function(){ _msg("home-status",""); },3500);
  }}
}
function setFinanceError(m) { _msg("finance-error",m); }
function setProjectError(m) { _msg("project-error",m); }
function setProjectStatus(m){ _msg("project-status",m); }
function setMessageError(m) { _msg("message-error",m); }
function setVoteError(m)    { _msg("vote-error",m); }
function setTimelineError(m){ _msg("timeline-error",m); }
function setAdminError(m)   { _msg("admin-error",m); }
function setAdminStatus(m)  { _msg("admin-status",m); }
function setSosError(m)     { _msg("sos-error",m); }
function setSosStatus(m)    { _msg("sos-status",m); }
function setFamilyError(m)  { _msg("family-error",m); }
function showLoginMessage(msg){
  var e=document.getElementById("login-state-message"); if(!e) return;
  if(!msg){ e.classList.add("hidden"); return; }
  e.classList.remove("hidden"); e.innerText=msg;
}

/* ── AUTH ── */
window.initializeAuthView = function(){
  var vl=document.getElementById("view-login"); var va=document.getElementById("view-app");
  if(vl) vl.classList.remove("hidden"); if(va) va.classList.add("hidden");
  var s1=document.getElementById("step-1"); var s2=document.getElementById("step-2");
  if(s1) s1.classList.remove("hidden"); if(s2) s2.classList.add("hidden");
  try{
    google.script.run
      .withSuccessHandler(function(cfg){
        if(cfg&&cfg.developerBypassEnabled){
          var b=document.getElementById("dev-bypass-banner");
          if(b){ b.classList.remove("hidden"); b.innerText="⚡ Developer bypass mode active.";
            b.style.cssText="border-color:#f59e0b;background:#fffbeb;color:#78350f;"; }
        }
      })
      .withFailureHandler(function(){})
      .getAuthModeConfig();
  }catch(e){}
};

window.handleOTP = function(){
  var email=((document.getElementById("email")||{}).value||"").trim();
  if(!email){ showLoginMessage("Please enter your email."); return; }
  var btn=document.getElementById("btn-get-code");
  if(btn){ btn.disabled=true; btn.innerText="Sending…"; }
  showLoginMessage("Sending one-time code…");
  google.script.run
    .withSuccessHandler(function(res){
      if(btn){ btn.disabled=false; btn.innerText="Send One-Time Code"; }
      if(res&&res.success){
        var s1=document.getElementById("step-1"); if(s1) s1.classList.add("hidden");
        var s2=document.getElementById("step-2"); if(s2) s2.classList.remove("hidden");
        showLoginMessage("Code sent to "+escapeHtml(email)+". Check your inbox.");
      } else { showLoginMessage((res&&res.message)||"Failed to send code. Try again."); }
    })
    .withFailureHandler(function(err){
      if(btn){ btn.disabled=false; btn.innerText="Send One-Time Code"; }
      showLoginMessage((err&&err.message)||"Request failed.");
    })
    .loginStepOne(email);
};

window.handleVerify = function(){
  var email=((document.getElementById("email")||{}).value||"").trim();
  var otp=((document.getElementById("otp")||{}).value||"").trim();
  if(!otp){ showLoginMessage("Please enter the code."); return; }
  var btn=document.getElementById("btn-verify");
  if(btn){ btn.disabled=true; btn.innerText="Verifying…"; }
  showLoginMessage("Verifying…");
  google.script.run
    .withSuccessHandler(function(res){
      if(btn){ btn.disabled=false; btn.innerText="Verify"; }
      var t=res&&(res.token||res.sessionToken||res.authToken);
      if(t){
        token=t; window.token=t;
        currentUser={ name:res.name||res.fullName||"Member", role:res.role||"", email:res.email||email };
        var vl=document.getElementById("view-login"); if(vl) vl.classList.add("hidden");
        initApp();
      } else { showLoginMessage((res&&res.message)||"Verification failed. Check your code."); }
    })
    .withFailureHandler(function(err){
      if(btn){ btn.disabled=false; btn.innerText="Verify"; }
      showLoginMessage((err&&err.message)||"Verification failed.");
    })
    .verifyStepTwo(email, otp);
};

window.resetToStepOne = function(){
  var s1=document.getElementById("step-1"); if(s1) s1.classList.remove("hidden");
  var s2=document.getElementById("step-2"); if(s2) s2.classList.add("hidden");
  var oi=document.getElementById("otp"); if(oi) oi.value="";
  showLoginMessage("");
};

window.resetToLogin = function(msg){
  token=""; window.token="";
  currentUser={name:"",role:"",email:""};
  window.homeLoaded=false;
  financeLoaded=false; projectsLoaded=false; voteDataLoaded=false;
  timelineLoaded=false; adminLoaded=false; sosLoaded=false; familyLoaded=false;
  var vl=document.getElementById("view-login"); if(vl) vl.classList.remove("hidden");
  var va=document.getElementById("view-app");   if(va) va.classList.add("hidden");
  var s1=document.getElementById("step-1"); if(s1) s1.classList.remove("hidden");
  var s2=document.getElementById("step-2"); if(s2) s2.classList.add("hidden");
  var oi=document.getElementById("otp");   if(oi) oi.value="";
  var ei=document.getElementById("email"); if(ei) ei.value="";
  if(msg) showLoginMessage(msg);
};

window.initApp = function(){
  var va=document.getElementById("view-app"); if(va) va.classList.remove("hidden");
  _setText("welcome-name", currentUser.name||"Welcome");
  var isAdmin=currentUser.role==="Admin";
  var bna=document.getElementById("btn-nav-admin");
  if(bna){ bna.style.display=isAdmin?"":"none"; }
  var sna=document.getElementById("sidebar-nav-admin");
  if(sna) sna.classList.toggle("hidden",!isAdmin);
  showPage("home");
  loadHomeEssentials(false);
};

/* ── NAVIGATION ── */
window.showPage = function(pageId){
  document.querySelectorAll(".page").forEach(function(p){ p.classList.remove("active"); });
  var tgt=document.getElementById("page-"+pageId);
  if(tgt) tgt.classList.add("active");
  currentPage=pageId;
  _updateBottomNav(pageId);
  if(typeof window._updateSidebarNav==="function") window._updateSidebarNav(pageId);
  window.scrollTo(0,0);
  if(pageId==="finance"  && !financeLoaded)                           loadFinanceDashboard();
  if(pageId==="projects" && !projectsLoaded)                          loadProjects();
  if(pageId==="messages" && (!userChannels.length||!selectedChannelID)) loadUserChannels();
  else if(pageId==="messages" && selectedChannelID)                   refreshMessages();
  if(pageId==="voting"   && !voteDataLoaded)                          loadVotes();
  if(pageId==="timeline" && !timelineLoaded)                          loadTimelineData();
  if(pageId==="timeline"){
    if(!window._gcalId){
      try{ var _sc=localStorage.getItem("_tgbgcal"); if(_sc) window._gcalId=_sc; }catch(e){}
    }
    if(window._gcalId && typeof window._renderCalendarEmbed==="function")
      window._renderCalendarEmbed(window._gcalId);
  }
  if(pageId==="sos"      && !sosLoaded)                               loadSOSAlerts();
  if(pageId==="family"   && !familyLoaded)                            loadFamilyData();
  if(pageId==="admin"    && !adminLoaded)                             loadAdmin();
  if(pageId==="documents") { /* no load needed — static UI */ }
};

function _updateBottomNav(pageId){
  var nav=document.getElementById("bottom-nav"); if(!nav) return;
  nav.querySelectorAll("button").forEach(function(btn){
    var oc=btn.getAttribute("onclick")||"";
    btn.classList.toggle("active", oc.indexOf("'"+pageId+"'")!==-1);
  });
}

/* ── HOME RENDERERS ── */
window.renderHomeFinanceSummary = function(data){
  var el=document.getElementById("home-finance-snapshot"); if(!el) return;
  var finance=data||{};
  var totals=finance.totals||{};
  var founderLocks=finance.founderLocks||{};
  var projection=finance.projection||{};
  var contrib=Number(totals.totalContributions!=null?totals.totalContributions:finance.totalContributions||0);
  var locked=Number(founderLocks.totalLocked!=null?founderLocks.totalLocked:finance.totalLocked||0);
  var projected=Number(projection.totalProjected!=null?projection.totalProjected:finance.totalProjected||0);
  function _currencyOrDash(v){ return v>0?escapeHtml(formatCurrency(v)):"—"; }
  el.innerHTML=_currencyOrDash(contrib)+" total contributions &middot; "+
    _currencyOrDash(locked)+" locked &middot; "+_currencyOrDash(projected)+" projected";
  _renderHomeFinanceChart(Object.assign({}, finance, { totalContributions:contrib, totalLocked:locked }));
};

window.renderHomeProjectSnapshot = function(data){
  var el=document.getElementById("home-project-snapshot"); if(!el) return;
  var projects=data||{};
  var summary=projects.summary||projects;
  var active=Number(summary.activeProjects||0);
  var completed=Number(summary.completedProjects||0);
  var tasks=Number(summary.totalTasks||0);
  function _countOrDash(v){ return v>0?String(v):"—"; }
  el.innerHTML=_countOrDash(active)+" active &middot; "+
    _countOrDash(completed)+" completed &middot; "+_countOrDash(tasks)+" tasks";
};

window.renderHomeVoteSnapshot = function(data){
  var el=document.getElementById("home-vote-snapshot"); if(!el) return;
  var voting=data||{};
  var votes=Array.isArray(voting.votes)?voting.votes:[];
  var open=votes.filter(function(v){ return String(v&&v.Status||"").toLowerCase()==="open"; }).length;
  var totalCast=votes.length;
  function _countOrDash(v){ return v>0?String(v):"—"; }
  el.innerHTML=_countOrDash(open)+" open proposals &middot; "+_countOrDash(totalCast)+" total votes cast";

window.renderHomeTimelineSnapshot = function(data){
  var timeline=data||{};
  var summary=timeline.summary||timeline;
  var upcomingNext30=Number(summary.upcomingNext30Days||0);
  var nextDate=summary.nextUpcomingDate?formatDate(summary.nextUpcomingDate):"";
  var snap=document.getElementById("home-timeline-snapshot");
  if(snap) snap.innerHTML=(upcomingNext30>0?String(upcomingNext30):"—")+
    " events in next 30 days &middot; Next: "+(nextDate?escapeHtml(nextDate):"—");

  var items=Array.isArray(timeline.recent)?timeline.recent:[];

  el.innerHTML=items.slice(0,5).map(function(it){
    return "<div class='ptv-shell p-3 mb-2'>"+
      "<div style='font-size:.7rem;color:var(--muted)'>"+escapeHtml(formatDate(it.date||it.EventDate))+"</div>"+
      "<div style='font-weight:600;font-size:.875rem;color:var(--ink)'>"+escapeHtml(it.title||it.Title||"Event")+"</div></div>";
  }).join("");
};

function _renderHomeFinanceChart(data){
  var canvas=document.getElementById("financeChart"); if(!canvas) return;
  var alloc=Array.isArray(data.allocation)?data.allocation:[];
  var empty=document.getElementById("home-chart-empty");
  var isDark=_isDark();
  var chartColors=["#2563eb","#4edea3","#f59e0b","#7aa2ff","#94a3b8","#475569"];
  if(financeChartInstance){ financeChartInstance.destroy(); financeChartInstance=null; }
  if(!alloc.length){
    var contrib=Number(data.totalContributions||0), locked=Number(data.totalLocked||0);
    if(!contrib&&!locked){ if(empty) empty.classList.remove("hidden"); return; }
    if(empty) empty.classList.add("hidden");
    financeChartInstance=new Chart(canvas.getContext("2d"),{
      type:"doughnut",
      data:{ labels:["Contributions","Locked Capital"],
        datasets:[{ data:[contrib,locked], backgroundColor:["#2563eb","#4edea3"], borderWidth:0 }] },
      options:{ responsive:true, maintainAspectRatio:false, cutout:"70%",
        plugins:{ legend:{ position:"bottom", labels:{ color:isDark?"#e2e8f0":"#0f172a", font:{size:11} } } } }
    }); return;
  }
  if(empty) empty.classList.add("hidden");
  financeChartInstance=new Chart(canvas.getContext("2d"),{
    type:"doughnut",
    data:{ labels:alloc.map(function(a){ return a.label||a.type||"Other"; }),
      datasets:[{ data:alloc.map(function(a){ return Number(a.amount||a.value||0); }),
        backgroundColor:chartColors, borderWidth:0 }] },
    options:{ responsive:true, maintainAspectRatio:false, cutout:"70%",
      plugins:{ legend:{ position:"bottom", labels:{ color:isDark?"#e2e8f0":"#0f172a", font:{size:11} } } } }
  });
}

    type:"doughnut",

function _renderAllocationBreakdown(alloc){
  var el=document.getElementById("finance-allocation-breakdown"); if(!el) return;

  el.innerHTML=alloc.map(function(a){
    return "<div class='ptv-metric text-left'>"+
      "<div style='font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)'>"+escapeHtml(a.label||a.type||"")+"</div>"+
      "<div style='font-weight:700;color:var(--ink)'>"+escapeHtml(formatPercent(a.percent||0))+"</div>"+
      "<div style='font-size:.75rem;color:var(--muted)'>"+escapeHtml(formatCurrency(a.amount||0))+"</div></div>";

function _renderCategorySummary(cats){

  if(!cats.length){ el.innerHTML="<div style='color:var(--muted);font-size:.875rem'>No category data.</div>"; return; }

    return "<div class='module-stat'><span>"+escapeHtml(c.type||c.label||"Other")+"</span>"+
      "<strong>"+escapeHtml(formatCurrency(c.total||c.amount||0))+"</strong></div>";
  }).join("");
}

function _renderFounderLockChart(locks){
  var canvas=document.getElementById("finance-founder-lock-chart"); if(!canvas) return;
  if(founderLockChartInstance){ founderLockChartInstance.destroy(); founderLockChartInstance=null; }
  var locked=0, released=0;
  locks.forEach(function(l){ var v=Number(l.AmountUSD||0); if(l.Released) released+=v; else locked+=v; });
  var isDark=_isDark();
  founderLockChartInstance=new Chart(canvas.getContext("2d"),{
    type:"doughnut",
    data:{ labels:["Locked","Released"],
      datasets:[{ data:[locked,released], backgroundColor:["#2563eb","#4edea3"], borderWidth:0 }] },
    options:{ responsive:true, maintainAspectRatio:false, cutout:"68%",
      plugins:{ legend:{ position:"bottom", labels:{ color:isDark?"#e2e8f0":"#0f172a", font:{size:10} } } } }
  });
}

window.loadSOSAlerts = function(){

    .withSuccessHandler(function(res){

function _renderSosAlerts(alerts){

  if(!alerts.length){ el.innerHTML="<div style='color:var(--muted);font-size:.875rem'>No alerts recorded.</div>"; return; }

  if(alerts[0]&&(alerts[0].Lat||alerts[0].Lng)) _renderSosMap(alerts[0].Lat, alerts[0].Lng);
  el.innerHTML=alerts.map(function(a){

      "<div><div style='font-size:.7rem;color:var(--muted)'>"+escapeHtml(formatDate(a.Timestamp||a.CreatedAt))+"</div>"+
      "<div style='font-weight:600;color:var(--ink)'>"+escapeHtml(a.ReporterEmail||"Unknown")+"</div>"+
      "<div style='font-size:.72rem;color:var(--muted)'>Lat: "+escapeHtml(String(a.Lat||"—"))+" · Lng: "+escapeHtml(String(a.Lng||"—"))+"</div></div>"+
      "<div class='ptv-pill "+pillCls+"'>"+escapeHtml(a.Status||"Active")+"</div></div>"+

      "<button onclick=\"loadSOSMedia('"+escapeHtml(a.SOSID||a.AlertID||"")+"')\" style='font-size:.72rem;margin-top:.4rem;padding:.2rem .6rem;border-radius:.4rem;background:var(--panel-alt);color:var(--muted);border:1px solid var(--line)'>View Media</button>"+
      "</div>";
  }).join("");

function _renderSosMap(lat, lng){

  }

  el.innerHTML="<iframe src='https://www.openstreetmap.org/export/embed.html?bbox="
    +bbox+"&layer=mapnik&marker="+lat+","+lng

    +" allowfullscreen></iframe>";

window.triggerSOS = function(){
  setSosStatus(""); setSosError("");
  var btn=document.getElementById("btn-trigger-sos");
  if(btn){ btn.disabled=true; btn.innerText="Locating…"; }
  function _doTrigger(lat,lng){
    setSosStatus("Sending SOS alert…");
    google.script.run
      .withSuccessHandler(function(res){
        if(btn){ btn.disabled=false; btn.innerText="Send SOS Alert"; }
        if(res&&res.success){ setSosStatus("SOS alert sent. Help is on the way."); loadSOSAlerts(); }
        else setSosError((res&&res.message)||"SOS failed. Try again.");
      })
      .withFailureHandler(function(err){
        if(btn){ btn.disabled=false; btn.innerText="Send SOS Alert"; }
        setSosError((err&&err.message)||"SOS failed.");
      })
      .triggerSOS(token, lat, lng);
  }
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      function(p){ _doTrigger(p.coords.latitude, p.coords.longitude); },
      function(){  _doTrigger(null, null); }
    );
  } else { _doTrigger(null, null); }
};

/* ── FAMILY TREE — drill-down + full-tree view ────────────────────
   Two modes toggled by buttons at top of the panel:
   1. DRILL-DOWN: patriarch card only on open. Click any card to
      reveal that person's children below. Cards above stay visible.
      Collapse button on each expanded level.
   2. FULL TREE: all members in scrollable generation panels.
   Works without FatherID/MotherID (falls back to generation tier).
   ─────────────────────────────────────────────────────────────── */
window.renderFamilyTree = function(tree){
  var el=document.getElementById("family-tree"); if(!el) return;
  var members=Array.isArray(tree&&tree.members)?tree.members:(Array.isArray(tree)?tree:[]);
  if(!members.length){
    el.innerHTML="<div style='color:var(--muted);font-size:.875rem;padding:1rem'>No family records found.</div>";
    return;
  }

  var byID={};
  members.forEach(function(m){ byID[m.PersonID||""]=m; });

  /* Children map from explicit FatherID/MotherID */
  var childrenOf={};
  members.forEach(function(m){
    [m.FatherID,m.MotherID].forEach(function(pid){
      if(!pid||!byID[pid]) return;
      if(!childrenOf[pid]) childrenOf[pid]=[];
      if(childrenOf[pid].indexOf(m.PersonID)===-1)
        childrenOf[pid].push(m.PersonID);
    });
  });
  var hasLinks=Object.keys(childrenOf).length>0;

  /* Generation grouping */
  var byGen={};
  members.forEach(function(m){
    var g=String(m.GenerationTier||m.generation||"1");
    if(!byGen[g]) byGen[g]=[];
    byGen[g].push(m);
  });
  var genKeys=Object.keys(byGen).sort(function(a,b){
    return (parseInt(a,10)||0)-(parseInt(b,10)||0);
  });

  /* Patriarch detection */
  function _isP(m){
    var r=String(m.RelationshipToPatriarch||m.relationship||"").toLowerCase();
    return r==="patriarch"||r==="matriarch"||r.indexOf("patriarch")!==-1||r.indexOf("founder")!==-1;
  }
  var pList=members.filter(_isP);
  if(!pList.length&&genKeys.length) pList=byGen[genKeys[0]]||[];
  var pIDs={}; pList.forEach(function(p){ pIDs[p.PersonID||""]=true; });

  /* Generation labels + colours */
  var GL={"0":"Founding","0th":"Founding","1":"First Generation","1st":"First Generation",
    "2":"Second Generation","2nd":"Second Generation","3":"Third Generation","3rd":"Third Generation",
    "4":"Fourth Generation","4th":"Fourth Generation","5":"Fifth Generation","5th":"Fifth Generation"};
  function _gl(g){ return GL[g]||("Generation "+g); }
  var GC=[
    {bg:"var(--accent-soft)",bd:"var(--accent)",tx:"var(--accent)"},
    {bg:"rgba(78,222,163,.13)",bd:"#16a34a",tx:"#16a34a"},
    {bg:"rgba(245,158,11,.11)",bd:"#d97706",tx:"#d97706"},
    {bg:"rgba(139,92,246,.11)",bd:"#7c3aed",tx:"#7c3aed"},
    {bg:"rgba(236,72,153,.10)",bd:"#db2777",tx:"#db2777"},
  ];
  var gci={}; genKeys.forEach(function(g,i){ gci[g]=i; });
  function _gc(m){ return GC[(gci[String(m.GenerationTier||m.generation||"1")]||0)%GC.length]; }

  /* Avatar */
  function _av(m,sz,col){
    var ph=m.PhotoURL||m.photoURL||"";
    var ini=(m.FullName||m.fullName||"?").split(" ").map(function(w){return w[0]||"";}).slice(0,2).join("").toUpperCase();
    if(ph) return "<img src='"+ph+"' style='width:"+sz+"px;height:"+sz+"px;border-radius:50%;object-fit:cover;flex-shrink:0' alt=''>";
    return "<div style='width:"+sz+"px;height:"+sz+"px;border-radius:50%;background:"+col.bg+";display:flex;align-items:center;justify-content:center;font-size:"+(sz*.3)+"px;font-weight:700;color:"+col.tx+";flex-shrink:0'>"+ini+"</div>";
  }

  /* Card inner content */
  function _cardInner(m,sz,col,badge){
    var name=escapeHtml(m.FullName||m.fullName||"Unknown");
    var rel=escapeHtml(m.RelationshipToPatriarch||m.relationship||"");
    var country=escapeHtml(m.CountryResidence||m.country||"");
    var spouse=m.SpouseFullNameOptional?escapeHtml(m.SpouseFullNameOptional):"";
    return "<div style='display:flex;align-items:center;gap:.5rem'>"
      +_av(m,sz,col)
      +"<div style='min-width:0;flex:1'>"
      +"<div style='font-weight:700;color:var(--ink);font-size:.8rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis'>"+name+"</div>"
      +(rel?"<div style='font-size:.62rem;color:"+col.tx+";white-space:nowrap;overflow:hidden;text-overflow:ellipsis'>"+rel+"</div>":"")
      +(country?"<div style='font-size:.6rem;color:var(--muted)'>📍 "+country+"</div>":"")
      +(spouse?"<div style='font-size:.62rem;color:var(--muted)'><span style='color:"+col.tx+"'>+</span> "+spouse+"</div>":"")
      +"</div>"
      +(badge||"")
      +"</div>";
  }

  /* Get children */
  function _kids(m){
    if(hasLinks) return (childrenOf[m.PersonID]||[]).map(function(id){return byID[id];}).filter(Boolean);
    var g=String(m.GenerationTier||m.generation||"1");
    var gi=genKeys.indexOf(g);
    if(gi<0||gi>=genKeys.length-1) return [];
    return byGen[genKeys[gi+1]]||[];
  }

  /* ── State ── */
  var _exp={};    /* expanded card IDs */
  var _mode="drill"; /* "drill" | "full" */

  /* ── Main render ── */
  function _render(){
    var h="";

    /* Mode toggle */
    h+="<div style='display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:.5rem'>"
      +"<div style='font-size:.68rem;color:var(--muted)'>Family Registry &mdash; "
        +members.length+" members</div>"
      +"<div style='display:flex;gap:.3rem'>"
      +"<button onclick='window._ftMode(\"drill\")' style='font-size:.7rem;padding:.3rem .75rem;border-radius:.5rem;cursor:pointer;font-weight:600;border:1px solid var(--line);"
        +"background:"+(_mode==="drill"?"var(--accent)":"var(--panel-alt)")+";color:"+(_mode==="drill"?"#fff":"var(--muted)")+"'>&#9660; Drill-down</button>"
      +"<button onclick='window._ftMode(\"full\")' style='font-size:.7rem;padding:.3rem .75rem;border-radius:.5rem;cursor:pointer;font-weight:600;border:1px solid var(--line);"
        +"background:"+(_mode==="full"?"var(--accent)":"var(--panel-alt)")+";color:"+(_mode==="full"?"#fff":"var(--muted)")+"'>&#9776; Full tree</button>"
      +"</div></div>";

    h+=(_mode==="drill"?_renderDrill():_renderFull());
    el.innerHTML=h;
  }

  /* ── DRILL-DOWN ── */
  function _renderDrill(){
    var h="";
    /* Patriarch row */
    h+="<div style='display:flex;flex-wrap:wrap;gap:.65rem;margin-bottom:.5rem'>";
    pList.forEach(function(m){
      var pid=m.PersonID||""; var col=_gc(m);
      var open=!!_exp[pid]; var kids=_kids(m);
      h+="<div onclick='window._ftClick(\""+escapeHtml(pid)+"\")'style='flex:1;min-width:210px;max-width:320px;border:2px solid "+(open?"var(--accent)":"var(--line)")+";border-radius:1rem;background:"+(open?"var(--accent-soft)":"var(--panel)")+";padding:.9rem;cursor:"+(kids.length?"pointer":"default")+";transition:background .15s'>"
        +_cardInner(m,44,col,kids.length?"<div style='flex-shrink:0;font-size:.62rem;color:var(--accent);margin-left:.25rem'>"+(open?"▲":"▼")+" "+kids.length+"</div>":"")
        +"</div>";
    });
    h+="</div>";
    /* Expanded levels */
    pList.forEach(function(m){ h+=_level(m,0); });
    /* Hint */
    if(!hasLinks) h+="<div style='margin-top:.75rem;padding:.4rem .65rem;border-radius:.5rem;background:var(--panel-alt);font-size:.68rem;color:var(--muted)'>ⓘ Add FatherID / MotherID to each member to show individual branches.</div>";
    return h;
  }

  function _level(parent,depth){
    if(!_exp[parent.PersonID||""]) return "";
    var kids=_kids(parent); if(!kids.length) return "";
    var kgen=String(kids[0].GenerationTier||kids[0].generation||"1");
    var col=GC[(gci[kgen]||depth+1)%GC.length];
    var indent=(depth+1)*18;
    var h="<div style='margin-left:"+indent+"px;border-left:2px dashed "+col.bd+";padding-left:.85rem;margin-top:.3rem;margin-bottom:.3rem'>";
    /* Level header */
    h+="<div style='display:flex;align-items:center;gap:.5rem;margin-bottom:.4rem'>"
      +"<span style='font-size:.58rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:"+col.tx+"'>"+escapeHtml(_gl(kgen))+" ("+kids.length+")</span>"
      +"<button onclick='window._ftClick(\""+escapeHtml(parent.PersonID||"")+"\");event.stopPropagation()' style='font-size:.58rem;padding:.15rem .45rem;border-radius:.35rem;border:1px solid var(--line);background:var(--panel-alt);color:var(--muted);cursor:pointer'>↑ Collapse</button>"
      +"</div>";
    /* Child cards */
    h+="<div style='display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:.4rem'>";
    kids.forEach(function(m){
      var cid=m.PersonID||""; var open=!!_exp[cid]; var gc=_kids(m);
      h+="<div onclick='window._ftClick(\""+escapeHtml(cid)+"\");event.stopPropagation()' style='border:"+(open?"2px":"1px")+" solid "+(open?col.bd:"var(--line)")+";border-left:3px solid "+col.bd+";border-radius:.75rem;background:"+(open?col.bg:"var(--panel)")+";padding:.6rem;cursor:"+(gc.length?"pointer":"default")+";transition:background .15s'>"
        +_cardInner(m,30,col,gc.length?"<div style='flex-shrink:0;font-size:.6rem;color:"+col.tx+"'>"+(open?"▲":"▼")+" "+gc.length+"</div>":"")
        +"</div>";
      if(_exp[cid]) h+=_level(m,depth+1);
    });
    h+="</div></div>";
    return h;
  }

  /* ── FULL TREE ── */
  function _renderFull(){
    var h="";
    genKeys.forEach(function(g,gi){
      var list=byGen[g]||[]; var col=GC[gi%GC.length];
      h+="<div style='margin-bottom:1.25rem'>"
        +"<div style='display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem'>"
        +"<span style='font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:"+col.tx+"'>"+escapeHtml(_gl(g))+"</span>"
        +"<div style='flex:1;height:1px;background:"+col.bd+";opacity:.2'></div>"
        +"<span style='font-size:.6rem;color:var(--muted)'>"+list.length+" member"+(list.length!==1?"s":"")+"</span>"
        +"</div>"
        +"<div style='display:grid;grid-template-columns:repeat(auto-fill,minmax("+(gi===0?"200":"150")+"px,1fr));gap:.45rem'>";
      list.forEach(function(m){
        var isP=pIDs[m.PersonID||""]; var col2=_gc(m);
        var father=byID[m.FatherID||""]; var mother=byID[m.MotherID||""];
        var pNote=father?"Child of "+escapeHtml(father.FullName||father.fullName||""):
                   mother?"Child of "+escapeHtml(mother.FullName||mother.fullName||""):"";
        h+="<div style='border:"+(isP?"2px":"1px")+" solid "+(isP?"var(--accent)":col2.bd)+";border-radius:.75rem;padding:.65rem;background:"+(isP?"var(--accent-soft)":"var(--panel)")+"'>"
          +_cardInner(m,isP?42:30,col2,"")
          +(pNote?"<div style='font-size:.58rem;color:var(--muted);margin-top:.2rem;border-top:1px solid var(--line);padding-top:.2rem'>"+pNote+"</div>":"")
          +"</div>";
      });
      h+="</div></div>";
    });
    return h;
  }

  /* ── Global event handlers ── */
  window._ftClick=function(pid){
    _exp[pid]=!_exp[pid];
    /* Fallback mode: collapse siblings when expanding to keep view clean */
    if(!hasLinks&&_exp[pid]){
      var m=byID[pid]; if(!m) return _render();
      var g=String(m.GenerationTier||m.generation||"1");
      (byGen[g]||[]).forEach(function(s){
        if((s.PersonID||"")!==pid){ _exp[s.PersonID||""]=false; }
      });
    }
    _render();
  };
  window._ftMode=function(mode){ _mode=mode; _exp={}; _render(); };

  _render();
};

window.saveFamilyPhoto = function(){
  var personId=((document.getElementById("family-photo-person-id")||{}).value||"").trim();
  var url=((document.getElementById("family-photo-url")||{}).value||"").trim();
  var type=((document.getElementById("family-photo-type")||{}).value||"profile")||"profile";
  if(!personId){ setFamilyError("PersonID is required for photo."); return; }
  var fi=document.getElementById("family-photo-file");
  function _doSave(photoURL,base64,mimeType){
    var payload={ PersonID:personId, PhotoFileURL:photoURL||"", PhotoType:type, PhotoBase64:base64||"", MimeType:mimeType||"" };
    google.script.run
      .withSuccessHandler(function(res){
        if(res&&res.success){ familyLoaded=false; loadFamilyData(); }
        else setFamilyError((res&&res.message)||"Failed to save photo.");
      })
      .withFailureHandler(function(err){ setFamilyError((err&&err.message)||"Failed."); })
      .upsertFamilyPhoto(token, payload);
  }
  if(fi&&fi.files&&fi.files[0]){
    var file=fi.files[0], reader=new FileReader();
    reader.onload=function(e){ _doSave("", e.target.result, file.type); };
    reader.readAsDataURL(file);
  } else { _doSave(url,"",""); }
};

window.renderSettingsSummary = function(settings){
  var el=document.getElementById("admin-settings-summary"); if(!el) return;
  var entries=Array.isArray(settings&&settings.entries)?settings.entries:[];
  entries.forEach(function(e){
    var k=String(e.Key||e.key||"").toLowerCase().replace(/[_\- ]/g,"");
    var isCalKey = k==="googlecalendarid"||k==="gcalendarid"
                 ||k==="calendarid"||k==="familycalendarid"
                 ||k==="gcalid"||k==="familygooglecalendarid";
    if(isCalKey){
      var v=String(e.Value||e.value||"").trim();
      if(v){
        window._gcalId=v;
        try{ localStorage.setItem("_tgbgcal",v); }catch(err){}
        if(typeof window._renderCalendarEmbed==="function")
          window._renderCalendarEmbed(v);
      }
    }
  });
  if(!entries.length){ el.innerHTML="<div style='color:var(--muted);font-size:.875rem'>No settings.</div>"; return; }
  el.innerHTML=entries.map(function(e){
    return "<div class='module-stat'><span>"+escapeHtml(e.Key||e.key||"")+"</span>"+
      "<span style='color:var(--muted);font-size:.72rem'>"+escapeHtml(String(e.Value||e.value||""))+"</span></div>";
  }).join("");
};

window.refreshMessages = function(){
  if(!selectedChannelID) return;
  setMessageError("");
  google.script.run
    .withSuccessHandler(function(res){
      var msgs=Array.isArray(res&&res.messages)?res.messages:[];
      var sent=Array.isArray(res&&res.sent)?res.sent:[];
      renderMessageHistory(msgs);
      _renderSentMessages(sent);
    })
    .withFailureHandler(function(err){
      if(isSessionExpiredError(err)){ onServerFailure(err); return; }
      setMessageError((err&&err.message)||"Failed to load messages.");
    })
    .getMessages(token, selectedChannelID);
};

function _renderSentMessages(sent){
  var el=document.getElementById("message-sent-list"); if(!el) return;
  if(!sent.length){ el.innerHTML="<div style='color:var(--muted);font-size:.8rem;padding:.4rem'>No sent messages.</div>"; return; }
  el.innerHTML=sent.map(function(m){
    return "<div style='padding:.4rem .5rem;border-radius:.6rem;margin-bottom:.25rem;background:var(--panel-alt)'>"+
      "<div style='font-size:.65rem;color:var(--muted)'>"+escapeHtml(formatDate(m.SentAt))+"</div>"+
      "<div style='font-size:.875rem;color:var(--ink)'>"+escapeHtml(m.Body||"")+"</div></div>";
  }).join("");
}

window.sendCurrentMessage = function(){
  var body=((document.getElementById("message-input")||{}).value||"").trim();
  var ri=document.getElementById("message-recipient-input");
  var recipEmail=(ri&&ri.dataset&&ri.dataset.email)||"";
  if(!body){ setMessageError("Message cannot be empty."); return; }
  if(!selectedChannelID){ setMessageError("Select a channel first."); return; }
  setMessageError("");
  var btn=document.getElementById("btn-send-message");
  if(btn){ btn.disabled=true; btn.innerText="Sending…"; }
  google.script.run
    .withSuccessHandler(function(res){
      if(btn){ btn.disabled=false; btn.innerText="Send"; }
      if(res&&res.success){
        var mi=document.getElementById("message-input"); if(mi) mi.value="";
        refreshMessages();
      } else { setMessageError((res&&res.message)||"Failed to send."); }
    })
    .withFailureHandler(function(err){
      if(btn){ btn.disabled=false; btn.innerText="Send"; }
      setMessageError((err&&err.message)||"Failed.");
    })
    .sendMessage(token, selectedChannelID, body, recipEmail);
};

  var matches=messagingRecipients.filter(function(r){

window.renderVoteChart = function(votes){
  var canvas=document.getElementById("vote-results-chart"); if(!canvas||!votes.length) return;
  if(voteChartInstance){ voteChartInstance.destroy(); voteChartInstance=null; }
  var target=votes.find(function(v){ return String(v.Status||"").toLowerCase()==="open"; })||votes[0];
  var isDark=_isDark();
  voteChartInstance=new Chart(canvas.getContext("2d"),{
    type:"bar",
    data:{ labels:["Yes","No","Abstain"],
      datasets:[{ data:[Number(target.yesCount||0),Number(target.noCount||0),Number(target.abstainCount||0)],
        backgroundColor:["#4edea3","#f87171","#94a3b8"], borderRadius:6, borderWidth:0 }] },
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false}, title:{display:true, text:escapeHtml(target.Title||""), color:isDark?"#e2e8f0":"#0f172a", font:{size:11} } },
      scales:{ x:{ticks:{color:isDark?"#94a3b8":"#64748b"}}, y:{ticks:{color:isDark?"#94a3b8":"#64748b"}, beginAtZero:true} }
    }
  });
};

window.loadProjectTasks = function(projectId){
  _setText("project-task-summary","Loading…");
  google.script.run
    .withSuccessHandler(function(res){ renderProjectTasks(Array.isArray(res&&res.tasks)?res.tasks:[]); })
    .withFailureHandler(function(err){
      if(isSessionExpiredError(err)){ onServerFailure(err); return; }
      setProjectError((err&&err.message)||"Failed to load tasks.");
    })

window.renderProjectTasks = function(tasks){
  _setText("project-task-summary", tasks.length+" task(s)");
  var el=document.getElementById("project-task-list"); if(!el) return;
  if(!tasks.length){ el.innerHTML="<div style='color:var(--muted);font-size:.875rem'>No tasks for this project.</div>"; return; }
  el.innerHTML=tasks.map(function(t){
    var p=Math.max(0,Math.min(100,Number(t.PercentComplete||0)));
    var sColor=/blocked/i.test(t.Status||"")?"var(--red)":/done/i.test(t.Status||"")?"var(--green)":"var(--accent)";
    return "<div class='ptv-shell p-3' style='margin-bottom:.5rem'>"+
      "<div style='display:flex;align-items:center;justify-content:space-between;gap:.5rem;flex-wrap:wrap'>"+
      "<div><div style='font-weight:600;color:var(--ink);font-size:.875rem'>"+escapeHtml(t.Title||t.TaskID||"Task")+"</div>"+
      "<div style='font-size:.68rem;color:var(--muted)'>"+escapeHtml(t.Status||"")+(t.Priority?" · "+escapeHtml(t.Priority):"")+(t.AssigneeName?" · "+escapeHtml(t.AssigneeName):"")+"</div></div>"+
      "<div style='font-weight:700;font-size:.875rem;color:"+sColor+"'>"+escapeHtml(formatPercent(p))+"</div></div>"+
      "<div style='margin-top:.4rem;height:4px;background:var(--panel-alt);border-radius:9999px;overflow:hidden'><div style='height:100%;background:"+sColor+";width:"+p+"%'></div></div></div>";
  }).join("");
};

      "<div style='font-size:.875rem;color:var(--ink);margin-top:.2rem'>"+escapeHtml(u.UpdateText||u.Body||"")+"</div></div>";

};

window._renderCalendarEmbed=function(calendarId){
  var wrap=document.getElementById("gcal-wrap");
  var setup=document.getElementById("gcal-setup");
  var iframe=document.getElementById("gcal-iframe");
  var openLink=document.getElementById("gcal-open-link");
  if(!wrap||!iframe) return;
  if(!calendarId){
    if(wrap) wrap.style.display="none";
    if(setup) setup.style.display="block";
    return;
  }
  var encId=encodeURIComponent(calendarId);
  var tz=(Intl&&Intl.DateTimeFormat&&Intl.DateTimeFormat().resolvedOptions().timeZone)||"UTC";
  var src="https://calendar.google.com/calendar/embed?src="+encId
    +"&ctz="+encodeURIComponent(tz)
    +"&showTitle=0&showNav=1&showDate=1&showPrint=0&showTabs=0&showCalendars=0&mode=MONTH";
  iframe.src=src;
  if(openLink) openLink.href="https://calendar.google.com/calendar/embed?src="+encId;
  if(wrap) wrap.style.display="block";
  if(setup) setup.style.display="none";
  /* Apply current theme filter after iframe loads */
  setTimeout(function(){
    var mode="auto";
    try{ mode=localStorage.getItem("togba-theme")||"auto"; }catch(e){}
    if(typeof window._applyCalendarFilter==="function")
      window._applyCalendarFilter(mode);
  }, 800);
};

window.renderTimelineCalendar = function(calendar){
  var el=document.getElementById("timeline-calendar"); if(!el) return;
  var months=calendar&&calendar.months?calendar.months:[];
  if(!months.length){ el.innerHTML="<div style='color:var(--muted);font-size:.875rem'>No calendar data.</div>"; return; }
  el.innerHTML=months.map(function(m){
    return "<div style='margin-bottom:.75rem'>"+
      "<div style='font-size:.68rem;font-weight:700;text-transform:uppercase;color:var(--muted);margin-bottom:.3rem'>"+escapeHtml(m.label||"")+"</div>"+
      "<div style='display:flex;flex-wrap:wrap;gap:4px'>"+
      (Array.isArray(m.days)?m.days.map(function(d){
        return "<div title='"+escapeHtml(d.title||"")+"' style='width:26px;height:26px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:600;background:"+(d.hasEvent?"var(--accent-soft)":"var(--panel-alt)")+";color:"+(d.hasEvent?"var(--accent)":"var(--muted)")+"'>"+escapeHtml(String(d.day||""))+"</div>";
      }).join(""):"")+
      "</div></div>";
  }).join("");
};
