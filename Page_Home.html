<div id="page-home" class="page active">

<div id="home-error" class="hidden err-box mb-3"></div>
<div id="home-status" class="state-box mb-4 hidden"></div>

<div class="grid grid-cols-12 gap-4 mb-5">

  <!-- Finance hero card -->
  <div class="col-span-12 lg:col-span-8 rounded-xl p-8 relative overflow-hidden" style="background:var(--panel-alt);">
    <div class="absolute top-0 right-0 h-56 w-56 rounded-full blur-3xl" style="background:color-mix(in srgb,var(--accent) 22%, transparent);"></div>
    <div class="relative z-10">
      <div class="text-[10px] uppercase tracking-[0.2em] font-bold" style="color:var(--muted);">Total Portfolio</div>
      <div id="home-finance-snapshot" class="mt-3 text-2xl md:text-4xl font-extrabold leading-tight" style="color:var(--ink);">Loading portfolio snapshot…</div>
      <div class="mt-8 h-28 w-full flex items-end gap-1.5">
        <div class="flex-1 rounded-t-sm h-[30%]" style="background:color-mix(in srgb,var(--green) 20%, transparent);"></div>
        <div class="flex-1 rounded-t-sm h-[40%]" style="background:color-mix(in srgb,var(--green) 25%, transparent);"></div>
        <div class="flex-1 rounded-t-sm h-[50%]" style="background:color-mix(in srgb,var(--green) 30%, transparent);"></div>
        <div class="flex-1 rounded-t-sm h-[58%]" style="background:color-mix(in srgb,var(--green) 36%, transparent);"></div>
        <div class="flex-1 rounded-t-sm h-[67%]" style="background:color-mix(in srgb,var(--accent-2) 35%, transparent);"></div>
        <div class="flex-1 rounded-t-sm h-[75%]" style="background:color-mix(in srgb,var(--accent-2) 45%, transparent);"></div>
        <div class="flex-1 rounded-t-sm h-[84%]" style="background:color-mix(in srgb,var(--accent) 48%, transparent);"></div>
        <div class="flex-1 rounded-t-sm h-[92%]" style="background:color-mix(in srgb,var(--accent) 62%, transparent);"></div>
        <div class="flex-1 rounded-t-sm h-full" style="background:linear-gradient(to top,color-mix(in srgb,var(--accent) 50%, transparent),var(--green));box-shadow:0 0 18px color-mix(in srgb,var(--green) 45%, transparent);"></div>
      </div>
    </div>
  </div>

  <!-- Projects card — entire card clickable -->
  <button onclick="showPage('projects')"
    class="col-span-12 md:col-span-6 lg:col-span-4 rounded-xl p-5 border text-left w-full"
    style="background:var(--panel);border-color:var(--line);cursor:pointer;transition:box-shadow .15s,background .15s;"
    onmouseover="this.style.background='var(--panel-high)';this.style.boxShadow='0 4px 18px color-mix(in srgb,var(--ink) 12%,transparent)';"
    onmouseout="this.style.background='var(--panel)';this.style.boxShadow='none';">
    <div class="flex items-center gap-3 mb-3">
      <span class="material-symbols-outlined" style="color:var(--accent);">rocket_launch</span>
      <div class="text-xs uppercase font-bold tracking-[0.12em]" style="color:var(--muted);">Projects</div>
      <span class="material-icons-round ml-auto" style="color:var(--muted);font-size:16px;">arrow_forward</span>
    </div>
    <div id="home-project-snapshot" class="text-sm" style="color:var(--ink);">Track active projects and delivery status.</div>
  </button>

  <!-- Governance card — entire card clickable -->
  <button onclick="showPage('voting')"
    class="col-span-12 md:col-span-6 lg:col-span-4 rounded-xl p-5 border text-left w-full"
    style="background:var(--panel);border-color:var(--line);cursor:pointer;transition:box-shadow .15s,background .15s;"
    onmouseover="this.style.background='var(--panel-high)';this.style.boxShadow='0 4px 18px color-mix(in srgb,var(--ink) 12%,transparent)';"
    onmouseout="this.style.background='var(--panel)';this.style.boxShadow='none';">
    <div class="flex items-center gap-3 mb-3">
      <span class="material-symbols-outlined" style="color:var(--accent);">how_to_vote</span>
      <div class="text-xs uppercase font-bold tracking-[0.12em]" style="color:var(--muted);">Governance</div>
      <span class="material-icons-round ml-auto" style="color:var(--muted);font-size:16px;">arrow_forward</span>
    </div>
    <div id="home-vote-snapshot" class="text-sm" style="color:var(--ink);">Review proposal outcomes and participation.</div>
  </button>

  <!-- Financial Distribution donut chart -->
  <div class="col-span-12 lg:col-span-8 rounded-xl p-6 border" style="background:var(--panel);border-color:var(--line);">
    <div class="text-xs uppercase font-bold tracking-[0.12em] mb-3" style="color:var(--muted);">Financial Distribution</div>
    <div class="chart-shell" style="height:200px;max-width:none;">
      <canvas id="financeChart" height="200"></canvas>
    </div>
    <div id="home-chart-empty" class="hidden mt-3 text-xs" style="color:var(--muted);">No chart data yet. Contributions and locks will appear here once records are available.</div>
  </div>

  <!-- Timeline highlights -->
  <div class="col-span-12 lg:col-span-4 rounded-xl p-5 border" style="background:var(--panel);border-color:var(--line);">
    <div class="flex items-center justify-between gap-3 mb-3">
      <div class="text-xs uppercase font-bold tracking-[0.12em]" style="color:var(--muted);">Timeline</div>
      <button onclick="loadHomeEssentials(true)" class="text-xs px-3 py-1.5 rounded-lg border" style="border-color:var(--line);background:var(--panel-alt);color:var(--ink);">Refresh</button>
    </div>
    <div id="home-timeline-snapshot" class="text-sm mb-3" style="color:var(--ink);">Loading timeline highlights…</div>
    <div id="home-activity-list" class="space-y-2"></div>
  </div>

</div>

<!-- System status bar -->
<div class="rounded-xl p-4 border mb-2" style="background:var(--panel);border-color:var(--line);">
  <div class="text-xs uppercase font-bold tracking-[0.12em] mb-2" style="color:var(--muted);">System Status</div>
  <div id="home-system-status" class="text-sm" style="color:var(--ink);">Waiting for dashboard metrics...</div>
</div>

<!-- Live asset ticker ribbon -->
<div style="overflow:hidden;border-radius:.75rem;background:var(--panel-alt);margin:.75rem 0;position:relative;">
  <div style="position:absolute;top:0;bottom:0;left:0;width:3rem;background:linear-gradient(90deg,var(--panel-alt),transparent);z-index:2;pointer-events:none;"></div>
  <div style="position:absolute;top:0;bottom:0;right:0;width:3rem;background:linear-gradient(270deg,var(--panel-alt),transparent);z-index:2;pointer-events:none;"></div>
  <div id="ticker-track" style="display:flex;width:max-content;animation:ribbon-scroll 35s linear infinite;padding:.55rem 1rem;"></div>
</div>

</div>
