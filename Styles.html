<style>

/* ================================================================
   SOVEREIGN VAULT DESIGN SYSTEM — v60
   ================================================================ */

/* ── LIGHT (default) ── */
:root {
  --app-bg:      #f9f9fe;
  --panel:       #ffffff;
  --panel-alt:   #f3f3f8;
  --panel-high:  #e8e8ed;
  --ink:         #1a1c1f;
  --muted:       #414755;
  --accent:      #0058bc;
  --accent-2:    #0070eb;
  --accent-soft: #dbeafe;
  --line:        #c1c6d7;
  --green:       #006e28;
  --amber:       #894d00;
  --red:         #ba1a1a;
  --sidebar-w:         280px;
  --sidebar-collapsed: 72px;
}

/* ── DARK (manual) ── */
html.dark {
  --app-bg:      #0b1326;
  --panel:       #131b2e;
  --panel-alt:   #171f33;
  --panel-high:  #222a3d;
  --ink:         #dae2fd;
  --muted:       #c2c6d6;
  --accent:      #adc6ff;
  --accent-2:    #4d8eff;
  --accent-soft: #1e2d4a;
  --line:        #424754;
  --green:       #4edea3;
  --amber:       #ffb95f;
  --red:         #ffb4ab;
}

/* ── AUTO DARK (follows OS) ── */
@media (prefers-color-scheme: dark) {
  html.theme-auto {
    --app-bg:      #0b1326;
    --panel:       #131b2e;
    --panel-alt:   #171f33;
    --panel-high:  #222a3d;
    --ink:         #dae2fd;
    --muted:       #c2c6d6;
    --accent:      #adc6ff;
    --accent-2:    #4d8eff;
    --accent-soft: #1e2d4a;
    --line:        #424754;
    --green:       #4edea3;
    --amber:       #ffb95f;
    --red:         #ffb4ab;
  }
}

/* ================================================================
   BASE
   ================================================================ */
*, *::before, *::after { box-sizing: border-box; }

body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--app-bg);
  color: var(--ink);
  margin: 0; padding: 0;
  -webkit-font-smoothing: antialiased;
}

/* ── DARK-MODE TAILWIND OVERRIDES (dark class) ── */
html.dark .bg-white,
html.dark .bg-slate-50  { background-color: var(--panel)     !important; }
html.dark .bg-slate-100 { background-color: var(--panel-alt) !important; }
html.dark .border-slate-100,
html.dark .border-slate-200 { border-color: var(--line) !important; }
html.dark .text-slate-900,
html.dark .text-slate-800 { color: var(--ink)   !important; }
html.dark .text-slate-700,
html.dark .text-slate-600,
html.dark .text-slate-500,
html.dark .text-slate-400 { color: var(--muted) !important; }
html.dark input,
html.dark select,
html.dark textarea {
  background-color: var(--panel-alt) !important;
  color: var(--ink) !important;
  border-color: var(--line) !important;
}
html.dark .shadow { box-shadow: 0 1px 6px rgba(0,0,0,.45) !important; }
html.dark nav#bottom-nav { background: color-mix(in srgb, var(--panel) 95%, transparent) !important; border-color: var(--line) !important; }

/* ── DARK-MODE TAILWIND OVERRIDES (auto, OS dark) ── */
@media (prefers-color-scheme: dark) {
  html.theme-auto .bg-white,
  html.theme-auto .bg-slate-50  { background-color: var(--panel)     !important; }
  html.theme-auto .bg-slate-100 { background-color: var(--panel-alt) !important; }
  html.theme-auto .border-slate-100,
  html.theme-auto .border-slate-200 { border-color: var(--line) !important; }
  html.theme-auto .text-slate-900,
  html.theme-auto .text-slate-800 { color: var(--ink)   !important; }
  html.theme-auto .text-slate-700,
  html.theme-auto .text-slate-600,
  html.theme-auto .text-slate-500,
  html.theme-auto .text-slate-400 { color: var(--muted) !important; }
  html.theme-auto input,
  html.theme-auto select,
  html.theme-auto textarea {
    background-color: var(--panel-alt) !important;
    color: var(--ink) !important;
    border-color: var(--line) !important;
  }
  html.theme-auto .shadow { box-shadow: 0 1px 6px rgba(0,0,0,.45) !important; }
  html.theme-auto nav#bottom-nav { background: color-mix(in srgb, var(--panel) 95%, transparent) !important; border-color: var(--line) !important; }
}

/* ================================================================
   SHARED HELPERS
   ================================================================ */
.vault-gradient { background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%); }

input, select, textarea {
  background: var(--panel-alt);
  border: 1px solid var(--line);
  border-radius: .75rem;
  color: var(--ink);
  font-family: inherit;
  transition: border-color .15s;
}
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--accent);
}

button { cursor: pointer; font-family: inherit; }

::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }

/* ================================================================
   LOGIN
   ================================================================ */
.login-shell {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1.5rem;
  background: var(--app-bg);
}

.login-card {
  width: 100%;
  max-width: 440px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 1.5rem;
  padding: 2rem;
}

.otp-code {
  letter-spacing: .5em;
  font-size: 1.3rem;
  font-weight: 700;
  text-align: center;
}

/* ================================================================
   SIDEBAR
   ================================================================ */
#sidebar {
  position: fixed;
  top: 0; left: 0;
  height: 100vh;
  width: var(--sidebar-w);
  z-index: 50;
  background: var(--panel);
  border-right: 1px solid var(--line);
  display: none;                     /* hidden on mobile; flex on md+ */
  flex-direction: column;
  transition: width .25s cubic-bezier(.4,0,.2,1);
  overflow: hidden;
}

#sidebar.sidebar-collapsed { width: var(--sidebar-collapsed); }

@media (min-width: 768px) { #sidebar { display: flex; } }

/* brand row */
.sidebar-brand {
  display: flex;
  align-items: center;
  gap: .75rem;
  padding: 1.1rem 1rem;
  border-bottom: 1px solid var(--line);
  min-height: 68px;
  flex-shrink: 0;
}

.sidebar-brand-icon {
  width: 38px; height: 38px;
  min-width: 38px;
  border-radius: .75rem;
  background: linear-gradient(145deg, var(--accent), var(--accent-2));
  display: flex; align-items: center; justify-content: center;
  color: #fff;
}

.sidebar-brand-text { overflow: hidden; min-width: 0; }
.sidebar-brand-name {
  font-size: .9rem; font-weight: 800;
  color: var(--ink); letter-spacing: -.02em; white-space: nowrap;
}
.sidebar-brand-sub {
  font-size: .55rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: .15em;
  color: var(--muted); white-space: nowrap;
}

.sidebar-toggle-btn {
  margin-left: auto; flex-shrink: 0;
  width: 26px; height: 26px;
  border-radius: .5rem;
  border: 1px solid var(--line);
  background: var(--panel-alt);
  color: var(--muted);
  display: flex; align-items: center; justify-content: center;
  transition: all .15s;
}
.sidebar-toggle-btn:hover { background: var(--accent-soft); color: var(--accent); }

/* nav area */
.sidebar-nav {
  flex: 1;
  overflow-y: auto; overflow-x: hidden;
  padding: .5rem;
  display: flex; flex-direction: column; gap: 1px;
}

.sidebar-section-label {
  font-size: .58rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: .12em;
  color: var(--muted);
  padding: .6rem .75rem .2rem;
  white-space: nowrap; overflow: hidden;
  transition: opacity .2s;
}

.sidebar-item {
  display: flex; align-items: center; gap: .75rem;
  padding: .55rem .75rem;
  border-radius: .75rem;
  color: var(--muted);
  font-size: .855rem; font-weight: 500;
  white-space: nowrap; width: 100%; text-align: left;
  background: transparent; border: none; outline: none;
  min-height: 42px;
  transition: background .15s, color .15s;
}
.sidebar-item:hover  { background: var(--accent-soft); color: var(--accent); }
.sidebar-item.sidebar-active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.sidebar-item.sidebar-sos    { color: var(--red); }
.sidebar-item.sidebar-sos:hover { background: rgba(186,26,26,.09); }

/* collapsible labels */
.sidebar-label {
  overflow: hidden; white-space: nowrap;
  transition: opacity .2s, max-width .25s;
  max-width: 200px;
}
#sidebar.sidebar-collapsed .sidebar-label     { opacity: 0; max-width: 0; }
#sidebar.sidebar-collapsed .sidebar-brand-text { opacity: 0; max-width: 0; }
#sidebar.sidebar-collapsed .sidebar-section-label { opacity: 0; }
#sidebar.sidebar-collapsed .sidebar-toggle-btn { margin-left: 0; }

/* footer */
.sidebar-footer {
  padding: .5rem;
  border-top: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 1px;
  flex-shrink: 0;
}

/* ================================================================
   TOPBAR
   ================================================================ */
.topbar {
  position: sticky; top: 0; z-index: 40;
  backdrop-filter: blur(12px);
  background: color-mix(in srgb, var(--app-bg) 82%, transparent);
  border-bottom: 1px solid var(--line);
}

.topbar-row {
  max-width: 1280px; margin: 0 auto;
  padding: .8rem 1rem;
  display: flex; align-items: center; justify-content: space-between; gap: .75rem;
}

.brand-mark { display: flex; align-items: center; gap: .75rem; }

.brand-dot {
  width: 2.1rem; height: 2.1rem; border-radius: .8rem;
  background: linear-gradient(145deg, var(--accent), var(--accent-2));
  box-shadow: 0 4px 14px rgba(37,99,235,.22);
  flex-shrink: 0;
}

.topbar-actions { display: flex; align-items: center; gap: .5rem; }

.theme-toggle-btn {
  display: flex; align-items: center; justify-content: center;
  width: 34px; height: 34px;
  border-radius: .6rem;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--muted);
  transition: all .15s;
}
.theme-toggle-btn:hover { background: var(--accent-soft); color: var(--accent); }

/* ================================================================
   LAYOUT
   ================================================================ */
.page        { display: none; }
.page.active { display: block; }

.app-shell {
  max-width: 1280px;
  margin: 0 auto;
  padding: 1.25rem 1rem 6rem;
}

@media (min-width: 768px) {
  #main-content {
    margin-left: var(--sidebar-w);
    transition: margin-left .25s cubic-bezier(.4,0,.2,1);
  }
  #main-content.sidebar-collapsed-content { margin-left: var(--sidebar-collapsed); }
  #bottom-nav { display: none !important; }
  .app-shell { padding-bottom: 2.5rem; }
}

/* ================================================================
   BOTTOM NAV  (mobile only)
   ================================================================ */
#bottom-nav {
  position: fixed;
  bottom: 0; left: 0; right: 0; z-index: 40;
  background: rgba(255,255,255,.96);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
  padding: .35rem .2rem;
  display: flex; justify-content: space-around; gap: 1px;
  overflow-x: auto;
}

#bottom-nav button {
  display: flex; flex-direction: column; align-items: center;
  font-size: 11px; color: var(--muted);
  border-radius: .6rem;
  padding: .35rem .5rem;
  min-width: 44px;
  transition: all .15s;
  border: none; background: transparent;
}
#bottom-nav button.active { color: var(--accent); background: var(--accent-soft); }
#bottom-nav button .material-icons-round { font-size: 22px; }

/* ================================================================
   DASHBOARD TILES
   ================================================================ */
.dashboard-tile {
  border: 1px solid var(--line);
  border-radius: 1rem;
  padding: .9rem;
  background: linear-gradient(180deg, var(--panel) 0%, var(--panel-alt) 100%);
  cursor: pointer;
  transition: transform .2s, box-shadow .2s;
}
.dashboard-tile:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.08); }

.home-hero-card {
  background: linear-gradient(135deg, var(--panel) 0%, var(--panel-alt) 100%);
}

/* ================================================================
   COMPONENT CLASSES  (used in JS render strings)
   ================================================================ */

/* ptv-shell — generic card wrapper */
.ptv-shell {
  background: var(--panel);
  border-radius: 1rem;
  border: 1px solid var(--line);
  overflow: hidden;
}

/* ptv-pill — status badge */
.ptv-pill {
  display: inline-flex; align-items: center;
  font-size: .68rem; font-weight: 600;
  padding: .2rem .6rem; border-radius: 9999px;
  white-space: nowrap;
}

/* ptv-metric — small stat box */
.ptv-metric {
  background: var(--panel-alt);
  border-radius: .75rem;
  padding: .45rem .6rem;
  text-align: center;
  border: 1px solid var(--line);
}

/* ptv-timeline-rail — timeline left rail */
.ptv-timeline-rail {
  position: relative;
  padding-left: 1.5rem;
  border-left: 2px solid var(--line);
}
.ptv-timeline-dot {
  position: absolute;
  left: -5px; top: 1rem;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--accent);
}

/* chip-soft */
.chip-soft {
  display: inline-flex; align-items: center;
  background: var(--accent-soft); color: var(--accent);
  font-size: .7rem; font-weight: 600;
  padding: .25rem .75rem; border-radius: 9999px;
}

/* state-box */
.state-box {
  padding: .6rem 1rem; border-radius: .75rem;
  background: var(--accent-soft); color: var(--accent);
  font-size: .85rem;
}

/* module-stat — key-value row */
.module-stat {
  display: flex; justify-content: space-between; align-items: center;
  padding: .4rem .75rem;
  background: var(--panel-alt);
  border-radius: .5rem;
  font-size: .8rem;
  border: 1px solid var(--line);
}

/* phase-module-summary */
.phase-module-summary {
  display: flex; flex-wrap: wrap; gap: .5rem;
  margin-bottom: 1rem;
}
.phase-summary-card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: .75rem;
  padding: .45rem .9rem;
  min-width: 80px;
}
.phase-summary-card .label {
  font-size: .6rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: .06em;
  color: var(--muted);
}
.phase-summary-card .value {
  font-size: 1.05rem; font-weight: 800;
  color: var(--ink);
}

/* ================================================================
   MESSAGING
   ================================================================ */
.messages-shell {
  display: grid;
  grid-template-columns: 265px 1fr;
  gap: 1rem;
  min-height: 70vh;
}
@media (max-width: 767px) { .messages-shell { grid-template-columns: 1fr; } }

.mail-panel {
  background: var(--panel);
  border-radius: 1rem;
  border: 1px solid var(--line);
  overflow: hidden;
}

.mail-panel-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: .7rem 1rem;
  border-bottom: 1px solid var(--line);
  background: var(--panel-alt);
}

.mail-section-title {
  font-size: .66rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: .08em;
  color: var(--muted);
}

.mail-pane {
  max-height: 320px;
  overflow-y: auto;
  padding: .25rem;
}

.mail-compose-box {
  resize: vertical;
  background: var(--panel-alt);
  border: 1px solid var(--line);
  border-radius: .75rem;
  color: var(--ink);
  font-family: inherit;
}
.mail-compose-box:focus { outline: none; border-color: var(--accent); }

/* ================================================================
   CHARTS
   ================================================================ */
.chart-shell {
  position: relative; width: 100%;
  max-width: 380px; height: 240px;
  margin: 0 auto;
}
.chart-shell-sm  { max-width: 280px; height: 180px; }
.vote-chart-shell { max-width: 380px; height: 220px; }

/* ================================================================
   COMING SOON SHELLS
   ================================================================ */
.coming-soon-shell {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  min-height: 52vh; text-align: center; gap: 1rem;
}
.coming-soon-icon {
  width: 72px; height: 72px;
  border-radius: 1.25rem;
  background: var(--accent-soft);
  display: flex; align-items: center; justify-content: center;
  color: var(--accent);
}

</style>
