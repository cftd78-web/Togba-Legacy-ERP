<script>
/* ================================================================
   THEME SYSTEM
   Modes: "auto" (OS), "light" (forced), "dark" (forced)
   Stored in localStorage key "togba-theme"
   ================================================================ */
(function(){
  var MODES  = ["auto","light","dark"];
  var ICONS  = { auto:"brightness_auto", light:"light_mode", dark:"dark_mode" };
  var LABELS = { auto:"Auto", light:"Light", dark:"Dark" };

  function _isDarkMode(mode){
    return mode==="dark" ||
      (mode==="auto" && window.matchMedia &&
       window.matchMedia("(prefers-color-scheme:dark)").matches);
  }

  function _applyCalendarFilter(mode){
    var iframe=document.getElementById("gcal-iframe"); if(!iframe) return;
    iframe.style.filter=_isDarkMode(mode)
      ? "invert(1) hue-rotate(180deg) brightness(.85) contrast(.9)"
      : "none";
    iframe.style.borderRadius=".85rem";
  }

  function applyTheme(mode){
    var h=document.documentElement;
    h.classList.remove("dark","light");
    if(mode==="dark")  h.classList.add("dark");
    if(mode==="light") h.classList.add("light");
    try{ localStorage.setItem("togba-theme", mode); }catch(e){}
    document.querySelectorAll("[data-theme-icon]").forEach(function(el){
      el.textContent=ICONS[mode]||"brightness_auto";
    });
    document.querySelectorAll("[data-theme-label]").forEach(function(el){
      el.textContent=LABELS[mode]||"Auto";
    });
    _applyCalendarFilter(mode);
  }

  window.cycleTheme=function(){
    var cur="auto";
    try{ cur=localStorage.getItem("togba-theme")||"auto"; }catch(e){}
    var idx=MODES.indexOf(cur);
    applyTheme(MODES[(idx+1)%MODES.length]);
  };

  /* Expose for use by _renderCalendarEmbed */
  window._applyCalendarFilter=_applyCalendarFilter;

  /* Watch OS-level dark mode changes (for auto mode) */
  try{
    window.matchMedia("(prefers-color-scheme:dark)")
      .addEventListener("change",function(){
        var cur="auto";
        try{ cur=localStorage.getItem("togba-theme")||"auto"; }catch(e){}
        if(cur==="auto") applyTheme("auto");
      });
  }catch(e){}

  /* Apply saved theme immediately */
  var saved="auto";
  try{ saved=localStorage.getItem("togba-theme")||"auto"; }catch(e){}
  applyTheme(saved);
})();
</script>
